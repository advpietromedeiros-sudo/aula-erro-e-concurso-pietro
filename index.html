<style>
:root{--z:1;--azul:#1947b8;--verm:#c8202a;--preto:#1c1c1f;--verde:#16714a;--ouro:#d59422;--papel:#fdfdfb;--linha:#dfe3ea;--sombra:0 6px 22px rgba(20,30,50,.10)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#e9ecf1;color:var(--preto);font:600 calc(21px * var(--z))/1.45 "Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}

.aba.on{background:var(--ouro);border-color:var(--ouro);color:#13213a}
.esp{flex:1}.bt.pdf{display:inline-flex;align-items:center;text-decoration:none;background:#c8202a;border-color:#c8202a;color:#fff;margin-left:.3rem}.bt.pdf:hover{filter:brightness(1.1)}@media print{.bt.pdf{display:none}}.cont{font-weight:800;color:#ffd67f;min-width:7.5rem;text-align:center;font-size:15px}
.bt{border:1px solid #34476a;background:#18294a;color:#fff;border-radius:9px;min-width:42px;height:40px;padding:0 .65rem;font-weight:800;font-size:14px}
.bt:hover,.bt:focus-visible{border-color:var(--ouro)}.bt.pri{background:var(--ouro);border-color:var(--ouro);color:#13213a}.bt.on{background:#2c6fd6;border-color:#2c6fd6}
/* quadro */
#palco{position:fixed;inset:58px 0 0 0;overflow:auto;scroll-behavior:smooth}
.quadro{display:none;min-height:100%;margin:12px;padding:calc(22px * var(--z)) calc(26px * var(--z)) 60px;background:var(--papel);border-radius:14px;box-shadow:inset 0 0 0 10px #c9ced8,inset 0 0 0 12px #aeb4c0,var(--sombra);position:relative}
.quadro.on{display:block}
.cab{text-align:center;margin-bottom:calc(14px * var(--z))}
.cab h1{margin:0;font:900 calc(46px * var(--z))/1.1 Georgia,serif;color:var(--azul);letter-spacing:.02em}
.cab p{margin:.2rem 0 0;color:#4a5262;font-size:calc(22px * var(--z))}
.cab .traco{display:block;width:180px;height:5px;background:var(--verm);border-radius:5px;margin:.5rem auto 0}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(520px * var(--z)),1fr));gap:calc(16px * var(--z))}
.bloco{position:relative;border:3px solid var(--linha);border-radius:16px;background:#fff;padding:calc(14px * var(--z)) calc(18px * var(--z)) calc(14px * var(--z));opacity:0;transform:translateY(14px) scale(.985);transition:opacity .45s,transform .45s,border-color .3s,box-shadow .3s;pointer-events:none}
.bloco.on{opacity:1;transform:none;pointer-events:auto}
.bloco.atual{border-color:var(--ouro);box-shadow:0 0 0 5px rgba(213,148,34,.25),var(--sombra)}
.bloco.sintese{grid-column:1/-1}
.num{position:absolute;top:-16px;left:14px;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--azul);color:#fff;font:900 18px Georgia,serif;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.bloco.r .num{background:var(--verm)}.bloco.k .num{background:var(--preto)}
.bloco h2{margin:.3rem 0 .45rem;font:900 calc(28px * var(--z))/1.15 Georgia,serif;color:var(--azul)}
.bloco.r h2{color:var(--verm)}.bloco.k h2{color:var(--preto)}
.res{margin:0;padding-left:1.1em}.res li{margin:.18em 0;font-size:calc(22px * var(--z))}
.leis{display:flex;flex-wrap:wrap;gap:.4rem;margin:.55em 0}
.lei{border:2px solid var(--azul);background:#eef3ff;color:var(--azul);border-radius:999px;padding:.1em .8em;font-weight:900;font-size:calc(17px * var(--z))}
.lei:hover{background:var(--azul);color:#fff}
.dia{border-left:6px solid var(--verde);background:#eaf7f0;border-radius:0 12px 12px 0;padding:.45em .75em;margin:.5em 0;font-size:calc(19.5px * var(--z));font-weight:600;color:#123d2b}
.dia b{display:block;font-size:.78em;letter-spacing:.08em;color:var(--verde)}
.peg{border-left:6px solid var(--verm);background:#fdeeee;border-radius:0 12px 12px 0;padding:.4em .75em;margin:.5em 0;font-size:calc(19px * var(--z));color:#7a1a1f}
.peg b{color:var(--verm)}
.vm{color:var(--verm);font-weight:900}
/* tipos penais na prática (11/11/2026): letra da lei com os ELEMENTOS DO TIPO em negrito vermelho */
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(420px * var(--z)),1fr));gap:.6em;margin:.5em 0 .6em}
.tipo{border:2px solid #d9cdef;background:#faf7ff;border-radius:14px;overflow:hidden}
.tipo>b{display:block;background:#efe8fb;color:#4b3477;padding:.3em .8em;font-size:calc(18px * var(--z))}
.tipo p{margin:0;padding:.45em .9em .3em;font-family:Georgia,serif;font-size:calc(24px * var(--z));line-height:1.55;text-align:justify;white-space:pre-line}
.tipo .el{color:var(--verm);font-weight:900}
.tipo ul{margin:0;padding:.2em .9em .55em 2em;font-size:calc(17.5px * var(--z));font-weight:600;color:#3a3f4a}.tipo li{margin:.12em 0;text-align:justify}
.tipo li .el{font-family:Georgia,serif}
/* textos justificados (pedido do titular, 10/11/2026); títulos e botões ficam como estão */
.res li,.dia,.peg,.folha p,.folha li,.artigo p,.jur p,.prova p{text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto}
.aprof{display:inline-flex;align-items:center;gap:.4em;margin-top:.4em;border:0;border-radius:12px;background:var(--azul);color:#fff;padding:.45em .9em;font-weight:900;font-size:calc(17px * var(--z));letter-spacing:.03em;box-shadow:0 4px 12px rgba(25,71,184,.3)}
.aprof:hover{filter:brightness(1.12)}
.completo{display:none;text-align:center;margin-top:18px;font:900 calc(22px * var(--z)) Georgia,serif;color:var(--verde)}
.quadro.cheio .completo{display:block}
/* tela de aprofundamento */
.tela{position:fixed;inset:0;z-index:60;display:none;background:rgba(10,18,32,.72);backdrop-filter:blur(3px)}
.tela.on{display:flex;align-items:stretch;justify-content:center;padding:2.2vh 2vw}
.folha{position:relative;width:min(1400px,100%);background:#fff;border-radius:20px;overflow:auto;padding:calc(26px * var(--z)) calc(40px * var(--z)) 40px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:sobe .25s ease}
@keyframes sobe{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.ftools{position:sticky;top:0;float:right;display:flex;gap:.4rem;z-index:2}
.ftools button{border:0;border-radius:12px;background:#0f1b30;color:#fff;font-weight:900;padding:.5em .9em;font-size:16px}
.ftools button:hover{background:#2c6fd6}
.folha .kick{font-size:calc(15px * var(--z));letter-spacing:.14em;font-weight:900;color:var(--ouro);text-transform:uppercase}
.folha h2{margin:.15em 0 .5em;font:900 calc(40px * var(--z))/1.12 Georgia,serif;color:var(--azul)}
.folha h3{margin:1em 0 .35em;font:900 calc(25px * var(--z)) Georgia,serif;display:flex;align-items:center;gap:.4em}
.folha p,.folha li{font-size:calc(23px * var(--z));font-weight:500;line-height:1.6}
.sec-dou h3{color:var(--azul)}
/* doutrina em cartões numerados, com os pontos-chave em negrito (pedido do titular, 10/11/2026) */
.dou{list-style:none;counter-reset:dou;margin:.3em 0 0;padding:0;display:grid;gap:.7em}
.dou li{counter-increment:dou;position:relative;background:#f5f8ff;border:1px solid #dbe4fb;border-left:7px solid var(--azul);border-radius:0 16px 16px 0;padding:.55em 1em .6em 3.1em}
.dou li::before{content:counter(dou);position:absolute;left:.75em;top:.7em;display:grid;place-items:center;width:1.65em;height:1.65em;border-radius:50%;background:var(--azul);color:#fff;font:900 calc(17px * var(--z)) Georgia,serif}
.dou li:nth-child(even){background:#fbfcff}
.dou p{margin:0;line-height:1.65}
/* mapa mental de perguntas-guia (10/11/2026): cada ＋ abre a resposta para baixo */
.mm{position:relative;margin:.35em 0 .3em .4em;padding-left:1.1em;border-left:4px solid #c9d6f5}
.no{position:relative;margin:.45em 0}
.no::before{content:"";position:absolute;left:-1.1em;top:1.05em;width:1em;border-top:4px solid #c9d6f5}
.nq{display:flex;align-items:center;gap:.5em;width:100%;text-align:left;border:2px solid #c9d6f5;background:#f4f7ff;color:var(--azul);border-radius:14px;padding:.35em .7em;font:900 calc(23px * var(--z))/1.3 "Segoe UI",Roboto,Arial,sans-serif}
.nq:hover{border-color:var(--azul)}
.mais{flex:none;display:grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;background:var(--azul);color:#fff;font-size:.85em;transition:transform .25s}
.no.on .mais{transform:rotate(45deg);background:var(--verm)}
.no.on .nq{background:#fff;border-color:var(--azul)}
.nr{display:none;margin:.35em 0 .2em .9em;padding:.45em .8em;border-left:4px solid var(--ouro);background:#fffdf6;border-radius:0 12px 12px 0;animation:abre .3s ease}
.no.on .nr{display:block}
@keyframes abre{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.nr p{margin:0;font-size:calc(22px * var(--z));font-weight:500;text-align:justify;hyphens:auto}
.nr .ng{color:#111;background:none;font-weight:900}
.nr .vm{color:var(--verm);font-weight:900}
.nr .artigo{margin:.5em 0 .2em}.nr .artigo p{font-size:calc(22px * var(--z))}
.exs{margin:.5em 0 .1em;display:grid;gap:.45em}
.ex{border:2px solid #b9e2c9;background:#effaf3;border-radius:12px;padding:.4em .7em}
.ex>p{margin:0;font-size:calc(20.5px * var(--z));font-weight:500;text-align:justify;hyphens:auto}
.ex>p::before{content:"📌 EXEMPLO · ";font-weight:900;font-size:.82em;letter-spacing:.06em;color:var(--verde)}
.ex .artigo{margin:.4em 0 0;border-color:#cdbfe9}.ex .artigo b{font-size:calc(15px * var(--z))}.ex .artigo p{font-size:calc(19px * var(--z))}
.res li .rex{display:block;margin:.15em 0 .35em;padding:.15em .6em;border-left:4px solid var(--verde);background:#effaf3;border-radius:0 8px 8px 0;font-size:.86em;font-weight:500;color:#123d2b}
.res li .rex::before{content:"Ex.: ";font-weight:900;color:var(--verde)}
.emres{display:none;margin-top:.5em;border:2px dashed #cfd6e2;border-radius:12px;padding:.3em .8em}
.emres>b{font-size:calc(15px * var(--z));letter-spacing:.1em;color:#4a5262}
.bloco.todas .emres{display:block}
.ng{font-weight:900;color:#0f2f86;background:linear-gradient(transparent 62%,#ffe8a3 62%);padding:0 .08em}.sec-lei h3{color:#5a3b9a}.sec-jur h3{color:#8a5a00}.sec-cas h3{color:var(--verde)}.sec-prova h3{color:var(--verm)}
.artigo{border:2px solid #d9cdef;background:#faf7ff;border-radius:14px;margin:.5em 0;overflow:hidden}
.artigo b{display:block;background:#efe8fb;color:#4b3477;padding:.35em .8em;font-size:calc(18px * var(--z))}
.artigo p{margin:0;padding:.5em .9em .7em;font-family:Georgia,serif;white-space:pre-line;font-size:calc(26px * var(--z));line-height:1.6}
.jur{border:2px solid #f0e2bb;background:#fffcf3;border-radius:14px;padding:.5em .9em;margin:.5em 0}
.jur b{color:#6e4c00;font-size:calc(18px * var(--z))}
.cas li{margin:.4em 0}
.prova{border:2px solid #f2c4c4;background:#fdf1f1;border-radius:14px;padding:.6em .9em}
/* caneta */
#tinta{position:fixed;left:0;top:58px;width:100vw;height:calc(100vh - 58px);z-index:20;pointer-events:none;touch-action:none;mix-blend-mode:multiply}
body.caneta #tinta{pointer-events:auto;cursor:crosshair}
.cores{display:none;gap:.3rem}body.caneta .cores{display:flex}
.cor{width:30px;height:30px;border-radius:50%;border:3px solid #fff;padding:0}.cor.grifa{border-radius:6px;width:34px;height:22px;border-color:#888}.sep{width:2px;height:28px;background:#34476a;margin:0 .2rem}.cor.on{outline:3px solid var(--ouro)}
.ajuda{position:fixed;right:14px;bottom:10px;z-index:25;font-size:13px;color:#4a5262;background:rgba(255,255,255,.85);border-radius:8px;padding:.2rem .6rem;font-weight:600}
@media print{.barra,.ajuda,#tinta{display:none}#palco{position:static;overflow:visible}body{overflow:visible}.bloco{opacity:1;transform:none}.quadro{display:block;box-shadow:none;break-after:page}}

<script id="dados" type="application/json">[{"quadro": 1, "titulo": "ESTUDO DO ERRO", "subtitulo": "Sobre o que o agente errou: o fato, a pessoa, o caminho ou a permissão?", "passos": [{"titulo": "PARA COMEÇAR: O QUE É UM TIPO PENAL", "cor": "r", "tipos": [{"chave": "CP:121", "rotulo": "Homicídio · CP, art. 121", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos.", "elementos": [{"t": "Matar", "nota": "o verbo (núcleo do tipo): a conduta de tirar a vida."}, {"t": "alguem", "nota": "o objeto: um ser humano vivo (a lei oficial grafa “alguem”). Quem atira achando que é um animal [[erra sobre este elemento]]."}]}, {"chave": "CP:155", "rotulo": "Furto · CP, art. 155", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa.", "elementos": [{"t": "Subtrair", "nota": "o verbo: tirar a coisa de quem a tem."}, {"t": "para si ou para outrem", "nota": "a finalidade: ficar com a coisa (elemento subjetivo especial)."}, {"t": "coisa", "nota": "o objeto material: um bem."}, {"t": "alheia", "nota": "elemento **normativo**: a coisa é de outra pessoa. Quem leva o guarda-chuva achando que é seu [[erra sobre este elemento]]."}, {"t": "móvel", "nota": "o bem pode ser levado de um lugar para outro."}]}, {"chave": "CP:157", "rotulo": "Roubo · CP, art. 157", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:\nPena – reclusão, de 6 (seis) a 10 (dez) anos, e multa.", "elementos": [{"t": "Subtrair coisa móvel alheia", "nota": "a mesma base do furto."}, {"t": "para si ou para outrem", "nota": "a finalidade de ficar com a coisa."}, {"t": "mediante grave ameaça ou violência a pessoa", "nota": "o **meio** que separa o roubo do furto."}, {"t": "reduzido à impossibilidade de resistência", "nota": "o meio alternativo: o “boa noite, Cinderela”, a droga na bebida."}]}, {"chave": "CP:171", "rotulo": "Estelionato · CP, art. 171", "texto": "Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio fraudulento:\nPena – reclusão, de 1 (um) a 5 (cinco) anos, e multa.", "elementos": [{"t": "Obter", "nota": "o verbo: conseguir a vantagem."}, {"t": "para si ou para outrem", "nota": "a finalidade: a vantagem é para o agente ou para alguém de quem ele queira."}, {"t": "vantagem ilícita", "nota": "o que o agente ganha, sem direito a isso."}, {"t": "em prejuízo alheio", "nota": "o dano de outra pessoa."}, {"t": "induzindo ou mantendo alguém em erro", "nota": "aqui o [[erro é da vítima]] e faz parte do crime; não confundir com o erro de tipo, que é do agente."}, {"t": "mediante artifício, ardil, ou qualquer outro meio fraudulento", "nota": "a fraude: o golpe do falso boleto, o falso funcionário do banco."}]}], "resumo": [{"t": "**Tipo penal** é a descrição da conduta proibida feita pela lei: verbo + objeto + o que mais o legislador exigiu.", "ex": "“Matar alguem”: o verbo é matar; o objeto, um ser humano vivo. Faltou um deles, não há homicídio."}, {"t": "Cada palavra que a lei exige é um **elemento do tipo** (elementar). Sem ela, o fato não se encaixa naquele crime.", "ex": "Levar a coisa que é SUA não é furto: falta a elementar “alheia”."}, {"t": "Elementares **descritivas** se veem com os olhos; **normativas** exigem um juízo (“alheia”, “ilícita”, “documento”).", "ex": "“Móvel” se percebe olhando; saber se a coisa é “alheia” depende de quem é o dono."}, {"t": "O **dolo** é saber e querer realizar TODOS os elementos do tipo. Errar sobre um deles é o [[erro de tipo]] (a seguir).", "ex": "O caçador que atira no vulto achando que é um javali não sabe que mata “alguem”: erro de tipo."}], "lei": [{"chave": "CP:121", "rotulo": "CP, art. 121, caput", "texto": "Matar alguem:"}, {"chave": "CP:155", "rotulo": "CP, art. 155, caput", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:"}, {"chave": "CP:157", "rotulo": "CP, art. 157, caput", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa"}, {"chave": "CP:171", "rotulo": "CP, art. 171, caput", "texto": "Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio fraudulento:"}], "exemplo": "No ponto de ônibus, Lúcia pega a sombrinha preta que estava encostada ao lado da sua, idêntica, e vai embora. O furto (art. 155) exige “coisa alheia”: Lúcia sabia que era uma sombrinha (coisa) que dava para levar (móvel), mas achava que era DELA. O erro recai sobre a elementar “alheia”: é erro de tipo.", "pegadinha": "No estelionato o “erro” está DENTRO do tipo (a vítima é enganada); no erro de tipo, quem se engana é o AGENTE. A banca troca os dois.", "aprofundar": {"doutrina": ["**Tipo penal** é o modelo legal da conduta proibida: o legislador descreve, com palavras, o comportamento que quer punir. Cada uma dessas palavras exigidas é um **elemento do tipo** (ou **elementar**). Se o fato concreto não preenche todas, não há adequação típica àquele crime: pode haver outro crime, ou nenhum.", "As elementares podem ser **descritivas** (percebidas pelos sentidos: “matar”, “coisa”, “móvel”), **normativas** (exigem valoração jurídica ou cultural: “alheia”, “vantagem ilícita”, “documento”) e **subjetivas** (finalidades especiais do agente: “para si ou para outrem”). Além delas, há **circunstâncias** que não criam o crime, mas mudam a pena (qualificadoras, causas de aumento).", "Essa lista é a chave do [[erro de tipo]] (CP, art. 20): como o **dolo** é consciência e vontade de realizar todos os elementos do tipo, quem ignora ou se engana sobre um deles não age com dolo. Por isso, antes de perguntar “houve erro de tipo?”, pergunte: **“qual elementar o agente desconhecia?”**."], "juris": [], "exemplos": ["Homicídio: o caçador atira num vulto achando que é javali; era um colega de caça. Erro sobre a elementar “alguem”.", "Roubo x furto: a mesma subtração vira roubo quando há grave ameaça ou violência a pessoa; sem esse meio, é furto.", "Estelionato: o falso funcionário do banco liga, a vítima acredita (é induzida em erro) e faz o PIX; a vantagem ilícita veio da fraude."], "prova": "A banca descreve o fato e pergunta qual é o crime ou se há erro de tipo: identifique o verbo, o objeto e as elementares exigidas pela lei; o erro de tipo é sempre sobre uma delas."}, "perguntas": [{"p": "O que é um tipo penal?", "r": "É a **descrição da conduta proibida** feita pela lei. No homicídio, o tipo é “Matar alguem”: o legislador descreve, com palavras, o que não se pode fazer.", "exemplos": [{"t": "Art. 121: “Matar alguem”. Verbo: matar. Objeto: alguém, um ser humano vivo."}]}, {"p": "O que são os elementos (elementares) do tipo?", "r": "São as **palavras que a lei exige** para o crime existir. No furto: [[subtrair]], [[para si ou para outrem]], [[coisa]], [[alheia]], [[móvel]]. Faltou uma, não é furto.", "exemplos": [{"t": "Quem leva um imóvel não comete furto: falta a elementar “móvel”. Quem leva a própria coisa também não: falta “alheia”."}]}, {"p": "Qual a diferença entre furto e roubo, olhando os tipos?", "r": "O roubo tem **tudo do furto** e mais um meio: [[mediante grave ameaça ou violência a pessoa]] (ou reduzir a vítima à impossibilidade de resistência).", "exemplos": [{"t": "Pegar o celular da mesa do bar enquanto o dono dança: furto. Tomar o celular apontando uma faca: roubo."}]}, {"p": "No estelionato, de quem é o erro?", "r": "Da **vítima**: ela é [[induzida ou mantida em erro]] pela fraude, e isso é elemento do crime. Não se confunde com o **erro de tipo**, que é do agente e exclui o dolo.", "exemplos": [{"t": "O golpe do falso boleto: a vítima paga achando que quita a conta; o erro dela é o que o estelionatário quis provocar."}]}, {"p": "Por que isso importa para o erro de tipo?", "r": "Porque o **dolo** é saber e querer realizar **todos** os elementos do tipo. Quem se engana sobre um deles age sem dolo: é o [[erro de tipo]] do art. 20, que vem a seguir.", "exemplos": [{"t": "Lúcia leva a sombrinha alheia achando que é a dela: não sabia da elementar “alheia”, logo não teve dolo de furtar."}]}]}, {"titulo": "ERRO E IGNORÂNCIA: AS DUAS ESPÉCIES", "cor": "b", "resumo": [{"t": "Erro = falsa percepção da realidade; ignorância = ausência de conhecimento.", "ex": "Ana acha que o celular do balcão é o seu (erro); Maria guarda uma caixa sem ter ideia do que há dentro (ignorância)."}, {"t": "Para o CP, os dois têm o mesmo tratamento jurídico.", "ex": "Tanto Ana, que pensa saber errado, quanto Maria, que nada sabe, são julgadas pelas mesmas regras dos arts. 20 e 21."}, {"t": "Erro de tipo: o agente não sabe O QUE faz (art. 20).", "ex": "João leva o guarda-chuva alheio achando que é o seu: não sabe que subtrai coisa ALHEIA (art. 155)."}, {"t": "Erro de proibição: sabe o que faz, mas acha que é PERMITIDO (art. 21).", "ex": "Paulo sabe que a carteira achada é de outro, mas crê que 'achado não é roubado' (art. 169, parágrafo único, II)."}, {"t": "Tipo: essencial ou acidental. Proibição: direto, indireto ou mandamental.", "ex": "Essencial: leva a bicicleta alheia achando ser sua; acidental: mata o vizinho pensando ser o pai; proibição: crê lícita a norma, a defesa ou a omissão."}], "lei": [{"chave": "CP:20", "rotulo": "CP, art. 20, caput", "texto": "O erro sobre elemento constitutivo do tipo legal de crime exclui o dolo, mas permite a punição por crime culposo, se previsto em lei."}, {"chave": "CP:21", "rotulo": "CP, art. 21, caput", "texto": "O desconhecimento da lei é inescusável. O erro sobre a ilicitude do fato, se inevitável, isenta de pena; se evitável, poderá diminuí-la de um sexto a um terço."}], "exemplo": "Na saída do supermercado, João leva para casa o guarda-chuva preto de outro cliente, idêntico ao seu: ele não sabe que a coisa é ALHEIA (erro de tipo). Já o turista que traz da viagem uma planta proibida, sabendo exatamente o que carrega, mas crendo que aqui é permitido, erra sobre a PROIBIÇÃO.", "pegadinha": "A banca troca os rótulos: quem sabe o que faz e só ignora que é proibido NÃO está em erro de tipo.", "aprofundar": {"doutrina": ["Tecnicamente, erro é o conhecimento falso sobre algo (o agente pensa que sabe, mas sabe errado), e ignorância é a ausência total de conhecimento. A distinção é conceitual: o Código Penal dá a ambos o mesmo tratamento, e a doutrina majoritária usa a palavra 'erro' para as duas situações.", "O mapa do erro, depois da reforma de 1984, segue a lógica finalista: o dolo migrou para o tipo, e a consciência da ilicitude (na forma potencial) ficou na culpabilidade. Daí a divisão: **erro de tipo** (art. 20) recai sobre os elementos do fato descrito no tipo e atinge o dolo; **erro de proibição** (art. 21) recai sobre a ilicitude do comportamento e atinge a culpabilidade. As velhas expressões 'erro de fato' e 'erro de direito' foram abandonadas porque não coincidem com essa divisão: há erro de tipo sobre elemento normativo (jurídico) e há erro de proibição sobre fato.", "O **erro de tipo** divide-se em essencial (sobre elementar ou circunstância: afasta o dolo) e acidental (sobre dados secundários: objeto, pessoa, execução, resultado, nexo causal; não afasta o dolo). O **erro de proibição** divide-se em direto (sobre a norma proibitiva), indireto (sobre a existência ou os limites de uma causa de justificação) e mandamental (nos crimes omissivos, sobre o dever de agir). Entre os dois grandes grupos estão as **descriminantes putativas**, cuja classificação depende da teoria da culpabilidade adotada.", "Há ainda o erro 'às avessas', que cria o **crime putativo**: no delito putativo por **erro de tipo**, o agente pensa praticar crime, mas falta uma elementar (vende talco pensando ser cocaína); no delito putativo por **erro de proibição**, o agente acredita que é crime uma conduta que a lei não pune (o incesto entre adultos, por exemplo). Em ambos não há crime."], "juris": [], "exemplos": ["Caçador atira em um vulto que supunha ser um animal e era um colega de caça → erro de tipo (não sabia que atirava em 'alguém').", "Pessoa que encontra uma carteira e fica com ela, crendo que 'achado não é roubado' → erro de proibição (sabe que a coisa é alheia; erra sobre a ilicitude da apropriação, CP 169, parágrafo único, II).", "Agente vende farinha pensando vender cocaína → crime putativo por erro de tipo; não há tráfico."], "prova": "A palavra que decide é o objeto do erro: se recai sobre a REALIDADE descrita no tipo (o que se faz), é erro de tipo; se recai sobre a PERMISSÃO jurídica (se pode fazer), é erro de proibição. 'Erro de fato' e 'erro de direito' aparecem como distratores."}, "perguntas": [{"p": "O que é o erro?", "r": "**Erro** é a [[falsa percepção da realidade]]: o agente acha que conhece, mas conhece errado. **Ignorância** é a [[ausência de conhecimento]]: ele simplesmente não sabe. Para o Código Penal, os dois recebem o **mesmo tratamento**.", "exemplos": [{"t": "**Erro** — Ana pega no balcão da festa um celular igual ao seu e vai embora com ele: ela *acha* que sabe de quem é a coisa, mas sabe errado. Não sabe que a coisa é **alheia**: [[o dolo de furto é excluído]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Art. 155 - Subtrair, para si ou para outrem, coisa alheia móvel:"}}, {"t": "**Ignorância** — Maria guarda para um vizinho uma caixa fechada, sem a menor ideia do que há dentro; eram joias roubadas. Ela nada sabe sobre a origem, e a receptação exige que o agente **saiba** ser produto de crime: [[não há receptação dolosa]].", "lei": {"chave": "CP:180", "rotulo": "CP, art. 180, caput (receptação)", "texto": "Art. 180 - Adquirir, receber, transportar, conduzir ou ocultar, em proveito próprio ou alheio, coisa que sabe ser produto de crime"}}]}, {"p": "Quais são as duas grandes espécies de erro?", "r": "O [[erro de tipo]] (art. 20): o agente **não sabe o que faz**, porque erra sobre um elemento do crime. O [[erro de proibição]] (art. 21): o agente **sabe o que faz**, mas acredita que a conduta é **permitida**.", "exemplos": [{"t": "**Erro de tipo** — na saída do supermercado, João leva o guarda-chuva preto de outro cliente, idêntico ao seu. Ele não sabe O QUE faz (não sabe que a coisa é alheia): [[exclui o dolo e, sem furto culposo, não há crime]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Art. 155 - Subtrair, para si ou para outrem, coisa alheia móvel:"}}, {"t": "**Erro de proibição** — Paulo acha uma carteira na calçada e fica com ela, convencido de que 'achado não é roubado'. Ele sabe que a carteira é de outro; erra só sobre a PROIBIÇÃO: [[responde pelo crime, com pena reduzida se o erro era evitável]].", "lei": {"chave": "CP:169", "rotulo": "CP, art. 169, parágrafo único, II (apropriação de coisa achada)", "texto": "II - quem acha coisa alheia perdida e dela se apropria, total ou parcialmente, deixando de restituí-la ao dono ou legítimo possuidor ou de entregá-la à autoridade competente, dentro no prazo de quinze dias."}}]}, {"p": "O que é o erro de tipo?", "r": "É o erro sobre um **elemento constitutivo do tipo penal**: uma elementar, uma circunstância ou um dado da descrição do crime. Quem não sabe que a coisa é alheia não tem **dolo** de subtrair coisa alheia. Por isso o erro de tipo [[sempre exclui o dolo]].", "exemplos": [{"t": "**Elementar 'alguém'** — o caçador atira num vulto no mato achando que é uma capivara; era outro caçador. Ele não sabia que matava **alguém**: [[não há homicídio doloso]]; se o erro veio de descuido, responde por homicídio culposo.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 3º (homicídio culposo)", "texto": "§ 3º Se o homicídio é culposo: (Vide Lei nº 4.611, de 1965)"}}, {"t": "**Elementar 'funcionário público'** — Rui xinga um homem à paisana numa fila, sem saber que era um policial em diligência. Faltou-lhe saber a qualidade de **funcionário público**: [[não há desacato]], e o fato desce para injúria.", "lei": {"chave": "CP:331", "rotulo": "CP, art. 331 (desacato)", "texto": "Art. 331 - Desacatar funcionário público no exercício da função ou em razão dela:"}}]}, {"p": "O que diz o art. 20?", "r": "Tradução: o erro sobre o tipo **exclui o dolo**. Se o erro era evitável, pune-se por **culpa**, mas [[só se existir a forma culposa do crime]].", "lei": {"chave": "CP:20", "rotulo": "CP, art. 20, caput", "texto": "Art. 20 - O erro sobre elemento constitutivo do tipo legal de crime exclui o dolo, mas permite a punição por crime culposo, se previsto em lei. (Redação dada pela Lei nº 7.209, de 11.7.1984)"}}, {"p": "O que é o erro de proibição?", "r": "É o erro sobre a **ilicitude do fato**: o agente enxerga a realidade corretamente, mas acredita que a sua conduta é **lícita**. Ele [[não exclui o dolo]]: atinge a **culpabilidade**, na potencial consciência da ilicitude.", "exemplos": [{"t": "**Erro sobre a ilicitude** — o agricultor de uma região isolada cria há décadas um papagaio herdado do avô, certo de que bicho 'de família' não é proibido. Ele sabe exatamente o que faz; [[o dolo permanece]], e, se o erro era inevitável, fica isento de pena.", "lei": {"chave": "L9605:29", "rotulo": "Lei 9.605/1998, art. 29, caput (crime contra a fauna)", "texto": "Art. 29. Matar, perseguir, caçar, apanhar, utilizar espécimes da fauna silvestre, nativos ou em rota migratória, sem a devida permissão, licença ou autorização da autoridade competente, ou em desacordo com a obtida:"}}, {"t": "**Erro evitável** — Paulo, que fica com a carteira achada crendo que 'achado não é roubado', tinha todos os meios de saber que devia devolver: [[responde pelo crime, com a pena reduzida de 1/6 a 1/3]].", "lei": {"chave": "CP:169", "rotulo": "CP, art. 169, parágrafo único, II (apropriação de coisa achada)", "texto": "II - quem acha coisa alheia perdida e dela se apropria, total ou parcialmente, deixando de restituí-la ao dono ou legítimo possuidor ou de entregá-la à autoridade competente, dentro no prazo de quinze dias."}}]}, {"p": "O que diz o art. 21?", "r": "Tradução: se o erro era [[inevitável, isenta de pena]]; se era [[evitável, diminui a pena de 1/6 a 1/3]]. E atenção: **desconhecer a lei** não desculpa ninguém.", "lei": {"chave": "CP:21", "rotulo": "CP, art. 21, caput", "texto": "Art. 21 - O desconhecimento da lei é inescusável. O erro sobre a ilicitude do fato, se inevitável, isenta de pena; se evitável, poderá diminuí-la de um sexto a um terço. (Redação dada pela Lei nº 7.209, de 11.7.1984)"}}, {"p": "Como cada espécie se divide?", "r": "O erro de tipo pode ser **essencial**, quando recai sobre elementar ou circunstância e [[exclui o dolo]], ou **acidental**, quando recai sobre objeto, pessoa, execução, resultado ou nexo e [[não exclui o dolo]]. O erro de proibição pode ser **direto** (sobre a norma), **indireto** (sobre uma causa de justificação) ou **mandamental** (sobre o dever de agir).", "exemplos": [{"t": "**Erro de tipo essencial sobre ELEMENTAR** — João leva do bicicletário a bicicleta do vizinho, idêntica à sua, achando que é a dele: erra sobre a elementar **coisa alheia** do furto. [[O dolo é excluído e, como não existe furto culposo, não há crime]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Art. 155 - Subtrair, para si ou para outrem, coisa alheia móvel:"}}, {"t": "**Erro de tipo essencial sobre CIRCUNSTÂNCIA (qualificadora)** — numa briga de rua, Caio mata um rapaz alto, de barba, que todos tomavam por adulto; a vítima tinha 13 anos. Ele erra sobre a qualificadora **contra menor de 14 anos**: [[cai a qualificadora e ele responde por homicídio simples (art. 121, caput)]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 2º, IX (homicídio qualificado)", "texto": "IX - contra menor de 14 (quatorze) anos: (Incluído pela Lei nº 14.344, de 2022) Vigência"}}, {"t": "**Erro de tipo acidental (sobre a pessoa)** — Pedro quer matar o próprio pai e, no escuro da garagem, atira no vizinho, que confundiu com ele por causa do boné. O erro é secundário: [[responde por homicídio doloso consumado, como se tivesse matado o pai]] (art. 20, § 3º).", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}, {"t": "**Erro de proibição DIRETO (sobre a norma)** — Paulo acha uma carteira na rua e fica com ela, crendo que nenhuma lei proíbe ficar com o que se acha. Erra sobre a própria **norma proibitiva**: [[evitável, pena reduzida; inevitável, isento de pena]].", "lei": {"chave": "CP:169", "rotulo": "CP, art. 169, parágrafo único, II (apropriação de coisa achada)", "texto": "II - quem acha coisa alheia perdida e dela se apropria, total ou parcialmente, deixando de restituí-la ao dono ou legítimo possuidor ou de entregá-la à autoridade competente, dentro no prazo de quinze dias."}}, {"t": "**Erro de proibição INDIRETO (sobre uma causa de justificação)** — Seu Zé vê o ladrão fugindo com sua galinha e atira nas pernas dele, crendo que a legítima defesa permite atirar em quem já foge. Erra sobre o **limite** da justificante: [[responde por lesão corporal dolosa, com pena reduzida se o erro era evitável]].", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, caput (lesão corporal)", "texto": "Art. 129. Ofender a integridade corporal ou a saúde de outrem:"}}, {"t": "**Erro de proibição MANDAMENTAL (sobre o dever de agir)** — Lúcia passa por um ciclista caído e ferido na estrada vazia e segue viagem, crendo que só quem causou o acidente tem obrigação de socorrer. Erra sobre o **dever de agir**: [[responde por omissão de socorro, com pena reduzida se o erro era evitável]].", "lei": {"chave": "CP:135", "rotulo": "CP, art. 135, caput (omissão de socorro)", "texto": "Art. 135 - Deixar de prestar assistência, quando possível fazê-lo sem risco pessoal, à criança abandonada ou extraviada, ou à pessoa inválida ou ferida, ao desamparo ou em grave e iminente perigo; ou não pedir, nesses casos, o socorro da autoridade pública:"}}]}]}, {"titulo": "ERRO DE TIPO ESSENCIAL", "cor": "b", "resumo": [{"t": "Recai sobre elementar ou circunstância do tipo: sempre exclui o dolo.", "ex": "João leva a bicicleta alheia achando ser sua (elementar); Caio mata um menor de 14 que parecia adulto (qualificadora)."}, {"t": "Escusável (invencível ou [[INEVITÁVEL]]): exclui dolo e culpa; fato atípico.", "ex": "O xarope veio do laboratório com rótulo trocado, impossível de perceber: não há crime nenhum."}, {"t": "Inescusável (vencível ou [[EVITÁVEL]]): exclui o dolo; pune por culpa, se houver tipo culposo.", "ex": "O pai que não confere a etiqueta e intoxica o filho responde por lesão corporal culposa (art. 129, § 6º)."}, {"t": "Sem tipo culposo, o erro vencível também leva à impunidade.", "ex": "Ana leva o celular alheio por desatenção: o erro era evitável, mas não existe furto culposo."}], "lei": [{"chave": "CP:20", "rotulo": "CP, art. 20, caput", "texto": "O erro sobre elemento constitutivo do tipo legal de crime exclui o dolo, mas permite a punição por crime culposo, se previsto em lei."}, {"chave": "CP:18", "rotulo": "CP, art. 18, parágrafo único", "texto": "Parágrafo único - Salvo os casos expressos em lei, ninguém pode ser punido por fato previsto como crime, senão quando o pratica dolosamente."}], "exemplo": "Na festa, Ana pega no balcão um celular igual ao seu e vai embora com ele: o erro exclui o dolo, e como não existe furto culposo, não há crime nenhum, ainda que ela tenha sido desatenta. Já o pai que, sem conferir a etiqueta, dá ao filho remédio errado e o intoxica responde por lesão culposa se o erro era evitável.", "pegadinha": "Erro de tipo inescusável não 'diminui pena': ele afasta o dolo e só deixa a culpa, se houver tipo culposo.", "aprofundar": {"doutrina": ["**Erro de tipo essencial** é a falsa representação sobre um elemento que compõe o tipo objetivo: elementares (descritivas, como 'alguém', ou normativas, como 'coisa alheia', 'documento') e circunstâncias (qualificadoras, causas de aumento). Como o dolo é consciência e vontade de realizar os elementos do tipo, quem não conhece um deles não pode tê-lo. Por isso o erro de tipo essencial SEMPRE **exclui o dolo**, seja ele **evitável** ou não.", "A diferença entre escusável e **inescusável** está na culpa. Escusável (**invencível**, inevitável) é o erro em que incorreria qualquer pessoa prudente naquelas circunstâncias: **exclui dolo e culpa**, e o fato é atípico. Inescusável (vencível, evitável) é o erro que um pouco de cuidado teria evitado: **exclui o dolo**, mas o agente responde por crime culposo, se a lei o previr. É a combinação com o art. 18, parágrafo único: a culpa é excepcional e precisa estar expressa.", "O critério de aferição é debatido. A doutrina tradicional fala no '**homem médio**'; parte da doutrina moderna prefere aferir pelas condições pessoais do agente (grau de instrução, experiência, circunstâncias do fato), o que torna a análise mais justa. Nas provas objetivas, costuma prevalecer a fórmula do homem médio associada às circunstâncias do caso concreto.", "Quando o erro recai sobre uma circunstância (qualificadora ou causa de aumento), afasta-se apenas ela, e o agente responde pelo tipo básico. E o **erro de tipo** pode afastar também uma elementar que transforma um crime em outro (desclassificação): quem desacata um policial à paisana sem saber que é funcionário público responde, em tese, por injúria, e não por desacato.", "No estupro de vulnerável, a Súmula 593 do STJ afasta a relevância do consentimento, da experiência sexual e do relacionamento amoroso. Ela não trata do erro sobre a idade: a doutrina admite, em tese, o **erro de tipo** quando o agente, por circunstâncias concretas e plausíveis, supõe que a vítima tem 14 anos ou mais. É tese de exceção, que depende de prova robusta, e o tema é sensível nas bancas."], "juris": [{"sumula": "SUM-STJ-593", "tribunal": "STJ", "rotulo": "Súmula 593/STJ", "texto": "O crime de estupro de vulnerável se configura com a conjunção carnal ou prática de ato libidinoso com menor de 14 anos, sendo irrelevante eventual consentimento da vítima para a prática do ato, sua experiência sexual anterior ou existência de relacionamento amoroso com o agente."}], "exemplos": ["Caçador, em mata fechada e ao entardecer, atira em vulto que se movia como animal e mata outro caçador fora da área permitida → se o erro era invencível, fato atípico; se vencível (atirou sem identificar o alvo), homicídio culposo.", "Mulher que, ao sair do hotel, leva por descuido a mala de outro hóspede → erro de tipo sobre 'coisa alheia'; sem furto culposo, não há crime, ainda que o erro fosse evitável.", "Agente que transporta pacote lacrado de um conhecido, sem qualquer indício de que havia droga → pode haver erro de tipo sobre a elementar 'droga'; tráfico não admite forma culposa, logo, provado o erro, não há crime."], "prova": "A banca escreve 'o erro de tipo inescusável exclui a culpa' ou 'diminui a pena': falso. A fórmula certa é 'sempre exclui o dolo; se vencível, permite a punição por culpa, SE PREVISTO EM LEI'."}, "perguntas": [{"p": "O que é o erro de tipo essencial?", "r": "É a falsa percepção sobre um **elemento do tipo**: uma elementar (como 'coisa alheia') ou uma circunstância (como uma qualificadora). Quem não sabe que realiza o tipo não pode querer realizá-lo: por isso o erro essencial [[sempre exclui o dolo]].", "exemplos": [{"t": "**Sobre elementar** — Ana sai da festa com o celular de outra convidada, idêntico ao seu: não sabe que a coisa é **alheia**. [[O dolo é excluído]], e como não há furto culposo, o fato é atípico.", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Art. 155 - Subtrair, para si ou para outrem, coisa alheia móvel:"}}, {"t": "**Sobre circunstância** — Caio mata, numa briga, um rapaz de 13 anos que aparentava ser adulto: erra sobre a qualificadora **contra menor de 14 anos**. [[Cai só a qualificadora; resta o homicídio simples]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 2º, IX (homicídio qualificado)", "texto": "IX - contra menor de 14 (quatorze) anos: (Incluído pela Lei nº 14.344, de 2022) Vigência"}}]}, {"p": "O que diz o art. 20?", "r": "Errou sobre o que compõe o crime, o dolo cai; mas, se o erro foi fruto de descuido e a lei previr a forma culposa, o agente [[responde por culpa]].", "lei": {"chave": "CP:20", "rotulo": "CP, art. 20, caput", "texto": "O erro sobre elemento constitutivo do tipo legal de crime exclui o dolo, mas permite a punição por crime culposo, se previsto em lei."}}, {"p": "Escusável ou inescusável?", "r": "**Escusável** (invencível) é o erro em que qualquer pessoa prudente cairia: [[exclui dolo e culpa]], e o fato é atípico. **Inescusável** (vencível) é o que um pouco de cuidado evitaria: exclui o dolo, mas deixa a culpa.", "exemplos": [{"t": "**Escusável** — a mãe dá ao filho o xarope de sempre, mas o frasco veio do laboratório com o rótulo trocado, impossível de perceber; a criança se intoxica. Qualquer pessoa prudente erraria: [[exclui dolo e culpa, o fato é atípico]].", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, caput (lesão corporal)", "texto": "Art. 129. Ofender a integridade corporal ou a saúde de outrem:"}}, {"t": "**Inescusável** — o pai, com pressa, pega no escuro o frasco errado do armário sem conferir a etiqueta e intoxica o filho. Bastava olhar: [[exclui o dolo, mas ele responde por lesão corporal culposa]].", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, § 6º (lesão culposa)", "texto": "§ 6° Se a lesão é culposa: (Vide Lei nº 4.611, de 1965)"}}]}, {"p": "E se não houver crime culposo?", "r": "Aí o erro vencível também leva à **impunidade**: a culpa só se pune quando a lei a prevê expressamente. Ana, que leva o celular alheio por desatenção, não comete crime, porque [[não existe furto culposo]].", "exemplos": [{"t": "**Furto** — Ana, desatenta, leva o celular alheio: o erro era evitável, mas [[não existe furto culposo]], logo não há crime.", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Art. 155 - Subtrair, para si ou para outrem, coisa alheia móvel:"}}, {"t": "**Dano** — o vizinho joga fora, na faxina, a bicicleta velha do outro, achando que era a sua sucata: ainda que tenha sido descuidado, [[não existe dano culposo]] e o fato é atípico na esfera penal.", "lei": {"chave": "CP:163", "rotulo": "CP, art. 163, caput (dano)", "texto": "Art. 163 - Destruir, inutilizar ou deteriorar coisa alheia:"}}]}, {"p": "O que diz o art. 18, parágrafo único?", "r": "A regra é o crime doloso; o **crime culposo** é exceção e precisa estar escrito na lei. É essa regra que fecha a conta do erro de tipo [[vencível]].", "lei": {"chave": "CP:18", "rotulo": "CP, art. 18, parágrafo único", "texto": "Parágrafo único - Salvo os casos expressos em lei, ninguém pode ser punido por fato previsto como crime, senão quando o pratica dolosamente."}}, {"p": "E se o erro recair sobre uma circunstância?", "r": "Cai só a **circunstância**: o agente responde pelo tipo básico, sem a qualificadora ou o aumento. E, se o erro afastar uma elementar que distingue um crime de outro, há [[desclassificação]], como no desacato ao policial à paisana, que vira injúria.", "exemplos": [{"t": "**Circunstância** — Caio não sabia que a vítima tinha 13 anos: [[responde por homicídio simples]], sem a qualificadora do § 2º, IX.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 2º, IX (homicídio qualificado)", "texto": "IX - contra menor de 14 (quatorze) anos: (Incluído pela Lei nº 14.344, de 2022) Vigência"}}, {"t": "**Elementar que distingue crimes** — Rui ofende um policial à paisana sem saber que é funcionário público em serviço: [[não há desacato; o fato é desclassificado para injúria]].", "lei": {"chave": "CP:140", "rotulo": "CP, art. 140, caput (injúria)", "texto": "Art. 140 - Injuriar alguém, ofendendo-lhe a dignidade ou o decoro:"}}]}]}, {"titulo": "DESCRIMINANTES PUTATIVAS", "cor": "r", "resumo": [{"t": "O agente imagina situação que, se existisse, tornaria a ação legítima.", "ex": "Carlos vê um vulto com algo brilhante na mão, pensa ser um ladrão armado e atira: era o filho com o celular."}, {"t": "Erro sobre os FATOS (art. 20 § 1º): erro de tipo permissivo.", "ex": "Carlos imagina uma agressão que não existe: o erro é sobre os fatos, tratado pelo art. 20, § 1º."}, {"t": "Erro sobre a EXISTÊNCIA ou LIMITES da justificante: erro de proibição indireto (art. 21).", "ex": "O credor que bate no devedor crendo que pode 'cobrar na marra' erra sobre a existência da justificante."}, {"t": "Erro de fato vencível → culpa imprópria, se houver tipo culposo.", "ex": "Carlos, que nem acendeu a luz antes de atirar no filho, recebe a pena do homicídio culposo."}, {"t": "CP adota a teoria limitada da culpabilidade (EM, item 19).", "ex": "Por isso o morador que atira no 'ladrão' imaginário cai no art. 20, § 1º, e quem atira no ladrão em fuga, no art. 21."}], "lei": [{"chave": "CP:20", "rotulo": "CP, art. 20, § 1º", "texto": "§ 1º - É isento de pena quem, por erro plenamente justificado pelas circunstâncias, supõe situação de fato que, se existisse, tornaria a ação legítima. Não há isenção de pena quando o erro deriva de culpa e o fato é punível como crime culposo."}], "exemplo": "De madrugada, Carlos ouve barulho na cozinha, vê um vulto com algo brilhante na mão e atira: era o filho, que voltara cedo da viagem, segurando o celular. Ele supôs uma agressão que não existia (legítima defesa putativa por erro sobre o fato). Se, ao contrário, Carlos acertasse o ladrão já em fuga, achando que a lei permite atirar em quem foge com seus bens, o erro seria sobre o LIMITE da legítima defesa: erro de proibição indireto.", "pegadinha": "Na legítima defesa putativa por erro de fato vencível, a pena é a do crime culposo, mas o agente agiu com dolo: é a 'culpa imprópria', que a maioria admite com tentativa.", "aprofundar": {"doutrina": ["**Descriminante putativa** é a causa de justificação (legítima defesa, estado de necessidade, estrito cumprimento do dever legal, exercício regular de direito) que existe só na cabeça do agente. O erro pode recair sobre três objetos: (a) os pressupostos de fato da justificante (ele imagina uma agressão que não existe); (b) a existência da justificante (ele pensa que existe uma permissão que a lei não prevê); (c) os limites da justificante (ele sabe que a permissão existe, mas a estende além do que a lei admite).", "A classificação depende da teoria da culpabilidade. Para a teoria extremada (ou estrita) da culpabilidade, de matriz finalista pura (Welzel), todo erro sobre causa de justificação é **erro de proibição**, inclusive o erro sobre fatos. Para a **teoria limitada da culpabilidade**, o erro sobre os pressupostos fáticos é **erro de tipo permissivo** e segue a disciplina do erro de tipo (art. 20, § 1º); o erro sobre existência e limites é **erro de proibição indireto** (art. 21). A Exposição de Motivos da Parte Geral, item 19, declara a adoção da teoria limitada, e essa é a resposta de prova.", "Consequências pela teoria limitada: erro de fato plenamente justificado (**invencível**) **isenta de pena**; erro de fato vencível leva à punição a título de culpa, se houver tipo culposo (a chamada **culpa imprópria**, por extensão ou por assimilação). **Erro de proibição indireto** inevitável isenta de pena; evitável diminui a pena de 1/6 a 1/3, mantido o crime doloso.", "Ponto controvertido: a redação do § 1º fala em '**isento de pena**', e não em '**exclui o dolo**', o que levou parte da doutrina a sustentar uma posição intermediária (teoria que remete à consequência jurídica, ou natureza sui generis): o dolo do tipo subsiste, e o que se afasta é a culpabilidade dolosa, aplicando-se a pena do culposo por política criminal. A posição majoritária e a das bancas segue a Exposição de Motivos: **erro de tipo permissivo**.", "A **culpa imprópria** é a grande exceção didática: o agente quer o resultado (age com dolo), mas é punido como se fosse culposo, porque a vontade nasceu de um erro **evitável**. Daí a conclusão, majoritária, de que ela admite tentativa, coisa impossível na culpa própria. Não se confunde com o excesso nas justificantes reais (CP, art. 23, parágrafo único), em que a situação justificante existe e o agente vai além dela."], "juris": [], "exemplos": ["Segurança vê cliente enfiar a mão no casaco de forma brusca após uma discussão e o imobiliza com violência, supondo que sacaria arma; era a carteira → legítima defesa putativa por erro de fato; se o erro era plenamente justificado, isenção; se não, lesão corporal culposa (culpa imprópria).", "Dono de sítio que pensa ter o direito de 'castigar' fisicamente o invasor já rendido → erro sobre os limites da legítima defesa: erro de proibição indireto (art. 21).", "Agente que, por erro evitável sobre a agressão, atira para matar e erra o alvo → tentativa de homicídio punida com a pena do homicídio culposo reduzida, segundo a corrente majoritária sobre a culpa imprópria."], "prova": "Palavras-chave: 'supõe situação de FATO' → art. 20, § 1º (erro de tipo permissivo); 'supõe estar AUTORIZADO' ou 'acredita poder ir além' → art. 21 (erro de proibição indireto). Teoria adotada: LIMITADA da culpabilidade."}, "perguntas": [{"p": "O que é uma descriminante putativa?", "r": "É uma **causa de justificação** que só existe na cabeça do agente: ele pensa agir em legítima defesa, estado de necessidade ou outra permissão que, na realidade, [[não está presente]].", "exemplos": [{"t": "**Legítima defesa putativa** — de madrugada, Carlos vê um vulto com algo brilhante na mão na cozinha e atira: era o filho com o celular. A agressão só existia na cabeça dele: se o erro era plenamente justificado, [[fica isento de pena]]; se veio de descuido, responde por homicídio culposo.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 3º (homicídio culposo)", "texto": "§ 3º Se o homicídio é culposo: (Vide Lei nº 4.611, de 1965)"}}, {"t": "**Estado de necessidade putativo** — no cinema, alguém grita 'fogo!' e Rita, para fugir, empurra e fere um senhor; era alarme falso. Ela supôs um perigo que não existia: [[isenta de pena se o erro era justificado]].", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, caput (lesão corporal)", "texto": "Art. 129. Ofender a integridade corporal ou a saúde de outrem:"}}]}, {"p": "Sobre o que o agente pode errar?", "r": "Sobre três coisas: os **fatos** (imagina uma agressão que não existe), a **existência** da permissão (crê numa justificante que a lei não prevê) ou os **limites** dela (vai além do que a lei admite). A [[classificação depende do objeto]] do erro.", "exemplos": [{"t": "**Sobre os FATOS** — Carlos imagina uma agressão que não existe e atira no filho: erro de tipo permissivo (art. 20, § 1º), e, se evitável, [[homicídio culposo]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 3º (homicídio culposo)", "texto": "§ 3º Se o homicídio é culposo: (Vide Lei nº 4.611, de 1965)"}}, {"t": "**Sobre a EXISTÊNCIA** — o credor dá socos no devedor crendo que a lei lhe permite 'cobrar na marra'. Não existe essa justificante: erro de proibição indireto, e [[ele responde por lesão corporal dolosa]], com redução se o erro era evitável.", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, caput (lesão corporal)", "texto": "Art. 129. Ofender a integridade corporal ou a saúde de outrem:"}}, {"t": "**Sobre os LIMITES** — Carlos atira no ladrão que já foge, crendo que a legítima defesa vai até aí: erro de proibição indireto, e [[responde por homicídio doloso]], com redução se o erro era evitável.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}]}, {"p": "O que diz o art. 20, § 1º?", "r": "Quem, por erro plenamente justificado, imagina uma situação de fato que tornaria a ação legítima fica [[isento de pena]]; se o erro veio de descuido e há tipo culposo, responde por **culpa**.", "lei": {"chave": "CP:20", "rotulo": "CP, art. 20, § 1º", "texto": "§ 1º - É isento de pena quem, por erro plenamente justificado pelas circunstâncias, supõe situação de fato que, se existisse, tornaria a ação legítima. Não há isenção de pena quando o erro deriva de culpa e o fato é punível como crime culposo."}}, {"p": "Qual teoria o Código adotou?", "r": "A **teoria limitada da culpabilidade** (Exposição de Motivos, item 19): erro sobre os fatos é [[erro de tipo permissivo]] (art. 20, § 1º); erro sobre existência ou limites é **erro de proibição indireto** (art. 21)."}, {"p": "O que é a culpa imprópria?", "r": "É o caso do erro de fato **vencível**: o agente quis o resultado, agiu com dolo, mas é punido com a pena do crime culposo. Por isso a maioria entende que ela [[admite tentativa]], ao contrário da culpa própria.", "exemplos": [{"t": "**Culpa imprópria** — Carlos, que nem acendeu a luz para ver quem era, atira querendo acertar o 'ladrão' e mata o filho. Agiu com dolo, mas o erro era vencível: [[recebe a pena do homicídio culposo]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 3º (homicídio culposo)", "texto": "§ 3º Se o homicídio é culposo: (Vide Lei nº 4.611, de 1965)"}}, {"t": "**Com tentativa** — se o filho sobrevive, a maioria admite [[tentativa de homicídio culposo]], porque havia vontade de matar: só a pena é a do crime culposo.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 3º (homicídio culposo)", "texto": "§ 3º Se o homicídio é culposo: (Vide Lei nº 4.611, de 1965)"}}]}, {"p": "E se Carlos atira no ladrão que já foge?", "r": "Aí ele não erra sobre o fato: sabe que o ladrão está fugindo e acha que a lei permite atirar. O erro recai sobre o **limite** da legítima defesa: é [[erro de proibição indireto]], resolvido pelo art. 21.", "exemplos": [{"t": "**Limite da justificante** — o ladrão já pulou o muro com a TV quando Carlos atira pelas costas e o mata. Não há erro sobre o fato: [[responde por homicídio doloso]], com redução de 1/6 a 1/3 se o erro era evitável (art. 21).", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}]}]}, {"titulo": "ERRO DETERMINADO POR TERCEIRO", "cor": "k", "resumo": [{"t": "Quem provoca o erro responde pelo crime (art. 20 § 2º).", "ex": "O médico que entrega o veneno à enfermeira dizendo ser antibiótico responde pelo homicídio."}, {"t": "Terceiro com dolo: crime doloso; com culpa: crime culposo.", "ex": "Médico que troca o remédio de propósito: homicídio doloso; farmacêutico distraído que troca o rótulo: homicídio culposo."}, {"t": "O enganado segue as regras do erro: escusável isenta; vencível, culpa.", "ex": "A enfermeira que recebe a seringa rotulada do médico fica impune; a que não lê a prescrição responde por culpa."}, {"t": "Terceiro que usa o enganado é autor mediato.", "ex": "O patrão que manda o empregado buscar 'a sua' bicicleta na garagem do vizinho é autor mediato de furto."}], "lei": [{"chave": "CP:20", "rotulo": "CP, art. 20, § 2º", "texto": "§ 2º - Responde pelo crime o terceiro que determina o erro."}], "exemplo": "O médico, querendo matar o paciente, entrega à enfermeira uma seringa com veneno dizendo ser o antibiótico prescrito; ela aplica sem desconfiar. O médico responde por homicídio doloso como autor mediato; a enfermeira, se o erro era invencível, não responde por nada.", "pegadinha": "O erro provocado não beneficia quem o provocou: o terceiro responde, e o enganado é avaliado pelas regras comuns do erro.", "aprofundar": {"doutrina": ["No **erro determinado por terceiro**, o agente não erra sozinho: alguém o induz a erro. O § 2º manda punir o terceiro que determina o erro, na modalidade em que agiu: se provocou o erro dolosamente, responde pelo crime doloso; se o provocou por culpa (sem querer, por descuido), responde pelo crime culposo, se houver previsão legal.", "Quanto ao provocado, aplicam-se as regras gerais: se o erro era **invencível**, fica impune; se era **vencível**, responde por culpa, se houver tipo culposo. Assim, pode haver punição dos dois: o terceiro por dolo e o enganado por culpa, sem **concurso de pessoas** entre eles, porque falta o liame subjetivo dirigido ao mesmo fim.", "Dogmaticamente, quando o terceiro age com dolo e se vale de quem atua sem dolo, a hipótese é de **autoria mediata**: o executor é mero instrumento, e o 'homem de trás' domina o fato (teoria do domínio do fato). É uma das situações clássicas de autoria mediata, ao lado da coação moral irresistível e da obediência hierárquica (CP, art. 22) e do uso de inimputável."], "juris": [], "exemplos": ["Diretor de teatro troca a arma cenográfica por uma verdadeira e carregada; o ator dispara na cena e mata o colega → diretor: homicídio doloso (autor mediato); ator: fato atípico, se nada indicava a troca.", "Farmacêutico entrega por distração frasco errado ao enfermeiro, que, sem ler o rótulo, ministra a substância e lesiona o paciente → ambos podem responder por lesão culposa, cada um pela sua culpa."], "prova": "A banca descreve o cenário do 'ator e da arma trocada' ou da 'enfermeira e da injeção'. Resposta: responde o terceiro que determinou o erro (autor mediato); o executor só responde se o erro era evitável e houver tipo culposo."}, "perguntas": [{"p": "O que é o erro determinado por terceiro?", "r": "É o erro que o agente não comete sozinho: **alguém o induz** a erro. O enganado executa a conduta, mas quem [[provocou o engano]] também entra na conta.", "exemplos": [{"t": "**Erro provocado com dolo** — o médico, querendo matar o paciente, entrega à enfermeira uma seringa com veneno dizendo ser antibiótico. [[O médico responde por homicídio qualificado pelo veneno]]; a enfermeira enganada, se o erro era invencível, não responde.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 2º, III (homicídio qualificado)", "texto": "III - com emprego de veneno, fogo, explosivo, asfixia, tortura ou outro meio insidioso ou cruel, ou de que possa resultar perigo comum;"}}]}, {"p": "O que diz o art. 20, § 2º?", "r": "Quem provoca o erro [[responde pelo crime]]: o engano que ele criou não o beneficia.", "lei": {"chave": "CP:20", "rotulo": "CP, art. 20, § 2º", "texto": "§ 2º - Responde pelo crime o terceiro que determina o erro."}}, {"p": "O terceiro responde por dolo ou por culpa?", "r": "Depende de como provocou o erro: se de propósito, responde pelo **crime doloso**; se por descuido, pelo **crime culposo**, desde que [[previsto em lei]].", "exemplos": [{"t": "**Com dolo** — o médico que troca o remédio de propósito: [[homicídio doloso]], qualificado pelo veneno.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 2º, III (homicídio qualificado)", "texto": "III - com emprego de veneno, fogo, explosivo, asfixia, tortura ou outro meio insidioso ou cruel, ou de que possa resultar perigo comum;"}}, {"t": "**Com culpa** — o farmacêutico do hospital, distraído, rotula veneno como antibiótico e a enfermeira o aplica: ele [[responde por homicídio culposo]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 3º (homicídio culposo)", "texto": "§ 3º Se o homicídio é culposo: (Vide Lei nº 4.611, de 1965)"}}]}, {"p": "E o enganado, responde?", "r": "Segue as regras gerais do erro de tipo: se o erro era **invencível**, fica impune; se era **vencível**, responde por culpa, se houver tipo culposo. Os dois podem ser punidos, mas [[sem concurso de pessoas]], porque falta o liame subjetivo.", "exemplos": [{"t": "**Erro invencível** — a enfermeira recebe a seringa lacrada e rotulada do próprio médico: [[não responde por nada]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}, {"t": "**Erro vencível** — a enfermeira aplica a dose sem ler a prescrição, que mandava outro remédio: [[responde por homicídio culposo]], ao lado do médico, mas sem concurso de pessoas.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 3º (homicídio culposo)", "texto": "§ 3º Se o homicídio é culposo: (Vide Lei nº 4.611, de 1965)"}}]}, {"p": "Qual é a figura dogmática do terceiro que age com dolo?", "r": "É a **autoria mediata**: o executor é mero instrumento, e o 'homem de trás' domina o fato. O médico que entrega o veneno à enfermeira é [[autor mediato]] de homicídio doloso.", "exemplos": [{"t": "**Autoria mediata** — o patrão manda o empregado buscar 'a bicicleta dele' na garagem do vizinho, sabendo que não é sua. O empregado age em erro de tipo: [[o patrão responde por furto como autor mediato]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Art. 155 - Subtrair, para si ou para outrem, coisa alheia móvel:"}}]}]}, {"titulo": "ERRO SOBRE OBJETO E PESSOA", "cor": "b", "resumo": [{"t": "Erro acidental: recai sobre dado secundário; NÃO exclui o dolo.", "ex": "O ladrão que leva bijuteria achando ser celular errou um dado secundário: o furto continua inteiro."}, {"t": "Erro sobre o objeto: queria uma coisa, levou outra; responde pelo que fez.", "ex": "Quem leva a caixa de bijuteria achando que era um celular responde por furto da bijuteria que levou."}, {"t": "Erro sobre a pessoa: confunde a vítima por erro de REPRESENTAÇÃO.", "ex": "Pedro vê o vizinho de boné no escuro, pensa que é o pai e acerta exatamente quem mirou."}, {"t": "Considera-se a vítima VIRTUAL (quem ele queria), não a real.", "ex": "Pedro, que mata o vizinho pensando ser o pai, responde com a agravante de crime contra ascendente (art. 61, II, e)."}], "lei": [{"chave": "CP:20", "rotulo": "CP, art. 20, § 3º", "texto": "§ 3º - O erro quanto à pessoa contra a qual o crime é praticado não isenta de pena. Não se consideram, neste caso, as condições ou qualidades da vítima, senão as da pessoa contra quem o agente queria praticar o crime."}], "exemplo": "Pedro quer matar o próprio pai e, no escuro da garagem, atira no vizinho, que ele confundiu com o pai por usar o mesmo boné. Responde por homicídio com a agravante de crime contra ascendente (CP, art. 61, II, e), como se tivesse matado o pai. Já quem furta uma caixa achando que levava um celular, e ela continha só bijuteria, responde por furto do mesmo jeito.", "pegadinha": "No erro sobre a pessoa, as qualidades da vítima REAL são desprezadas: contam as da vítima VIRTUAL, para agravar ou para beneficiar.", "aprofundar": {"doutrina": ["**Erro de tipo acidental** recai sobre dados periféricos do crime, que não mudam a sua essência. Por isso não exclui o dolo nem a culpa: o agente sabia que praticava um crime e quis praticá-lo. As espécies são: **erro sobre o objeto** (error in objecto), **erro sobre a pessoa** (error in persona), erro na execução (aberratio ictus), resultado diverso do pretendido (**aberratio criminis**) e erro sobre o nexo causal (aberratio causae).", "No **erro sobre o objeto**, o agente confunde a coisa visada (quer subtrair um relógio de ouro e leva um folheado). Não há regra no CP; a doutrina responde: o agente responde pelo crime praticado, considerando-se a coisa efetivamente atingida. Parte da doutrina adverte que, se o erro sobre o objeto mudar a natureza do crime (pensa subtrair açúcar e leva cocaína, por exemplo), não se trata mais de erro acidental, mas de erro essencial quanto à elementar diferente.", "No **erro sobre a pessoa**, o problema é de REPRESENTAÇÃO: o agente identifica mal a vítima, mas a execução é perfeita (ele acerta exatamente quem mirou). O § 3º manda considerar as condições e qualidades da **vítima virtual** (a pretendida), e não da **vítima real**. Isso vale nos dois sentidos: aplicam-se as agravantes, qualificadoras e causas de aumento ligadas à vítima pretendida e afastam-se as ligadas à vítima atingida.", "Ponto de atenção: a ficção da **vítima virtual** vale para a tipificação e para as circunstâncias do crime. Se ela alcança também regras de competência (por exemplo, quando a vítima pretendida atrairia competência diversa da **vítima real**), há divergência doutrinária; nas provas objetivas, a cobrança concentra-se na tipificação e nas agravantes."], "juris": [], "exemplos": ["Agente quer matar a ex-mulher por razões da condição do sexo feminino e, por erro de identificação, mata a irmã gêmea dela → responde como se tivesse matado a ex-mulher (vítima virtual), com as circunstâncias ligadas a ela.", "Agente quer matar um desafeto de 30 anos e mata por engano um idoso de 70 → não incide o aumento ligado à idade da vítima real, porque contam as qualidades da vítima virtual.", "Ladrão subtrai bolsa achando que tinha dinheiro e só encontra documentos → furto consumado da bolsa e do que havia nela; erro sobre o objeto é irrelevante."], "prova": "Erro sobre a pessoa = erro de REPRESENTAÇÃO (vê mal, acerta quem mirou). Erro na execução = erro de EXECUÇÃO (vê bem, mira mal). A consequência é a mesma (vítima virtual), mas o artigo e o mecanismo são diferentes."}, "perguntas": [{"p": "O que é erro acidental?", "r": "É o erro sobre um **dado secundário** do crime, que não muda a sua essência. O agente sabia que praticava um crime e quis praticá-lo: por isso o erro acidental [[não exclui o dolo]].", "exemplos": [{"t": "**Sobre o objeto** — o ladrão leva do carro uma caixa achando que era um celular, mas só havia bijuteria: [[responde por furto do mesmo jeito]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Art. 155 - Subtrair, para si ou para outrem, coisa alheia móvel:"}}, {"t": "**Sobre a pessoa** — Pedro mata o vizinho pensando ser o pai: [[homicídio doloso consumado]], com as qualidades do pai.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}]}, {"p": "Como se resolve o erro sobre o objeto?", "r": "O CP não tem regra; a doutrina manda responder pelo **crime praticado**, considerando a coisa efetivamente atingida. Quem leva a caixa de bijuteria achando que era celular [[responde por furto]] do mesmo jeito.", "exemplos": [{"t": "**Coisa atingida** — o ladrão leva a caixa de bijuteria achando que era um celular de alto valor: conta a coisa efetivamente subtraída, e, sendo primário e de pequeno valor o que levou, [[pode receber o furto privilegiado]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, § 2º (furto privilegiado)", "texto": "§ 2º - Se o criminoso é primário, e é de pequeno valor a coisa furtada, o juiz pode substituir a pena de reclusão pela de detenção, diminuí-la de um a dois terços, ou aplicar somente a pena de multa."}}]}, {"p": "O que é o erro sobre a pessoa?", "r": "É um erro de **representação**: o agente identifica mal a vítima, mas a execução é perfeita, ele acerta exatamente quem mirou. Pedro [[vê mal]], confunde o vizinho com o pai e atira certeiro.", "exemplos": [{"t": "**Error in persona** — no escuro da garagem, Pedro vê o vizinho de boné, pensa que é o pai e atira certeiro: [[responde por homicídio doloso com a agravante de crime contra ascendente]] (art. 61, II, e), como se tivesse matado o pai.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}]}, {"p": "O que diz o art. 20, § 3º?", "r": "O erro sobre a pessoa não livra o agente da pena, e consideram-se as qualidades da **vítima virtual** (a pretendida), [[não as da vítima real]].", "lei": {"chave": "CP:20", "rotulo": "CP, art. 20, § 3º", "texto": "§ 3º - O erro quanto à pessoa contra a qual o crime é praticado não isenta de pena. Não se consideram, neste caso, as condições ou qualidades da vítima, senão as da pessoa contra quem o agente queria praticar o crime."}}, {"p": "A regra da vítima virtual só serve para agravar?", "r": "Não: vale **nos dois sentidos**. Aplicam-se as agravantes ligadas à vítima pretendida e [[afastam-se as da vítima atingida]]: quem quer matar um adulto e mata um idoso não sofre o aumento pela idade.", "exemplos": [{"t": "**Afasta agravante da vítima real** — Lia quer matar o sócio de 40 anos e, por engano de identidade, mata o tio dele, de 70: consideram-se as qualidades do sócio, e [[não incide o aumento de 1/3 pela idade]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 4º, parte final (aumento no homicídio doloso)", "texto": "Sendo doloso o homicídio, a pena é aumentada de 1/3 (um terço) se o crime é praticado contra pessoa menor de 14 (quatorze) ou maior de 60 (sessenta) anos."}}, {"t": "**Aplica agravante da vítima virtual** — quem quer matar uma criança de 10 anos e, por confusão, mata um adulto [[responde pelo homicídio qualificado contra menor de 14 anos]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 2º, IX (homicídio qualificado)", "texto": "IX - contra menor de 14 (quatorze) anos: (Incluído pela Lei nº 14.344, de 2022) Vigência"}}]}]}, {"titulo": "ABERRATIO ICTUS (ART. 73)", "cor": "k", "resumo": [{"t": "Erro na EXECUÇÃO: mira certo, acerta pessoa diversa.", "ex": "Marcos mira o rival no bar, a bala desvia e acerta o garçom, que estava ao lado."}, {"t": "Unidade simples: só o terceiro é atingido; responde como se fosse a vítima visada.", "ex": "Só o garçom morre: Marcos responde por um homicídio doloso, como se tivesse matado o rival."}, {"t": "Unidade complexa: atinge os dois; concurso formal (art. 70).", "ex": "A bala mata o rival e o garçom: homicídio doloso e culposo em concurso formal, pena aumentada de 1/6 até a metade."}, {"t": "Pessoa → pessoa. Se for pessoa → coisa, é o art. 74.", "ex": "Se Marcos mira o rival e acerta só a vidraça do bar, aplica-se o art. 74, não o art. 73."}], "lei": [{"chave": "CP:73", "rotulo": "CP, art. 73", "texto": "Art. 73 - Quando, por acidente ou erro no uso dos meios de execução, o agente, ao invés de atingir a pessoa que pretendia ofender, atinge pessoa diversa, responde como se tivesse praticado o crime contra aquela, atendendo-se ao disposto no § 3º do art. 20 deste Código. No caso de ser também atingida a pessoa que o agente pretendia ofender, aplica-se a regra do art. 70 deste Código."}], "exemplo": "No bar, Marcos atira no rival, mas a bala desvia e acerta o garçom, que morre: responde por homicídio doloso consumado como se tivesse matado o rival (unidade simples). Se a bala atravessa o rival e também mata o garçom, há concurso formal: homicídio doloso do rival e homicídio culposo do garçom, com a pena do mais grave aumentada de 1/6 até a metade.", "pegadinha": "Atingiu o desafeto e o terceiro com dolo eventual quanto a este? Aí há desígnios autônomos e as penas se somam (concurso formal impróprio).", "aprofundar": {"doutrina": ["Na **aberratio ictus** (erro na execução), o agente representa corretamente a vítima, mas, por acidente ou erro no uso dos meios (falta de pontaria, desvio, a vítima se abaixa), atinge pessoa diversa. A relação é pessoa → pessoa. Diferente do **erro sobre a pessoa**, aqui a vítima pretendida estava presente e corria perigo; o erro é de mira, não de identificação.", "Na **unidade simples** (resultado único), só o terceiro é atingido. O art. 73 manda responder como se o crime tivesse sido praticado contra a vítima pretendida, com remissão expressa ao art. 20, § 3º: consideram-se as qualidades da **vítima virtual**. Não há tentativa contra a vítima pretendida somada ao crime contra o terceiro: há um só crime, doloso.", "Na **unidade complexa** (resultado duplo), são atingidas a vítima pretendida e a terceira pessoa. Aplica-se a regra do concurso formal (art. 70): em regra, **concurso formal próprio**, com a pena do crime mais grave aumentada de 1/6 até a metade. Pela doutrina majoritária, o crime contra o terceiro é imputado a título de culpa; se o agente agiu com dolo (ainda que eventual) quanto ao terceiro, configuram-se **desígnios autônomos** e aplica-se o **concurso formal impróprio**, com soma das penas.", "Ponto controvertido: se **dolo eventual** basta para os '**desígnios autônomos**' do art. 70, segunda parte. Uma corrente exige **dolo direto** em relação a cada resultado (desígnio = propósito); outra, com aceitação crescente na jurisprudência, admite o dolo eventual. Sinalize a divergência em prova discursiva; nas objetivas, a fórmula mais cobrada é 'dolo quanto aos dois resultados = desígnios autônomos = **cúmulo material**'.", "A doutrina também distingue a **aberratio ictus** por acidente (sem falha do agente, como a vítima que se move) da aberratio ictus por erro no uso dos meios (falha de pontaria). A consequência é a mesma: a lei equipara as duas formas."], "juris": [], "exemplos": ["Mulher tenta envenenar o marido colocando veneno no café dele, mas a sogra toma a xícara por engano e morre → aberratio ictus com unidade simples: homicídio consumado, como se tivesse matado o marido (com as circunstâncias ligadas a ele).", "Atirador mira o desafeto, o mata e a bala fere um pedestre → homicídio doloso + lesão corporal culposa em concurso formal próprio: pena do homicídio aumentada de 1/6 até 1/2.", "Agente atira contra o rival que está no meio de um grupo, aceitando atingir quem estiver ao lado; mata o rival e outra pessoa → desígnios autônomos (para a corrente que admite dolo eventual), soma das penas."], "prova": "Atenção à relação: pessoa → pessoa é art. 73; pessoa → coisa ou coisa → pessoa é art. 74. E à unidade: um só atingido = como se fosse a vítima visada; dois atingidos = art. 70."}, "perguntas": [{"p": "O que é a aberratio ictus?", "r": "É o **erro na execução**: o agente vê bem a vítima, mas, por falta de pontaria ou acidente, atinge **outra pessoa**. A relação é [[pessoa → pessoa]]; o erro é de mira, não de identificação.", "exemplos": [{"t": "**Erro na execução** — no bar, Marcos mira o rival, mas a bala desvia e mata o garçom: ele viu bem o rival e errou a mira. [[Responde por homicídio doloso consumado, como se tivesse matado o rival]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}]}, {"p": "O que diz o art. 73?", "r": "Atingiu pessoa diversa por erro de execução, responde [[como se tivesse atingido a vítima visada]], com as qualidades dela (art. 20, § 3º); se atingiu as duas, aplica-se o concurso formal.", "lei": {"chave": "CP:73", "rotulo": "CP, art. 73", "texto": "Art. 73 - Quando, por acidente ou erro no uso dos meios de execução, o agente, ao invés de atingir a pessoa que pretendia ofender, atinge pessoa diversa, responde como se tivesse praticado o crime contra aquela, atendendo-se ao disposto no § 3º do art. 20 deste Código. No caso de ser também atingida a pessoa que o agente pretendia ofender, aplica-se a regra do art. 70 deste Código."}}, {"p": "E se só o terceiro for atingido?", "r": "É a **unidade simples**: há um só crime doloso, contra a vítima virtual. Marcos, que mata o garçom em vez do rival, responde por [[homicídio doloso consumado]], sem somar tentativa contra o rival.", "exemplos": [{"t": "**Unidade simples (homicídio)** — a bala de Marcos acerta só o garçom: [[um só homicídio doloso consumado]], sem tentativa contra o rival.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}, {"t": "**Unidade simples (lesão)** — Téo dá um soco no desafeto, que se abaixa, e acerta o amigo dele: [[responde por uma lesão corporal dolosa]], como se tivesse atingido o desafeto.", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, caput (lesão corporal)", "texto": "Art. 129. Ofender a integridade corporal ou a saúde de outrem:"}}]}, {"p": "E se forem atingidos os dois?", "r": "É a **unidade complexa**: aplica-se o concurso formal do art. 70. Em regra, **concurso formal próprio**: a pena do crime mais grave [[aumentada de 1/6 até a metade]].", "exemplos": [{"t": "**Unidade complexa** — a bala de Marcos atravessa o rival, que morre, e mata também o garçom: homicídio doloso + homicídio culposo em concurso formal, com [[a pena do mais grave aumentada de 1/6 até a metade]].", "lei": {"chave": "CP:70", "rotulo": "CP, art. 70, caput (concurso formal)", "texto": "Art. 70 - Quando o agente, mediante uma só ação ou omissão, pratica dois ou mais crimes, idênticos ou não, aplica-se-lhe a mais grave das penas cabíveis ou, se iguais, somente uma delas, mas aumentada, em qualquer caso, de um sexto até metade."}}]}, {"p": "O que diz o art. 70 sobre os desígnios autônomos?", "r": "Se a ação é dolosa e os crimes resultam de **desígnios autônomos**, as penas [[se somam]]: é o concurso formal impróprio.", "lei": {"chave": "CP:70", "rotulo": "CP, art. 70, caput, segunda parte", "texto": "As penas aplicam-se, entretanto, cumulativamente, se a ação ou omissão é dolosa e os crimes concorrentes resultam de desígnios autônomos, consoante o disposto no artigo anterior."}}, {"p": "E se houve dolo eventual quanto ao terceiro?", "r": "Há divergência: uma corrente exige **dolo direto** para cada resultado; outra, com aceitação crescente, admite o **dolo eventual**. Na prova objetiva: dolo quanto aos dois = desígnios autônomos = [[cúmulo material]].", "exemplos": [{"t": "**Desígnios autônomos** — Marcos atira no rival no meio do salão lotado, aceitando matar quem estiver na frente, e mata os dois: [[as penas dos dois homicídios dolosos se somam]].", "lei": {"chave": "CP:70", "rotulo": "CP, art. 70, caput, segunda parte (desígnios autônomos)", "texto": "As penas aplicam-se, entretanto, cumulativamente, se a ação ou omissão é dolosa e os crimes concorrentes resultam de desígnios autônomos, consoante o disposto no artigo anterior."}}]}]}, {"titulo": "ABERRATIO CRIMINIS E CAUSAE", "cor": "r", "resumo": [{"t": "Aberratio criminis (art. 74): resultado de NATUREZA diversa (coisa × pessoa).", "ex": "Bia atira a pedra na vidraça da loja do ex e acerta a cabeça de um cliente: o resultado mudou de natureza."}, {"t": "Resultado não querido → culpa, se houver tipo culposo; os dois → art. 70.", "ex": "Bia responde por lesão culposa; se quebra a vidraça e fere o cliente, dano doloso e lesão culposa em concurso formal."}, {"t": "Pessoa visada, coisa atingida: não há dano culposo; resta a tentativa.", "ex": "Dino atira no rival e acerta só o carro dele: responde por tentativa de homicídio."}, {"t": "Aberratio causae: resultado ocorre por nexo causal diverso; dolo mantido.", "ex": "A vítima empurrada da ponte morre ao bater no pilar, e não afogada: homicídio doloso consumado."}], "lei": [{"chave": "CP:74", "rotulo": "CP, art. 74", "texto": "Art. 74 - Fora dos casos do artigo anterior, quando, por acidente ou erro na execução do crime, sobrevém resultado diverso do pretendido, o agente responde por culpa, se o fato é previsto como crime culposo; se ocorre também o resultado pretendido, aplica-se a regra do art. 70 deste Código."}], "exemplo": "Bia atira uma pedra para quebrar a vidraça da loja do ex e acerta a cabeça de um cliente: responde por lesão corporal culposa (o dano doloso fica absorvido, pois não se consumou). Se a pedra quebra a vidraça E fere o cliente, há concurso formal: dano doloso e lesão culposa. Na aberratio causae, quem empurra a vítima da ponte para que se afogue, mas ela morre ao bater a cabeça no pilar, responde por homicídio doloso consumado.", "pegadinha": "Mirou a pessoa e acertou só a coisa? Dano culposo não existe no CP: o agente responde pela tentativa contra a pessoa.", "aprofundar": {"doutrina": ["Na **aberratio criminis** (ou aberratio delicti, resultado diverso do pretendido), o erro na execução produz um resultado de natureza diferente do que se pretendia: o agente quer atingir uma coisa e atinge uma pessoa, ou vice-versa. É subsidiária ('fora dos casos do artigo anterior'): se o desvio é de pessoa para pessoa, aplica-se o art. 73.", "Regras: (a) se só ocorre o resultado diverso, o agente responde por ele a título de culpa, se houver tipo culposo; (b) se ocorrem os dois resultados, aplica-se o concurso formal do art. 70. A doutrina aponta a limitação da regra: se o resultado pretendido é mais grave do que o produzido (quer matar uma pessoa e só quebra a vitrine), aplicar o art. 74 levaria à impunidade, pois não há dano culposo; resolve-se punindo a tentativa do crime pretendido.", "A **aberratio causae** (erro sobre o nexo causal) não tem previsão expressa. Divide-se em erro so
