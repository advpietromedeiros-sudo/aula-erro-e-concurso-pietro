: "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}, {"t": "**Mesma vítima** — o agente rouba duas vezes o mesmo comerciante: falta 'vítimas diferentes' → continuidade comum, 6 anos + 1/6 = [[7 anos]].", "lei": {"chave": "CP:157", "rotulo": "CP, art. 157, caput (roubo)", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:\nPena – reclusão, de 6 (seis) a 10 (dez) anos, e multa."}}]}, {"p": "Como o juiz fixa o aumento?", "r": "Pelas **circunstâncias judiciais** (culpabilidade, antecedentes, conduta social, personalidade, motivos e circunstâncias), somadas ao número de crimes. O mínimo continua sendo [[1/6]], o do caput."}, {"p": "O triplo tem limite?", "r": "Tem dois: o **concurso material benéfico** (a pena [[não passa da soma]]) e o **cumprimento máximo de 40 anos** (art. 75).", "exemplos": [{"t": "**Teto da soma** — dois homicídios continuados contra vítimas diferentes, 6 anos cada: o triplo daria 18 anos, mas a soma é 12 → [[12 anos]] (art. 70, p.ú.).", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio simples)", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos."}}]}, {"p": "E a Súmula 605/STF ainda vale?", "r": "Não. Ela vedava continuidade nos crimes contra a vida, e a redação de 1984 a [[superou]]. Homicídios podem ser continuados, desde que presentes os requisitos, inclusive a **unidade de desígnios**.", "exemplos": [{"t": "**Homicídios continuados** — por vingança, o agente mata três irmãos em dias seguidos, pelo mesmo modo: cabe a continuidade específica → 6 anos [[até o triplo]], sem passar da soma nem dos 40 anos.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio simples)", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos."}}]}]}, {"titulo": "MULTA, LIMITE E PRESCRIÇÃO", "cor": "k", "resumo": [{"t": "Multa: aplicada distinta e integralmente para cada crime (art. 72)", "ex": "Furto com 10 dias-multa + estelionato com 15: paga 25 dias-multa."}, {"t": "Cumprimento máximo: 40 anos; somas maiores se unificam (art. 75)", "ex": "Cinco homicídios de 12 anos somam 60 na sentença, mas o cumprimento para em 40."}, {"t": "Prescrição: conta-se a pena de CADA crime, isoladamente (art. 119)", "ex": "Ameaça de 1 mês prescreve em 3 anos; furto de 1 ano, em 4, cada um no seu prazo."}, {"t": "Crime continuado: prescrição sem o acréscimo (Súmula 497/STF)", "ex": "Pena de 2 anos + 1/3 por continuidade: a prescrição se conta sobre os 2 anos."}], "lei": [{"chave": "CP:72", "rotulo": "CP, art. 72", "texto": "No concurso de crimes, as penas de multa são aplicadas distinta e integralmente."}, {"chave": "CP:75", "rotulo": "CP, art. 75, caput", "texto": "O tempo de cumprimento das penas privativas de liberdade não pode ser superior a 40 (quarenta) anos."}, {"chave": "CP:75", "rotulo": "CP, art. 75, § 1º", "texto": "§ 1º Quando o agente for condenado a penas privativas de liberdade cuja soma seja superior a 40 (quarenta) anos, devem elas ser unificadas para atender ao limite máximo deste artigo."}, {"chave": "CP:119", "rotulo": "CP, art. 119", "texto": "No caso de concurso de crimes, a extinção da punibilidade incidirá sobre a pena de cada um, isoladamente."}], "exemplo": "Um ladrão é condenado por cinco furtos continuados a 1 ano + 1/3 = 1 ano e 4 meses. Para a prescrição, conta-se só 1 ano, sem o acréscimo da continuidade. E, se tiver multas por três crimes em concurso material, paga as três, uma por crime.", "pegadinha": "O limite de 40 anos é de CUMPRIMENTO, não de condenação; e a pena unificada não serve de base para benefícios (Súmula 715/STF).", "aprofundar": {"doutrina": ["Multa (art. 72): no concurso de crimes, as multas não se exasperam — cada crime tem a sua, somadas. Ponto CONTROVERTIDO: no **crime continuado**, a jurisprudência do STJ entende que o art. 72 não se aplica, porque a continuidade é tratada como crime único (ficção), e aplica uma só multa com o aumento do art. 71; parte da doutrina defende a soma também aí, pela letra do art. 72.", "Limite de cumprimento (art. 75): desde a Lei 13.964/2019 (Pacote Anticrime), **40 anos** (antes, 30). Condenações que somem mais são unificadas no limite; sobrevindo condenação por fato posterior ao início do cumprimento, faz-se nova unificação, desprezado o tempo já cumprido (§ 2º). A pena unificada não é base para livramento condicional ou progressão: conta-se a pena total (Súmula 715/STF, que fala em 30 anos porque é anterior à lei, e se lê hoje com 40).", "Prescrição (art. 119): a extinção da punibilidade incide sobre a pena de cada crime **isoladamente**. No **crime continuado**, a Súmula 497/STF manda desprezar o acréscimo da continuação; a jurisprudência aplica o mesmo raciocínio ao aumento do concurso formal. Assim, um crime pode prescrever e o outro não.", "Lei no tempo: no **crime continuado** (e no permanente), aplica-se a lei mais grave se ela entrou em vigor antes de cessar a continuidade (Súmula 711/STF) — exceção aparente à irretroatividade, porque o agente seguiu praticando crimes já sob a lei nova."], "juris": [{"sumula": "SUM-STF-497", "tribunal": "STF", "rotulo": "Súmula 497/STF", "texto": "Quando se tratar de crime continuado, a prescrição regula-se pela pena imposta na sentença, não se computando o acréscimo decorrente da continuação."}, {"sumula": "SUM-STF-715", "tribunal": "STF", "rotulo": "Súmula 715/STF (o limite hoje é de 40 anos, Lei 13.964/2019)", "texto": "A pena unificada para atender ao limite de trinta anos de cumprimento, determinado pelo art. 75 do Código Penal, não é considerada para a concessão de outros benefícios, como o livramento condicional ou regime mais favorável de execução."}, {"sumula": "SUM-STF-711", "tribunal": "STF", "rotulo": "Súmula 711/STF", "texto": "A lei penal mais grave aplica-se ao crime continuado ou ao crime permanente, se a sua vigência é anterior à cessação da continuidade ou da permanência."}], "exemplos": ["Condenado a 90 anos por vários homicídios → cumpre no máximo 40 (art. 75); mas a progressão de regime é calculada sobre os 90 (Súmula 715/STF).", "Dois crimes em concurso material, um com pena de 1 ano e outro de 5 → a prescrição de cada um corre separada; o de 1 ano pode prescrever antes (art. 119).", "Extorsões continuadas que começaram sob lei mais branda e seguiram depois de lei mais grave → aplica-se a lei mais grave a toda a série (Súmula 711/STF)."], "prova": "Palavras que decidem: 'distinta e integralmente' (multa), 'cumprimento' e '40 anos' (art. 75), 'isoladamente' (art. 119) e 'não se computando o acréscimo' (Súmula 497/STF)."}, "perguntas": [{"p": "Como fica a multa no concurso de crimes?", "r": "Cada crime tem a sua, aplicada [[distinta e integralmente]]: as multas não se exasperam, somam-se.", "lei": {"chave": "CP:72", "rotulo": "CP, art. 72", "texto": "No concurso de crimes, as penas de multa são aplicadas distinta e integralmente."}, "exemplos": [{"t": "**Multas somadas** — furto com 10 dias-multa e estelionato com 15 dias-multa, em concurso material: paga [[25 dias-multa]], uma multa por crime (art. 72).", "lei": {"chave": "CP:171", "rotulo": "CP, art. 171, caput (estelionato)", "texto": "Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio fraudulento:\nPena – reclusão, de 1 (um) a 5 (cinco) anos, e multa."}}]}, {"p": "E no crime continuado?", "r": "Ponto **controvertido**. O STJ entende que o art. 72 [[não se aplica]] à continuidade, tratada como crime único: aplica-se **uma só multa** com o aumento do art. 71. Parte da doutrina defende a soma."}, {"p": "O que diz o art. 75?", "r": "Ninguém cumpre mais de [[40 anos]] de prisão; somas maiores são **unificadas** nesse limite (Lei 13.964/2019; antes, 30 anos).", "lei": {"chave": "CP:75", "rotulo": "CP, art. 75, caput e § 1º", "texto": "O tempo de cumprimento das penas privativas de liberdade não pode ser superior a 40 (quarenta) anos. (Redação dada pela Lei nº 13.964, de 2019)\n§ 1º Quando o agente for condenado a penas privativas de liberdade cuja soma seja superior a 40 (quarenta) anos, devem elas ser unificadas para atender ao limite máximo deste artigo."}, "exemplos": [{"t": "**Unificação** — cinco homicídios, 12 anos cada: a condenação soma [[60 anos]], mas o cumprimento é unificado em 40.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio simples)", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos."}}]}, {"p": "A pena unificada serve para benefícios?", "r": "Não. Progressão e livramento se calculam sobre a [[pena total]], não sobre os 40 anos (**Súmula 715/STF**, lida hoje com 40). O limite é de **cumprimento**, não de condenação."}, {"p": "O que diz o art. 119?", "r": "Na prescrição, conta-se a pena de [[cada crime, isoladamente]]. Um crime pode prescrever e o outro não.", "lei": {"chave": "CP:119", "rotulo": "CP, art. 119", "texto": "No caso de concurso de crimes, a extinção da punibilidade incidirá sobre a pena de cada um, isoladamente."}, "exemplos": [{"t": "**Prescrição crime a crime** — furto com pena de 1 ano e ameaça com pena de 1 mês: a ameaça prescreve em 3 anos e o furto em 4 (art. 109) → [[cada um no seu prazo]].", "lei": {"chave": "CP:147", "rotulo": "CP, art. 147, caput (ameaça)", "texto": "Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave:\nPena - detenção, de um a seis meses, ou multa."}}]}, {"p": "O acréscimo da continuidade entra na prescrição?", "r": "Não. Pela **Súmula 497/STF**, a prescrição se regula pela pena imposta [[sem o acréscimo]] da continuação; a jurisprudência aplica o mesmo ao aumento do **concurso formal**.", "exemplos": [{"t": "**Sem o acréscimo** — furtos continuados com pena de 2 anos + 1/3 = 2 anos e 8 meses: a prescrição se conta sobre 2 anos (4 anos, art. 109, V), [[não sobre 2 anos e 8 meses]] (8 anos).", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}, {"p": "Que lei se aplica se ela mudar no meio da série?", "r": "A [[lei mais grave]], se entrou em vigor antes de cessar a continuidade (**Súmula 711/STF**). O agente seguiu praticando crimes já sob a lei nova.", "exemplos": [{"t": "**Lei mais grave** — a série de furtos começou antes da Lei 15.397/2026, que elevou o máximo do furto simples para 6 anos, e continuou depois dela: aplica-se [[a pena nova a toda a série]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}]}, {"titulo": "CONSEQUÊNCIAS PROCESSUAIS DO CONCURSO", "cor": "k", "resumo": [{"t": "Sursis processual: pena mínima de até 1 ano (Lei 9.099, art. 89)", "ex": "Um furto simples isolado (mínima de 1 ano) admite a suspensão do processo."}, {"t": "No concurso, conta-se a SOMA ou a majorante mínima (Súmula 243/STJ)", "ex": "Duas ameaças em concurso material somam 2 meses de mínima: cabe a suspensão."}, {"t": "Crime continuado: mínima do mais grave + 1/6 (Súmula 723/STF)", "ex": "Dois estelionatos continuados: 1 ano + 1/6 = 1 ano e 2 meses, então não cabe."}, {"t": "Concurso formal gera continência; demais, em regra, conexão (CPP 76 e 77)", "ex": "O motorista que mata dois num só acidente responde num só processo (continência)."}], "lei": [{"chave": "L9099:89", "rotulo": "Lei 9.099/1995, art. 89, caput", "texto": "Nos crimes em que a pena mínima cominada for igual ou inferior a um ano, abrangidas ou não por esta Lei, o Ministério Público, ao oferecer a denúncia, poderá propor a suspensão do processo, por dois a quatro anos"}, {"chave": "CPP:77", "rotulo": "CPP, art. 77 (o inciso II remete à numeração antiga: hoje, arts. 70, 73 e 74 do CP)", "texto": "Art. 77. A competência será determinada pela continência quando:\nI - duas ou mais pessoas forem acusadas pela mesma infração;\nII - no caso de infração cometida nas condições previstas nos arts. 51, § 1o, 53, segunda parte, e 54 do Código Penal."}, {"chave": "L7210:111", "rotulo": "LEP, art. 111, caput", "texto": "Quando houver condenação por mais de um crime, no mesmo processo ou em processos distintos, a determinação do regime de cumprimento será feita pelo resultado da soma ou unificação das penas, observada, quando for o caso, a detração ou remição."}], "exemplo": "Um rapaz é denunciado por dois furtos simples em concurso material (pena mínima de 1 ano cada). Somadas, as mínimas dão 2 anos, acima do limite: não cabe suspensão condicional do processo. Se fossem dois furtos continuados, a conta seria 1 ano + 1/6, também acima de 1 ano.", "pegadinha": "A conta usa a pena MÍNIMA cominada com o aumento MÍNIMO (1/6), não a pena concreta nem o aumento máximo.", "aprofundar": {"doutrina": ["**Suspensão condicional do processo** (Lei 9.099/1995, art. 89): cabe quando a pena mínima cominada é de até 1 ano. No concurso de crimes, a pena mínima considerada é a resultante do concurso: a soma das mínimas (**concurso material**) ou a mínima do mais grave acrescida do aumento mínimo de 1/6 (concurso formal e continuidade). É o que dizem a Súmula 243/STJ (para as três espécies) e a Súmula 723/STF (**crime continuado**).", "O mesmo raciocínio é aplicado pela jurisprudência à transação penal e à competência do Juizado Especial: no concurso, considera-se a pena resultante da soma ou da **exasperação** para verificar o limite de 2 anos da infração de menor potencial ofensivo.", "Competência e unidade do processo: o concurso formal é hipótese de CONTINÊNCIA (CPP, art. 77, II, cuja remissão aos 'arts. 51, § 1º, 53, segunda parte, e 54' corresponde hoje aos arts. 70, 73 e 74 do CP). O **concurso material** e o **crime continuado** costumam gerar CONEXÃO (CPP, art. 76), conforme o vínculo entre os fatos. Julgados em processos diferentes, as penas são somadas ou unificadas na execução (LEP, art. 111), inclusive para reconhecer a continuidade depois do trânsito em julgado.", "Prisão e regime: o regime inicial se fixa sobre a pena total (soma ou **exasperação**), e o mesmo total orienta a substituição por restritiva de direitos (art. 44), observado o art. 69, § 1º."], "juris": [{"sumula": "SUM-STJ-243", "tribunal": "STJ", "rotulo": "Súmula 243/STJ", "texto": "O benefício da suspensão do processo não é aplicável em relação às infrações penais cometidas em concurso material, concurso formal ou continuidade delitiva, quando a pena mínima cominada, seja pelo somatório, seja pela incidência da majorante, ultrapassar o limite de um (01) ano."}, {"sumula": "SUM-STF-723", "tribunal": "STF", "rotulo": "Súmula 723/STF", "texto": "Não se admite a suspensão condicional do processo por crime continuado, se a soma da pena mínima da infração mais grave com o aumento mínimo de um sexto for superior a um ano."}], "exemplos": ["Denúncia por dois estelionatos em continuidade (mínima de 1 ano) → 1 ano + 1/6 = 1 ano e 2 meses → não cabe sursis processual (Súmula 723/STF).", "Denúncia por duas ameaças em concurso material (mínima de 1 mês cada) → soma: 2 meses → cabe a suspensão (Súmula 243/STJ).", "Réu condenado em duas comarcas por furtos que, juntos, preenchem o art. 71 → o juízo da execução unifica as penas e reconhece a continuidade (LEP, art. 111)."], "prova": "Palavras que decidem: 'pena mínima', 'somatório', 'incidência da majorante' e 'aumento mínimo de um sexto'. A banca troca 'mínimo' por 'máximo' para derrubar o candidato."}, "perguntas": [{"p": "O que é a suspensão condicional do processo?", "r": "É o **sursis processual**: o MP pode propor suspender o processo por 2 a 4 anos quando a **pena mínima cominada** for [[de até 1 ano]].", "exemplos": [{"t": "**Crime isolado** — um só furto simples, pena mínima de 1 ano: [[cabe a proposta]] de suspensão do processo.", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}, {"p": "O que diz o art. 89 da Lei 9.099?", "r": "Nos crimes com pena mínima [[igual ou inferior a um ano]], o MP, ao denunciar, pode propor a **suspensão do processo** por dois a quatro anos.", "lei": {"chave": "L9099:89", "rotulo": "Lei 9.099/1995, art. 89, caput", "texto": "Nos crimes em que a pena mínima cominada for igual ou inferior a um ano, abrangidas ou não por esta Lei, o Ministério Público, ao oferecer a denúncia, poderá propor a suspensão do processo, por dois a quatro anos"}}, {"p": "No concurso, qual pena mínima se conta?", "r": "A **resultante do concurso**: a [[soma das mínimas]] no concurso material, ou a mínima do mais grave + **1/6** no formal e no continuado (Súmula 243/STJ e Súmula 723/STF).", "exemplos": [{"t": "**Material** — duas ameaças em dias diferentes, mínima de 1 mês cada: soma = 2 meses → [[cabe a suspensão]].", "lei": {"chave": "CP:147", "rotulo": "CP, art. 147, caput (ameaça)", "texto": "Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave:\nPena - detenção, de um a seis meses, ou multa."}}, {"t": "**Formal** — numa só batida, o motorista fere culposamente dois pedestres: 6 meses + 1/6 = 7 meses → [[cabe a suspensão]].", "lei": {"chave": "L9503:303", "rotulo": "CTB, art. 303, caput (lesão culposa no trânsito)", "texto": "Praticar lesão corporal culposa na direção de veículo automotor:\nPenas - detenção, de seis meses a dois anos e suspensão ou proibição de se obter a permissão ou a habilitação para dirigir veículo automotor."}}, {"t": "**Continuado** — dois estelionatos continuados: 1 ano + 1/6 = 1 ano e 2 meses → [[não cabe]] (Súmula 723/STF).", "lei": {"chave": "CP:171", "rotulo": "CP, art. 171, caput (estelionato)", "texto": "Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio fraudulento:\nPena – reclusão, de 1 (um) a 5 (cinco) anos, e multa."}}]}, {"p": "Dois furtos simples continuados admitem sursis processual?", "r": "Não. A mínima é 1 ano + 1/6 = 1 ano e 2 meses, [[acima de 1 ano]]. A conta usa a pena **mínima** com o aumento **mínimo**, nunca o máximo.", "exemplos": [{"t": "**Furtos continuados** — mínima do furto (1 ano) + 1/6 = [[1 ano e 2 meses]]; se fossem em concurso material, 1 + 1 = 2 anos — nos dois casos, acima do limite.", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}, {"p": "O que diz o art. 77 do CPP?", "r": "Define a **continência**. O inciso II remete à numeração antiga do CP, que hoje corresponde aos arts. 70, 73 e 74: o [[concurso formal gera continência]]; material e continuado costumam gerar **conexão** (art. 76).", "lei": {"chave": "CPP:77", "rotulo": "CPP, art. 77", "texto": "Art. 77. A competência será determinada pela continência quando:\nI - duas ou mais pessoas forem acusadas pela mesma infração;\nII - no caso de infração cometida nas condições previstas nos arts. 51, § 1o, 53, segunda parte, e 54 do Código Penal."}, "exemplos": [{"t": "**Continência** — o motorista que, num só acidente, mata dois pedestres responde [[num só processo]] pelos dois homicídios culposos (concurso formal).", "lei": {"chave": "L9503:302", "rotulo": "CTB, art. 302, caput (homicídio culposo no trânsito)", "texto": "Praticar homicídio culposo na direção de veículo automotor:\nPenas - detenção, de dois a quatro anos, e suspensão ou proibição de se obter a permissão ou a habilitação para dirigir veículo automotor."}}]}, {"p": "E se os crimes forem julgados em processos diferentes?", "r": "As penas se **somam ou unificam na execução**, para fixar o regime, e a continuidade [[pode ser reconhecida]] depois do trânsito em julgado.", "lei": {"chave": "L7210:111", "rotulo": "LEP, art. 111, caput", "texto": "Quando houver condenação por mais de um crime, no mesmo processo ou em processos distintos, a determinação do regime de cumprimento será feita pelo resultado da soma ou unificação das penas, observada, quando for o caso, a detração ou remição."}, "exemplos": [{"t": "**Soma na execução** — roubo com pena de 6 anos numa comarca e outro de 6 anos em outra: a execução soma 12 anos → [[regime fechado]] (acima de 8 anos).", "lei": {"chave": "CP:157", "rotulo": "CP, art. 157, caput (roubo)", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:\nPena – reclusão, de 6 (seis) a 10 (dez) anos, e multa."}}]}]}, {"titulo": "QUADRO-SÍNTESE DO CONCURSO", "cor": "k", "resumo": [{"t": "MATERIAL: + de 1 conduta → SOMA", "ex": "Furto (1 ano) na segunda e lesão (3 meses) na sexta: 1 ano e 3 meses."}, {"t": "FORMAL PRÓPRIO: 1 conduta → mais grave + 1/6 a 1/2", "ex": "Atropelamento culposo de dois pedestres: 2 anos + 1/6 = 2 anos e 4 meses."}, {"t": "FORMAL IMPRÓPRIO: 1 conduta dolosa, desígnios autônomos → SOMA", "ex": "A bomba que mata patrão e motorista: 6 + 6 = 12 anos."}, {"t": "CONTINUADO: + de 1 conduta, mesma espécie e condições → 1/6 a 2/3", "ex": "Dez furtos de R$ 50 no mesmo caixa: 1 ano + 2/3 = 1 ano e 8 meses."}, {"t": "ESPECÍFICO: dolo, vítimas diferentes, violência → até o TRIPLO", "ex": "Três roubos no mesmo ponto de ônibus: 6 anos, até o triplo (18 anos)."}], "lei": [], "exemplo": "Para fixar: um motorista que atropela dois por descuido (formal próprio, +1/6); um matador que explode um carro para matar dois (formal impróprio, soma); o ladrão que furta e depois agride (material, soma); a caixa que tira R$ 50 por dia (continuado, até 2/3); o assaltante que rouba três no ponto de ônibus (específico, até o triplo).", "pegadinha": "Em todos os sistemas de exasperação, vale o teto da soma (art. 70, p.ú.) e o cumprimento máximo de 40 anos (art. 75).", "aprofundar": {"doutrina": ["Roteiro de resolução em quatro perguntas. (1) Há mais de um crime, ou é concurso aparente? (2) Quantas condutas? Uma → art. 70; mais de uma → art. 69 ou 71. (3) Se uma conduta: dolosa com **desígnios autônomos**? Sim → soma (70, 2ª parte); não → exasperação de 1/6 a 1/2. (4) Se várias condutas: mesma espécie, mesmas condições e **unidade de desígnios**? Sim → art. 71 (e, se dolosos, contra **vítimas diferentes**, com **violência ou grave ameaça** → p.ú., até o triplo); não → soma (art. 69).", "Quadro comparativo. Concurso material — condutas: várias; crimes: idênticos ou não; sistema: cúmulo material. Formal próprio — conduta: uma; sem **desígnios autônomos**; sistema: exasperação, 1/6 a 1/2, pelo número de crimes. Formal impróprio — conduta: uma, dolosa; desígnios autônomos (dolo direto e, para o STJ, eventual); sistema: cúmulo material. Continuado comum — condutas: várias; mesma espécie; condições semelhantes; **unidade de desígnios** (STJ/STF); exasperação de 1/6 a 2/3 (Súmula 659/STJ). Continuado específico — os mesmos requisitos + dolo, **vítimas diferentes** e **violência ou grave ameaça** à pessoa; até o triplo, pelas circunstâncias do art. 59.", "Regras comuns: **concurso material benéfico** (art. 70, p.ú., também para o 71, p.ú.); multas distintas e integrais (art. 72, com a controvérsia do **crime continuado**); cumprimento máximo de **40 anos** (art. 75; Súmula 715/STF); prescrição de cada crime isolado (art. 119; Súmula 497/STF); lei mais grave no continuado (Súmula 711/STF); sursis processual pela pena mínima do concurso (Súmulas 243/STJ e 723/STF).", "Pontos controvertidos para sinalizar em aula: dolo eventual e **desígnios autônomos**; latrocínio com várias vítimas; conceito de '**mesma espécie**'; **teoria objetiva pura** (Exposição de Motivos) × objetivo-subjetiva (tribunais); multa no **crime continuado**."], "juris": [{"sumula": "SUM-STJ-659", "tribunal": "STJ", "rotulo": "Súmula 659/STJ", "texto": "A fração de aumento em razão da prática de crime continuado deve ser fixada de acordo com o número de delitos cometidos, aplicando-se 1/6 pela prática de duas infrações, 1/5 para três, 1/4 para quatro, 1/3 para cinco, 1/2 para seis e 2/3 para sete ou mais infrações."}], "exemplos": ["Agente, com um só disparo, mata dolosamente A e, por imprudência, fere B → formal próprio; faça a conta e compare com a soma (concurso material benéfico).", "Agente pratica oito furtos em série contra lojas do mesmo shopping, num mês, pelo mesmo modo → continuado comum, aumento de 2/3.", "Agente que vive de roubos, sem plano comum, em cidades diferentes → habitualidade → concurso material."], "prova": "Primeiro conte as CONDUTAS; depois procure as palavras-chave: 'desígnios autônomos' (soma), 'mesma espécie' (71), 'vítimas diferentes + violência' (até o triplo)."}, "perguntas": [{"p": "Furto na segunda e lesão na sexta, sem ligação: qual o concurso?", "r": "Duas condutas, crimes diferentes, sem continuidade: **concurso material** heterogêneo (art. 69). As penas [[se somam]].", "exemplos": [{"t": "**Concurso material** — furto (mínima de 1 ano) + lesão leve (mínima de 3 meses) = [[1 ano e 3 meses]].", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, caput (lesão corporal)", "texto": "Ofender a integridade corporal ou a saúde de outrem:\nPena - detenção, de três meses a um ano."}}]}, {"p": "Motorista distraído atropela e mata dois pedestres: qual a pena?", "r": "Uma conduta culposa, dois crimes: **concurso formal próprio** (art. 70, 1ª parte). Pena de um homicídio [[+ 1/6]] (dois crimes).", "exemplos": [{"t": "**Formal próprio** — homicídio culposo de trânsito (mínima de 2 anos) + 1/6 = [[2 anos e 4 meses]].", "lei": {"chave": "L9503:302", "rotulo": "CTB, art. 302, caput (homicídio culposo no trânsito)", "texto": "Praticar homicídio culposo na direção de veículo automotor:\nPenas - detenção, de dois a quatro anos, e suspensão ou proibição de se obter a permissão ou a habilitação para dirigir veículo automotor."}}]}, {"p": "Bomba no carro para matar o patrão e o motorista: soma ou exasperação?", "r": "Uma conduta **dolosa** com **desígnios autônomos**: concurso formal impróprio (art. 70, 2ª parte). As penas [[se somam]].", "exemplos": [{"t": "**Formal impróprio** — dois homicídios (mínima de 6 anos cada) = [[12 anos]], e não 7 anos da exasperação.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio simples)", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos."}}]}, {"p": "Se a exasperação der 7 anos e a soma 6 anos e 2 meses, qual vale?", "r": "A **soma**, pelo **concurso material benéfico** (art. 70, p.ú.): a exasperação [[nunca pode superar]] o cúmulo."}, {"p": "Caixa que tira R$ 50 por dez dias seguidos, do mesmo jeito: qual o aumento?", "r": "Mesma espécie, mesmas condições, unidade de desígnios: **crime continuado comum** (art. 71). Dez crimes = [[2/3]] (Súmula 659/STJ).", "exemplos": [{"t": "**Continuado comum** — pena de um furto (mínima de 1 ano) + 2/3 = [[1 ano e 8 meses]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}, {"p": "Assaltante armado rouba três pessoas no mesmo ponto: até quanto sobe a pena?", "r": "Dolosos, **vítimas diferentes**, **grave ameaça**: continuado específico (art. 71, p.ú.). [[Até o triplo]], sem passar da soma nem dos 40 anos.", "exemplos": [{"t": "**Continuado específico** — pena de um roubo (mínima de 6 anos) até o triplo = [[até 18 anos]], que é também a soma das três.", "lei": {"chave": "CP:157", "rotulo": "CP, art. 157, caput (roubo)", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:\nPena – reclusão, de 6 (seis) a 10 (dez) anos, e multa."}}]}, {"p": "Ladrão profissional, sem plano comum, em cidades diferentes: há continuidade?", "r": "Não. **Habitualidade criminosa** não é continuação (teoria objetivo-subjetiva): é [[concurso material]], com prescrição contada crime a crime (art. 119).", "exemplos": [{"t": "**Habitualidade** — quatro furtos sem plano comum: 1 + 1 + 1 + 1 = [[4 anos]], somados, e prescrição de cada um em separado.", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}]}]}]</script>
<script>
"use strict";
const Q=JSON.parse(document.getElementById('dados').textContent);
const $=id=>document.getElementById(id);
// [[texto]] no conteúdo = destaque em vermelho no quadro (pedido do titular, 10/11/2026)
const marca=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="vm">$1</span>').replace(/\*\*(.+?)\*\*/g,'<strong class="ng">$1</strong>');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cur=0;const vistos=Q.map(()=>0);const abertos=Q.map(q=>q.passos.map(()=>0));
const artigo=l=>`<div class="artigo"><b>📜 ${esc(l.rotulo||l.chave)}</b><p>${esc(l.texto)}</p></div>`;
const nPerg=(i,j)=>((Q[i].passos[j].perguntas)||[]).length;
const linhaRes=r=>typeof r==='string'?marca(r):`${marca(r.t)}${r.ex?`<span class="rex">${marca(r.ex)}</span>`:''}`;
const exemplos=g=>(g.exemplos||[]).length?`<div class="exs">${g.exemplos.map(x=>`<div class="ex"><p>${marca(x.t)}</p>${x.lei?artigo(x.lei):''}</div>`).join('')}</div>`:'';
/* realça os elementos do tipo (texto literal da lei; cada elemento é um trecho dele) */
const tipoHTML=x=>{let h=esc(x.texto);[...(x.elementos||[])].sort((a,b)=>b.t.length-a.t.length).forEach(el=>{const e=esc(el.t);h=h.split(e).join(''+e+'')});h=h.replace(//g,'<strong class="el">').replace(//g,'</strong>');return `<div class="tipo"><b>📜 ${esc(x.rotulo)}</b><p>${h}</p><ul>${(x.elementos||[]).filter(el=>el.nota).map(el=>`<li><strong class="el">${esc(el.t)}</strong> — ${marca(el.nota)}</li>`).join('')}</ul></div>`};
let z=1;try{z=+(localStorage.getItem('quadro-erro:z')||1)||1}catch(e){}
function setZ(v){z=Math.max(.7,Math.min(1.9,Math.round(v*100)/100));document.documentElement.style.setProperty('--z',z);try{localStorage.setItem('quadro-erro:z',z)}catch(e){}}
function montar(){
 $('abas').innerHTML=Q.map((q,i)=>`<button class="aba" data-q="${i}">${i+1} · ${esc(q.titulo)}</button>`).join('');
 $('palco').innerHTML=Q.map((q,i)=>`<section class="quadro" id="q${i}"><div class="cab"><h1>${esc(q.titulo)}</h1><p>${esc(q.subtitulo)}</p><span class="traco"></span></div>
  <div class="grade">${q.passos.map((p,j)=>`<article class="bloco ${p.cor||'b'} ${j===q.passos.length-1?'sintese':''}" id="b${i}_${j}"><span class="num">${j+1}</span><h2>${esc(p.titulo)}</h2>
   ${(p.tipos||[]).length?`<div class="tipos">${p.tipos.map(tipoHTML).join('')}</div>`:''}
   ${p.perguntas&&p.perguntas.length?`<div class="mm">${p.perguntas.map((g,n)=>`<div class="no" data-no="${n}"><button class="nq" data-nq="${i}_${j}_${n}"><span class="mais">＋</span><span>${esc(g.p)}</span></button><div class="nr"><p>${marca(g.r)}</p>${g.lei?artigo(g.lei):''}${exemplos(g)}</div></div>`).join('')}</div><div class="emres"><b>⚡ EM RESUMO</b><ul class="res">${(p.resumo||[]).map(r=>`<li>${linhaRes(r)}</li>`).join('')}</ul></div>`:`<ul class="res">${(p.resumo||[]).map(r=>`<li>${linhaRes(r)}</li>`).join('')}</ul>`}
   ${(p.lei||[]).length?`<div class="leis">${p.lei.map((l,m)=>`<button class="lei" data-lei="${i}_${j}_${m}">📜 ${esc(l.rotulo||l.chave)}</button>`).join('')}</div>`:''}
   <div class="dia"><b>🏠 NO DIA A DIA</b>${esc(p.exemplo)}</div>
   ${p.pegadinha?`<div class="peg"><b>⚠ PEGADINHA:</b> ${esc(p.pegadinha)}</div>`:''}
   <button class="aprof" data-ap="${i}_${j}">📖 DOUTRINA / APROFUNDAMENTO</button></article>`).join('')}</div>
  <div class="completo">✓ QUADRO COMPLETO</div></section>`).join('');
}
function blocos(i){return [...document.querySelectorAll(`#q${i} .bloco`)]}
function pintar(rolar){
 document.querySelectorAll('.quadro').forEach((s,i)=>s.classList.toggle('on',i===cur));
 document.querySelectorAll('.aba').forEach((a,i)=>a.classList.toggle('on',i===cur));
 const bs=blocos(cur),n=vistos[cur];
 bs.forEach((b,j)=>{b.classList.toggle('on',j<n);b.classList.toggle('atual',j===n-1);const a=abertos[cur][j];[...b.querySelectorAll('.no')].forEach((x,k)=>x.classList.toggle('on',k<a));b.classList.toggle('todas',a>=nPerg(cur,j))});
 $('q'+cur).classList.toggle('cheio',n===bs.length);
 $('cont').textContent=`Passo ${n} / ${bs.length}`;
 document.title=`${Q[cur].titulo} · passo ${n} de ${bs.length} · Prof. Pietro Medeiros`;
 if(rolar&&n>0){const b=bs[n-1];setTimeout(()=>b.scrollIntoView({block:'center',behavior:'smooth'}),60)}
}
// passo a passo: primeiro abre as perguntas do bloco atual, depois revela o próximo bloco
function rolarNo(j){const b=blocos(cur)[j],a=abertos[cur][j];const alvo=a?b.querySelectorAll('.no')[a-1]:b;setTimeout(()=>alvo.scrollIntoView({block:'center',behavior:'smooth'}),60)}
function prox(){const n=vistos[cur];if(n>0&&abertos[cur][n-1]<nPerg(cur,n-1)){abertos[cur][n-1]++;pintar(false);return rolarNo(n-1)}
 if(n<blocos(cur).length){vistos[cur]++;pintar(true)}}
function ant(){const n=vistos[cur];if(n===0)return;if(abertos[cur][n-1]>0){abertos[cur][n-1]--;pintar(false);return rolarNo(n-1)}vistos[cur]--;pintar(true)}
function tudo(){vistos[cur]=blocos(cur).length;abertos[cur]=Q[cur].passos.map((_,j)=>nPerg(cur,j));pintar(false)}
function limpa(){vistos[cur]=0;abertos[cur]=Q[cur].passos.map(()=>0);pintar(false);$('palco').scrollTo(0,0)}
function ir(i){if(i>=0&&i<Q.length){cur=i;pintar(false);$('palco').scrollTo(0,0)}}
function abrir(html){$('folha').innerHTML=`<div class="ftools"><button data-z="-" title="Letra menor (−)">A−</button><button data-z="+" title="Letra maior (+)">A+</button><button id="fechar">✕ Fechar (Esc)</button></div>`+html;$('tela').classList.add('on');$('fechar').onclick=fechar;$('folha').scrollTop=0;$('fechar').focus()}
function fechar(){$('tela').classList.remove('on')}
function aprofundar(i,j){
 const p=Q[i].passos[j],a=p.aprofundar||{};
 abrir(`<div class="kick">${esc(Q[i].titulo)} · passo ${j+1}</div><h2>${esc(p.titulo)}</h2>
 <div class="sec-dou"><h3>📖 Doutrina</h3><ol class="dou">${(a.doutrina||[]).map(x=>`<li><p>${marca(x)}</p></li>`).join('')}</ol></div>
 ${(p.lei||[]).length?`<div class="sec-lei"><h3>📜 Letra da lei</h3>${p.lei.map(artigo).join('')}</div>`:''}
 ${(a.juris||[]).length?`<div class="sec-jur"><h3>⚖️ Jurisprudência</h3>${a.juris.map(x=>`<div class="jur"><b>${esc(x.rotulo||x.tribunal)}${x.data?' · '+esc(x.data):''}${x.fonte?' · '+esc(x.fonte):''}</b><p>${esc(x.texto)}</p></div>`).join('')}</div>`:''}
 <div class="sec-cas"><h3>🏠 Exemplos do dia a dia</h3><ul class="cas"><li>${esc(p.exemplo)}</li>${(a.exemplos||[]).map(x=>`<li>${marca(x)}</li>`).join('')}</ul></div>
 ${a.prova||p.pegadinha?`<div class="sec-prova"><h3>🎯 Como cai na prova</h3><div class="prova">${p.pegadinha?`<p><b>Pegadinha:</b> ${esc(p.pegadinha)}</p>`:''}${a.prova?`<p>${esc(a.prova)}</p>`:''}</div></div>`:''}`);
}
document.addEventListener('click',e=>{
 const nq=e.target.closest('[data-nq]');if(nq){const[i,j,n]=nq.dataset.nq.split('_').map(Number);abertos[i][j]=abertos[i][j]>n?n:n+1;return pintar(false)}
 const zb=e.target.closest('[data-z]');if(zb)return setZ(z+(zb.dataset.z==='+'?.1:-.1));
 const a=e.target.closest('[data-q]');if(a)return ir(+a.dataset.q);
 const ap=e.target.closest('[data-ap]');if(ap){const[i,j]=ap.dataset.ap.split('_').map(Number);return aprofundar(i,j)}
 const l=e.target.closest('[data-lei]');if(l){const[i,j,m]=l.dataset.lei.split('_').map(Number);const L=Q[i].passos[j].lei[m];return abrir(`<div class="kick">Letra da lei</div><h2>${esc(L.rotulo||L.chave)}</h2>${artigo(L)}`)}
 if(e.target===$('tela'))fechar();
});
$('bProx').onclick=prox;$('bAnt').onclick=ant;$('bTudo').onclick=tudo;$('bLimpa').onclick=limpa;
$('bMais').onclick=()=>setZ(z+.1);$('bMenos').onclick=()=>setZ(z-.1);
$('bTela').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
/* caneta para mesa digitalizadora: tinta por cima do quadro, separada por quadro */
const cv=$('tinta'),cx=cv.getContext('2d');const CORES=['#1947b8','#c8202a','#1c1c1f','#16714a'];const GRIFOS=['#ffe55c','#9df0a8','#ffb3dc','#a9dcff'];/* marca-texto: o canvas usa multiply, então o grifo deixa o texto visível */let corAt=0,desenhando=false,ultimo=null;const tintas=Q.map(()=>null);
$('cores').innerHTML=CORES.map((c,i)=>`<button class="cor ${i?'':'on'}" style="background:${c}" data-cor="${i}" title="Caneta" aria-label="caneta ${i+1}"></button>`).join('')+'<span class="sep"></span>'+GRIFOS.map((c,i)=>`<button class="cor grifa" style="background:${c}" data-cor="${CORES.length+i}" title="Marca-texto" aria-label="marca-texto ${i+1}"></button>`).join('');
$('cores').onclick=e=>{const b=e.target.closest('[data-cor]');if(!b)return;corAt=+b.dataset.cor;$('cores').querySelectorAll('.cor').forEach(x=>x.classList.toggle('on',+x.dataset.cor===corAt))};
function tamanho(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;const img=cv.width?cx.getImageData(0,0,cv.width,cv.height):null;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);if(img)cx.putImageData(img,0,0)}
function caneta(on){document.body.classList.toggle('caneta',on);$('bCaneta').classList.toggle('on',on)}
$('bCaneta').onclick=()=>caneta(!document.body.classList.contains('caneta'));
$('bApaga').onclick=()=>cx.clearRect(0,0,cv.width,cv.height);
cv.addEventListener('pointerdown',e=>{desenhando=true;ultimo=[e.offsetX,e.offsetY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!desenhando)return;const p=e.pressure&&e.pointerType==='pen'?e.pressure:.5;const gr=corAt>=CORES.length;cx.globalCompositeOperation=gr?'darken':'source-over';cx.strokeStyle=gr?GRIFOS[corAt-CORES.length]:CORES[corAt];cx.lineWidth=gr?26:2+p*6;cx.lineCap=gr?'butt':'round';cx.lineJoin='round';cx.beginPath();cx.moveTo(...ultimo);cx.lineTo(e.offsetX,e.offsetY);cx.stroke();ultimo=[e.offsetX,e.offsetY]});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{desenhando=false}));
const trocarQuadro=ir;ir=function(i){if(i<0||i>=Q.length)return;tintas[cur]=cx.getImageData(0,0,cv.width,cv.height);cx.clearRect(0,0,cv.width,cv.height);trocarQuadro(i);if(tintas[i])cx.putImageData(tintas[i],0,0)};
window.addEventListener('resize',tamanho);
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
 if($('tela').classList.contains('on')){if(k==='Escape'||k.toLowerCase()==='d'){e.preventDefault();fechar()}else if(k==='+'||k==='=')setZ(z+.1);else if(k==='-')setZ(z-.1);return}
 if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();prox()}
 else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();ant()}
 else if(k.toLowerCase()==='t')tudo();else if(k.toLowerCase()==='l')limpa();
 else if(k.toLowerCase()==='d'){const n=vistos[cur];if(n)aprofundar(cur,n-1)}
 else if(k.toLowerCase()==='p')caneta(!document.body.classList.contains('caneta'));
 else if(k.toLowerCase()==='x')cx.clearRect(0,0,cv.width,cv.height);
 else if(k.toLowerCase()==='f')$('bTela').click();
 else if(k==='+'||k==='=')setZ(z+.1);else if(k==='-')setZ(z-.1);
 else if(/^[1-9]$/.test(k))ir(+k-1);
});
montar();setZ(z);tamanho();pintar(false);
