bre o nexo causal em sentido estrito (um só ato, e o resultado ocorre por curso causal diverso: empurrar da ponte para afogar, e a vítima morre ao bater no pilar) e **dolo geral** ou erro sucessivo (dois atos: o agente pensa já ter matado com o primeiro e, ao ocultar o 'cadáver', provoca a morte com o segundo, por exemplo, ao lançá-lo no rio, onde morre afogado).", "Em ambas, a doutrina majoritária mantém o dolo e imputa o resultado como doloso consumado, porque o desvio causal é irrelevante quando o resultado é o mesmo que se quis. Corrente minoritária sustenta, no **dolo geral**, tentativa de homicídio (primeiro ato) em concurso com homicídio culposo (segundo ato). Outro ponto controvertido: se o meio efetivo é diferente do pretendido (pretendia envenenar, mas a vítima morre afogada), qual qualificadora incide? Prevalece que se considera o meio pretendido (o dolo do agente), mas há quem sustente o meio efetivamente empregado. Sinalize a divergência."], "juris": [], "exemplos": ["Manifestante atira coquetel para incendiar um ônibus vazio e atinge o motorista, que sofre queimaduras → art. 74: lesão corporal culposa; se também queima o ônibus, concurso formal com o crime de dano ou incêndio.", "Agente mira o rival e só acerta o carro dele → não há dano culposo: responde por tentativa de homicídio (ou de lesão, conforme o dolo).", "Agente estrangula a vítima, pensa que ela morreu e a enterra; a perícia mostra morte por asfixia pela terra → dolo geral: homicídio doloso consumado (posição majoritária)."], "prova": "Três desvios, três perguntas: errou a PESSOA? (art. 73); errou a NATUREZA do bem? (art. 74); errou só o CAMINHO causal? (aberratio causae, sem artigo, dolo mantido)."}, "perguntas": [{"p": "O que é a aberratio criminis?", "r": "É o erro na execução que produz resultado de **natureza diversa**: o agente quer atingir uma coisa e atinge uma pessoa, ou o contrário. A relação é [[coisa × pessoa]]; de pessoa para pessoa, é o art. 73.", "exemplos": [{"t": "**Coisa → pessoa** — Bia atira uma pedra para quebrar a vidraça da loja do ex e acerta a cabeça de um cliente: [[responde por lesão corporal culposa]].", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, § 6º (lesão culposa)", "texto": "§ 6° Se a lesão é culposa: (Vide Lei nº 4.611, de 1965)"}}]}, {"p": "O que diz o art. 74?", "r": "Sobreveio resultado diverso do pretendido, o agente responde por ele [[a título de culpa]], se houver tipo culposo; se ocorreu também o resultado querido, aplica-se o concurso formal.", "lei": {"chave": "CP:74", "rotulo": "CP, art. 74", "texto": "Art. 74 - Fora dos casos do artigo anterior, quando, por acidente ou erro na execução do crime, sobrevém resultado diverso do pretendido, o agente responde por culpa, se o fato é previsto como crime culposo; se ocorre também o resultado pretendido, aplica-se a regra do art. 70 deste Código."}, "exemplos": [{"t": "**Os dois resultados** — a pedra de Bia quebra a vidraça E fere o cliente: dano doloso e lesão culposa em [[concurso formal]].", "lei": {"chave": "CP:163", "rotulo": "CP, art. 163, caput (dano)", "texto": "Art. 163 - Destruir, inutilizar ou deteriorar coisa alheia:"}}]}, {"p": "E se mirou a pessoa e só acertou a coisa?", "r": "Aplicar o art. 74 levaria à impunidade, porque [[não existe dano culposo]]. A solução é punir a **tentativa** do crime pretendido: quem mira o rival e só acerta o carro responde por tentativa de homicídio.", "exemplos": [{"t": "**Pessoa → coisa** — Dino atira no rival e acerta só o carro dele. Pelo art. 74 seria dano culposo, que não existe: [[responde por tentativa de homicídio]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}]}, {"p": "O que é a aberratio causae?", "r": "É o erro sobre o **nexo causal**: o resultado querido acontece, mas por um caminho diferente do planejado. Como o resultado é o mesmo, o [[dolo é mantido]], e o agente responde pelo crime consumado.", "exemplos": [{"t": "**Nexo causal diverso** — Gil empurra a vítima da ponte para que se afogue, mas ela morre ao bater a cabeça no pilar: o resultado querido aconteceu, [[homicídio doloso consumado]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}]}, {"p": "O que é o dolo geral?", "r": "É a aberratio causae em **dois atos**: o agente pensa ter matado com o primeiro e causa a morte com o segundo, ao ocultar o 'cadáver'. A maioria imputa [[homicídio doloso consumado]]; a minoria, tentativa mais homicídio culposo.", "exemplos": [{"t": "**Dois atos** — Nei asfixia a vítima, pensa que ela morreu e a joga no rio para sumir com o 'corpo'; a morte vem do afogamento. A maioria imputa [[homicídio doloso consumado]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}]}]}, {"titulo": "ERRO DE PROIBIÇÃO (ART. 21)", "cor": "b", "resumo": [{"t": "O agente sabe o que faz, mas pensa que é PERMITIDO.", "ex": "Paulo sabe que a carteira achada é de outro, mas pensa que 'achado não é roubado'."}, {"t": "Inevitável: isenta de pena (exclui a culpabilidade).", "ex": "O agricultor isolado que cria a ave silvestre herdada do avô, sem ter como saber da proibição, fica isento."}, {"t": "Evitável: crime doloso, pena reduzida de 1/6 a 1/3.", "ex": "Quem mora na cidade e fica com a carteira achada, com o nome do dono dentro, tem a pena só reduzida."}, {"t": "Direto (norma), indireto (justificante), mandamental (dever de agir).", "ex": "Direto: fica com a carteira achada; indireto: atira no ladrão em fuga; mandamental: não socorre o ciclista ferido."}, {"t": "Desconhecer a lei é inescusável, mas atenua (art. 65, II).", "ex": "O comerciante que compra celular roubado e diz não saber que era crime responde por receptação, só com atenuante."}], "lei": [{"chave": "CP:21", "rotulo": "CP, art. 21, caput", "texto": "O desconhecimento da lei é inescusável. O erro sobre a ilicitude do fato, se inevitável, isenta de pena; se evitável, poderá diminuí-la de um sexto a um terço."}, {"chave": "CP:21", "rotulo": "CP, art. 21, parágrafo único", "texto": "Parágrafo único - Considera-se evitável o erro se o agente atua ou se omite sem a consciência da ilicitude do fato, quando lhe era possível, nas circunstâncias, ter ou atingir essa consciência."}, {"chave": "CP:65", "rotulo": "CP, art. 65, II", "texto": "II - o desconhecimento da lei;"}], "exemplo": "Um agricultor de uma região isolada, sem acesso a informação, mantém em casa, há décadas, uma ave silvestre herdada do avô, crendo que, por ser 'de família', não há proibição: pode haver erro de proibição inevitável. Já quem acha uma carteira na rua e fica com ela, convencido de que 'achado não é roubado', tinha todos os meios de saber que deve devolver: o erro é evitável e só reduz a pena (CP, art. 169, parágrafo único, II).", "pegadinha": "Erro de proibição NÃO exclui o dolo: mesmo inevitável, ele isenta de pena por afastar a culpabilidade (potencial consciência da ilicitude).", "aprofundar": {"doutrina": ["**Erro de proibição** é o erro sobre a ilicitude do fato: o agente conhece perfeitamente a situação de fato, mas acredita que sua conduta é lícita. Não se confunde com **desconhecimento da lei**: ninguém precisa conhecer o artigo de lei ou a pena; basta que tenha (ou pudesse ter) a consciência profana de que a conduta é contrária ao Direito. A doutrina fala em 'valoração paralela na esfera do leigo'. O desconhecimento da lei, em si, é **inescusável** e funciona apenas como atenuante genérica (art. 65, II).", "Pela **teoria normativa pura** da culpabilidade (finalista), a consciência da ilicitude é POTENCIAL: não se exige que o agente saiba efetivamente que é ilícito, mas que pudesse saber. Por isso o erro **inevitável** exclui a culpabilidade (**isenta de pena**) e o erro **evitável** a mantém, apenas reduzida (diminui a pena de 1/6 a 1/3). O parágrafo único traz o critério: é evitável quando era possível, nas circunstâncias, ter ou atingir a consciência da ilicitude.", "Espécies: (a) direto, quando o erro recai sobre a norma proibitiva (o agente desconhece a proibição ou a interpreta mal, como quem pensa que é permitido ficar com coisa achada); (b) indireto, quando recai sobre a existência ou os limites de uma causa de justificação (**descriminante putativa** por **erro de proibição**, segundo a teoria limitada); (c) mandamental, nos crimes omissivos, quando o agente erra sobre o dever de agir (o garante que acredita não ter obrigação de agir em certa situação).", "O caráter **evitável** se mede pelas circunstâncias concretas do agente: instrução, meio social, profissão, acesso à informação, se o assunto é de conhecimento comum. Para os profissionais de uma atividade regulada, exige-se o dever de se informar; para o homem comum, a ilicitude de crimes 'naturais' (matar, furtar) é **inescusável**. A redução de 1/6 a 1/3 é graduada pelo grau de evitabilidade: quanto mais fácil seria evitar, menor a redução.", "Ponto de distinção clássico: a Lei de Contravenções Penais tem regra própria sobre a ignorância ou errada compreensão da lei, quando escusáveis, autorizando o juiz a deixar de aplicar a pena (art. 8º da LCP). É cobrado como especialidade em relação ao art. 21 do CP."], "juris": [], "exemplos": ["Estrangeiro recém-chegado que porta pequena quantidade de substância lícita em seu país, de boa-fé e sem indicação de proibição → erro de proibição direto; a evitabilidade depende de seu acesso à informação (viajar a outro país sugere o dever de se informar).", "Pai que crê ter o direito de trancar o filho adulto em casa para 'tratá-lo' → erro sobre os limites de um direito: erro de proibição indireto.", "Salva-vidas em serviço que, por má compreensão do regulamento, crê não ter o dever de socorrer banhista fora da área demarcada e se omite → erro de proibição mandamental (erro sobre o dever de agir); se evitável, responde pelo crime omissivo impróprio com pena reduzida."], "prova": "Duas frases fazem a questão: 'desconhecimento da lei é inescusável' (certo) e 'o erro de proibição exclui o dolo' (errado: exclui ou reduz a CULPABILIDADE). Inevitável = isenta; evitável = diminui de 1/6 a 1/3."}, "perguntas": [{"p": "O que é o erro de proibição?", "r": "É o erro sobre a **ilicitude do fato**: o agente sabe exatamente o que faz, mas acredita que é [[permitido]]. Não se exige que conheça o artigo de lei, basta a **consciência profana** de que a conduta é contrária ao Direito.", "exemplos": [{"t": "**Consciência profana** — Paulo não precisa conhecer o art. 169 do CP; basta poder perceber, como leigo, que ficar com a carteira alheia é errado. Se podia: [[responde pelo crime, com redução]].", "lei": {"chave": "CP:169", "rotulo": "CP, art. 169, parágrafo único, II (apropriação de coisa achada)", "texto": "II - quem acha coisa alheia perdida e dela se apropria, total ou parcialmente, deixando de restituí-la ao dono ou legítimo possuidor ou de entregá-la à autoridade competente, dentro no prazo de quinze dias."}}]}, {"p": "O que diz o art. 21?", "r": "Ignorar a lei não desculpa ninguém; mas o erro sobre a ilicitude, se inevitável, [[isenta de pena]], e, se evitável, reduz a pena de 1/6 a 1/3.", "lei": {"chave": "CP:21", "rotulo": "CP, art. 21, caput", "texto": "O desconhecimento da lei é inescusável. O erro sobre a ilicitude do fato, se inevitável, isenta de pena; se evitável, poderá diminuí-la de um sexto a um terço."}}, {"p": "Evitável ou inevitável?", "r": "É **evitável** quando o agente podia, nas circunstâncias, chegar à consciência da ilicitude: instrução, meio social, profissão e acesso à informação contam. Quem fica com a carteira achada [[tinha como saber]] que devia devolver.", "lei": {"chave": "CP:21", "rotulo": "CP, art. 21, parágrafo único", "texto": "Parágrafo único - Considera-se evitável o erro se o agente atua ou se omite sem a consciência da ilicitude do fato, quando lhe era possível, nas circunstâncias, ter ou atingir essa consciência."}, "exemplos": [{"t": "**Inevitável** — o agricultor isolado, sem rádio nem escola, que cria há décadas a ave silvestre herdada do avô: não tinha como saber da proibição, [[fica isento de pena]].", "lei": {"chave": "L9605:29", "rotulo": "Lei 9.605/1998, art. 29, caput (crime contra a fauna)", "texto": "Art. 29. Matar, perseguir, caçar, apanhar, utilizar espécimes da fauna silvestre, nativos ou em rota migratória, sem a devida permissão, licença ou autorização da autoridade competente, ou em desacordo com a obtida:"}}, {"t": "**Evitável** — o morador da cidade que fica com a carteira achada, com documentos e nome do dono dentro: tinha como saber, [[pena reduzida de 1/6 a 1/3]].", "lei": {"chave": "CP:169", "rotulo": "CP, art. 169, parágrafo único, II (apropriação de coisa achada)", "texto": "II - quem acha coisa alheia perdida e dela se apropria, total ou parcialmente, deixando de restituí-la ao dono ou legítimo possuidor ou de entregá-la à autoridade competente, dentro no prazo de quinze dias."}}]}, {"p": "O erro de proibição exclui o dolo?", "r": "Não. Ele atinge a **culpabilidade** (a potencial consciência da ilicitude): mesmo inevitável, o dolo permanece e o agente é **isento de pena**. Dizer que 'exclui o dolo' é [[a pegadinha clássica]]."}, {"p": "Quais são as espécies?", "r": "**Direto**, sobre a norma proibitiva; **indireto**, sobre a existência ou os limites de uma justificante; **mandamental**, nos crimes omissivos, sobre o [[dever de agir]].", "exemplos": [{"t": "**Direto** — Paulo crê que não há lei proibindo ficar com a carteira achada: erra sobre a [[norma proibitiva]].", "lei": {"chave": "CP:169", "rotulo": "CP, art. 169, parágrafo único, II (apropriação de coisa achada)", "texto": "II - quem acha coisa alheia perdida e dela se apropria, total ou parcialmente, deixando de restituí-la ao dono ou legítimo possuidor ou de entregá-la à autoridade competente, dentro no prazo de quinze dias."}}, {"t": "**Indireto** — Seu Zé atira nas pernas do ladrão que foge, crendo que a legítima defesa permite: erra sobre o [[limite da justificante]] e responde por lesão corporal dolosa.", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, caput (lesão corporal)", "texto": "Art. 129. Ofender a integridade corporal ou a saúde de outrem:"}}, {"t": "**Mandamental** — Lúcia não socorre o ciclista ferido por crer que só o causador do acidente deve ajudar: erra sobre o [[dever de agir]] e responde por omissão de socorro.", "lei": {"chave": "CP:135", "rotulo": "CP, art. 135, caput (omissão de socorro)", "texto": "Art. 135 - Deixar de prestar assistência, quando possível fazê-lo sem risco pessoal, à criança abandonada ou extraviada, ou à pessoa inválida ou ferida, ao desamparo ou em grave e iminente perigo; ou não pedir, nesses casos, o socorro da autoridade pública:"}}]}, {"p": "E o simples desconhecimento da lei?", "r": "É **inescusável**: não isenta nem reduz pelo art. 21. Funciona apenas como [[atenuante genérica]] do art. 65, II.", "lei": {"chave": "CP:65", "rotulo": "CP, art. 65, II", "texto": "II - o desconhecimento da lei;"}, "exemplos": [{"t": "**Desconhecimento da lei** — o comerciante compra celulares que sabe serem roubados e alega não saber que 'comprar' era crime. Ele sabia que a coisa era produto de crime: [[responde por receptação]], só com a atenuante do art. 65, II.", "lei": {"chave": "CP:180", "rotulo": "CP, art. 180, caput (receptação)", "texto": "Art. 180 - Adquirir, receber, transportar, conduzir ou ocultar, em proveito próprio ou alheio, coisa que sabe ser produto de crime"}}]}]}, {"titulo": "QUADRO-SÍNTESE DO ERRO", "cor": "k", "resumo": [{"t": "Tipo essencial: exclui dolo; vencível → culpa, se previsto (art. 20).", "ex": "O hóspede que leva do hotel a mala alheia, igual à sua, não comete crime: não há furto culposo."}, {"t": "Putativa de fato: isenta; vencível → culpa imprópria (art. 20 § 1º).", "ex": "O morador que atira no filho pensando ser ladrão fica isento se o erro era justificado; se vencível, homicídio culposo."}, {"t": "Acidental (objeto, pessoa, ictus, criminis, causae): não exclui o dolo.", "ex": "Pedro (confunde a vítima), Marcos (erra a mira), Bia (coisa → pessoa), Gil (nexo diverso): o dolo continua."}, {"t": "Proibição: inevitável isenta; evitável reduz de 1/6 a 1/3 (art. 21).", "ex": "Paulo, que fica com a carteira achada crendo ser lícito, tem a pena reduzida se tinha como saber."}], "lei": [{"chave": "CP:20", "rotulo": "CP, art. 20, caput", "texto": "O erro sobre elemento constitutivo do tipo legal de crime exclui o dolo, mas permite a punição por crime culposo, se previsto em lei."}, {"chave": "CP:21", "rotulo": "CP, art. 21, caput", "texto": "O desconhecimento da lei é inescusável. O erro sobre a ilicitude do fato, se inevitável, isenta de pena; se evitável, poderá diminuí-la de um sexto a um terço."}], "exemplo": "Num único dia de plantão, o delegado pode ver tudo: o hóspede que leva a mala alheia (erro de tipo), o morador que atira no filho pensando ser ladrão (descriminante putativa), o atirador que acerta o garçom (aberratio ictus) e quem fica com a carteira achada crendo que 'achado não é roubado' (erro de proibição). A pergunta é sempre a mesma: sobre o que o agente errou?", "pegadinha": "Antes de aplicar a consequência, classifique o erro: o mesmo fato pode mudar de artigo conforme o erro recaia sobre o FATO ou sobre a PERMISSÃO.", "aprofundar": {"doutrina": ["Roteiro de solução: (1) o agente errou sobre a realidade ou sobre a permissão? (2) se sobre a realidade, o dado é essencial (elementar, circunstância, pressuposto fático de justificante) ou acidental (objeto, pessoa, execução, resultado, nexo)? (3) se essencial, era **vencível** ou **invencível**, e há tipo culposo? (4) se sobre a permissão, era evitável ou **inevitável**? (5) se acidental, qual a regra de imputação (**vítima virtual**, concurso formal, culpa, dolo mantido)?", "Quadro comparativo. **ERRO DE TIPO ESSENCIAL** (art. 20, caput): objeto = elementar ou circunstância; inevitável = **exclui dolo e culpa** (atípico); evitável = exclui dolo, pune por culpa se houver tipo culposo. **DESCRIMINANTE PUTATIVA** POR ERRO DE FATO (art. 20, § 1º): objeto = pressuposto fático da justificante; inevitável = isento de pena; evitável = culpa imprópria, se houver tipo culposo. **ERRO DETERMINADO POR TERCEIRO** (§ 2º): responde quem determinou o erro, por dolo ou culpa; o enganado segue as regras gerais.", "ERRO ACIDENTAL: sobre o objeto = responde pelo que atingiu; sobre a pessoa (§ 3º) = qualidades da vítima virtual; aberratio ictus (art. 73) = vítima virtual na unidade simples, art. 70 na unidade complexa; **aberratio criminis** (art. 74) = culpa pelo resultado diverso, se previsto; art. 70 se houver os dois; **aberratio causae** = dolo mantido, resultado consumado (majoritário). **ERRO DE PROIBIÇÃO** (art. 21): direto, indireto ou mandamental; inevitável = isenta de pena; evitável = reduz de 1/6 a 1/3; **desconhecimento da lei** = inescusável, atenuante (art. 65, II).", "Base teórica que amarra tudo: finalismo (dolo e culpa no tipo; consciência potencial da ilicitude na culpabilidade), **teoria normativa pura** da culpabilidade e, para as **descriminantes putativas**, **teoria LIMITADA da culpabilidade** (Exposição de Motivos da Parte Geral, item 19). Pontos controvertidos a sinalizar em discursivas: natureza do art. 20, § 1º (**erro de tipo permissivo** × sui generis × erro de proibição pela teoria extremada); tentativa na culpa imprópria; dolo eventual e desígnios autônomos no art. 73; qualificadora do meio no dolo geral."], "juris": [], "exemplos": ["Hóspede leva mala alheia por engano → erro de tipo essencial; sem furto culposo, atípico.", "Morador atira no filho supondo ser ladrão armado → art. 20, § 1º: isento se o erro era plenamente justificado; se não, homicídio culposo (culpa imprópria).", "Pessoa fica com a carteira achada crendo que 'achado não é roubado' → erro de proibição direto (CP, art. 169, parágrafo único, II); evitável, pena reduzida de 1/6 a 1/3."], "prova": "As bancas misturam CONSEQUÊNCIAS: 'exclui o dolo' é do erro de tipo; 'isenta de pena' é do erro inevitável de proibição e da putativa de fato justificada; 'reduz de 1/6 a 1/3' é só do erro de proibição evitável; 'não exclui o dolo' é do erro acidental."}, "perguntas": [{"p": "Erro de tipo essencial: qual a consequência?", "r": "**Sempre exclui o dolo**. Se invencível, exclui também a culpa e o fato é atípico; se vencível, pune-se por culpa [[se houver tipo culposo]] (art. 20, caput).", "exemplos": [{"t": "**Exemplo** — o hóspede leva do hotel a mala alheia, igual à sua: [[sem dolo e sem furto culposo, não há crime]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Art. 155 - Subtrair, para si ou para outrem, coisa alheia móvel:"}}]}, {"p": "Descriminante putativa por erro de fato: qual a consequência?", "r": "Erro plenamente justificado [[isenta de pena]]; erro vencível leva à **culpa imprópria**, se houver tipo culposo (art. 20, § 1º, teoria limitada).", "exemplos": [{"t": "**Exemplo** — o morador atira no filho pensando ser ladrão: erro justificado [[isenta]]; vencível, responde por homicídio culposo (culpa imprópria).", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 3º (homicídio culposo)", "texto": "§ 3º Se o homicídio é culposo: (Vide Lei nº 4.611, de 1965)"}}]}, {"p": "Erro provocado por terceiro: quem responde?", "r": "Responde o **terceiro que determinou o erro**, por dolo ou culpa, como [[autor mediato]] quando age com dolo; o enganado segue as regras gerais (art. 20, § 2º).", "exemplos": [{"t": "**Exemplo** — o médico que dá à enfermeira o veneno no lugar do antibiótico [[responde por homicídio qualificado como autor mediato]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, § 2º, III (homicídio qualificado)", "texto": "III - com emprego de veneno, fogo, explosivo, asfixia, tortura ou outro meio insidioso ou cruel, ou de que possa resultar perigo comum;"}}]}, {"p": "Errou a pessoa ou errou a mira: o que muda?", "r": "O mecanismo: no erro sobre a pessoa (§ 3º) o agente **vê mal**; na aberratio ictus (art. 73) ele **mira mal**. A consequência é a mesma: valem as qualidades da [[vítima virtual]].", "exemplos": [{"t": "**Vê mal** — Pedro confunde o vizinho com o pai e o mata: [[homicídio com as qualidades do pai]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}, {"t": "**Mira mal** — Marcos mira o rival e a bala mata o garçom: [[homicídio como se tivesse matado o rival]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}]}, {"p": "Atingiu bem de natureza diversa ou errou só o caminho causal?", "r": "Natureza diversa é **aberratio criminis** (art. 74): culpa pelo resultado não querido, se previsto. Caminho causal diverso é **aberratio causae**: [[dolo mantido]], crime consumado.", "exemplos": [{"t": "**Natureza diversa** — Bia mira a vidraça e fere o cliente: [[lesão corporal culposa]].", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, § 6º (lesão culposa)", "texto": "§ 6° Se a lesão é culposa: (Vide Lei nº 4.611, de 1965)"}}, {"t": "**Caminho causal** — a vítima empurrada da ponte morre ao bater no pilar, não afogada: [[homicídio doloso consumado]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio)", "texto": "Art. 121. Matar alguem:"}}]}, {"p": "Erro de proibição: qual a consequência?", "r": "Inevitável [[isenta de pena]]; evitável reduz de 1/6 a 1/3, mantido o crime doloso (art. 21). O **desconhecimento da lei** é inescusável e só atenua.", "exemplos": [{"t": "**Exemplo** — quem fica com a carteira achada crendo que 'achado não é roubado' tinha como saber: [[pena reduzida de 1/6 a 1/3]], mantido o crime doloso.", "lei": {"chave": "CP:169", "rotulo": "CP, art. 169, parágrafo único, II (apropriação de coisa achada)", "texto": "II - quem acha coisa alheia perdida e dela se apropria, total ou parcialmente, deixando de restituí-la ao dono ou legítimo possuidor ou de entregá-la à autoridade competente, dentro no prazo de quinze dias."}}]}, {"p": "Qual a primeira pergunta diante de qualquer caso?", "r": "**Sobre o que o agente errou?** Sobre o fato (erro de tipo), sobre um dado secundário (erro acidental) ou sobre a permissão (erro de proibição). [[Classificar vem antes]] de aplicar a consequência."}]}]}, {"quadro": 2, "titulo": "CONCURSO DE CRIMES", "subtitulo": "Quando um só agente pratica vários crimes: somar, aumentar ou unificar?", "passos": [{"titulo": "CONCURSO DE CRIMES: O QUE É", "cor": "b", "resumo": [{"t": "Um ou mais agentes, uma ou mais condutas, DOIS ou mais crimes", "ex": "Carlos furta uma bicicleta de manhã e, à noite, agride um desconhecido num bar: dois crimes."}, {"t": "Não confundir: concurso de PESSOAS (art. 29) é vários agentes, um crime", "ex": "Dois amigos furtam juntos uma moto: dois agentes, mas um só furto (art. 155)."}, {"t": "Concurso APARENTE de normas: um fato só, várias leis parecem incidir", "ex": "Quem entra na casa só para furtar responde pelo furto; a violação de domicílio fica absorvida."}, {"t": "Sistemas: cúmulo material (soma), exasperação (aumenta uma), absorção (só a maior)", "ex": "Dois furtos de 1 ano: soma = 2 anos; exasperação = 1 ano e 2 meses; absorção = 1 ano."}, {"t": "O CP usa cúmulo (arts. 69 e 70, 2ª parte) e exasperação (70 e 71)", "ex": "Furto + roubo em dias diferentes somam-se (art. 69); dois atropelamentos de uma vez exasperam (art. 70)."}], "lei": [{"chave": "CP:29", "rotulo": "CP, art. 29, caput (concurso de PESSOAS, para contraste)", "texto": "Quem, de qualquer modo, concorre para o crime incide nas penas a este cominadas, na medida de sua culpabilidade."}], "exemplo": "Dois amigos furtam juntos uma bicicleta: um crime, dois agentes — concurso de PESSOAS. Um homem, numa mesma noite, furta uma bicicleta e depois agride o vigia: dois crimes — concurso de CRIMES. Quem falsifica um cheque só para aplicar um golpe responde só pelo estelionato: concurso APARENTE.", "pegadinha": "Concurso aparente de normas NÃO é concurso de crimes: há um só crime, resolvido por especialidade, subsidiariedade ou consunção.", "aprofundar": {"doutrina": ["Há concurso de crimes (concursus delictorum) quando o agente, com uma ou várias condutas, realiza dois ou mais tipos penais, ou o mesmo tipo mais de uma vez. O tema não cria crime: é matéria de APLICAÇÃO DA PENA, por isso está no Título V da Parte Geral (arts. 69 a 76), logo depois do art. 68 (critério trifásico). A pena de cada crime é dosada separadamente e, só depois, entram as regras do concurso.", "Distinções obrigatórias. (a) **Concurso de pessoas** (art. 29): pluralidade de AGENTES para um mesmo crime; pode coexistir com o concurso de crimes (dois assaltantes que roubam três vítimas). (b) **Concurso aparente de normas** (conflito aparente): há UM só fato e várias normas que parecem incidir, mas só uma se aplica, pelos princípios da especialidade, subsidiariedade, consunção (**absorção**) e, para parte da doutrina, alternatividade. Ali não se somam penas; aqui, sim.", "Sistemas de aplicação da pena. **Cúmulo material**: somam-se as penas (art. 69 e art. 70, 2ª parte). **Exasperação**: aplica-se a pena de um só crime (a mais grave) aumentada de uma fração (art. 70, 1ª parte, e art. 71). **Absorção**: só a **pena mais grave**, sem aumento — não adotado como regra geral no CP. Cúmulo jurídico: pena intermediária, maior que a do mais grave e menor que a soma — também não adotado. A doutrina lembra que o sistema da exasperação é um favor legal: evita penas desproporcionais.", "Espécies no CP: **concurso material** (art. 69), **concurso formal próprio** e impróprio (art. 70) e **crime continuado** comum e específico (art. 71). O fio condutor é simples: conte as CONDUTAS (uma ou mais) e veja o VÍNCULO entre os crimes (desígnio único, **desígnios autônomos**, continuação)."], "juris": [{"sumula": "SUM-STJ-17", "tribunal": "STJ", "rotulo": "Súmula 17/STJ (consunção: concurso APARENTE, não de crimes)", "texto": "Quando o falso se exaure no estelionato, sem mais potencialidade lesiva, é por este absorvido."}], "exemplos": ["Agente falsifica documento e o usa para enganar a vítima, esgotando-se o falso no golpe → um só crime (estelionato), por consunção (Súmula 17/STJ); não há concurso de crimes.", "Dois agentes, juntos, roubam um ônibus e levam o celular de cinco passageiros → concurso de pessoas (art. 29) E concurso de crimes (cinco roubos, art. 70) ao mesmo tempo.", "Agente invade casa para furtar → a violação de domicílio é meio e fica absorvida pelo furto (consunção), não há concurso material."], "prova": "A banca troca os três 'concursos'. Palavra que decide: 'vários AGENTES' (pessoas), 'várias NORMAS para um fato' (aparente), 'vários CRIMES' (de crimes)."}, "perguntas": [{"p": "O que é o concurso de crimes?", "r": "É quando o agente, com **uma ou várias condutas**, pratica [[dois ou mais crimes]]. Não cria crime novo: é matéria de **aplicação da pena** (arts. 69 a 76).", "exemplos": [{"t": "**Dois crimes, um agente** — Carlos furta uma bicicleta de manhã e, à noite, num bar, dá um soco num desconhecido: furto (art. 155) + lesão corporal (art. 129). Se o juiz fixar as mínimas, 1 ano + 3 meses = [[1 ano e 3 meses, penas somadas]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}, {"p": "Qual a diferença para o concurso de pessoas?", "r": "No **concurso de pessoas** há vários AGENTES para [[um mesmo crime]]; no concurso de crimes, há vários CRIMES. Os dois podem coexistir: dois assaltantes que roubam três vítimas.", "exemplos": [{"t": "**Concurso de pessoas** — dois amigos, combinados, furtam juntos uma moto: há [[um só furto]] (art. 155), e cada um responde por ele na medida da sua culpabilidade (art. 29).", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}, {"t": "**Concurso de crimes** — um só agente furta uma moto na segunda e, na sexta, rouba um celular com faca: furto (mínima de 1 ano) + roubo (mínima de 6 anos) = [[7 anos, penas somadas]] (art. 69).", "lei": {"chave": "CP:157", "rotulo": "CP, art. 157, caput (roubo)", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:\nPena – reclusão, de 6 (seis) a 10 (dez) anos, e multa."}}]}, {"p": "O que diz o art. 29?", "r": "Quem colabora de qualquer modo para o crime responde por ele, na medida da sua **culpabilidade**. Serve aqui só de [[contraste]]: é regra de concurso de pessoas, não de crimes.", "lei": {"chave": "CP:29", "rotulo": "CP, art. 29, caput", "texto": "Quem, de qualquer modo, concorre para o crime incide nas penas a este cominadas, na medida de sua culpabilidade."}}, {"p": "E o concurso aparente de normas?", "r": "Há [[um só fato]] e várias normas que parecem incidir, mas só uma se aplica, por **especialidade**, **subsidiariedade** ou **consunção**. Por isso não se somam penas: o falso que se esgota no estelionato é absorvido.", "exemplos": [{"t": "**Consunção** — o ladrão pula o muro e entra na casa só para furtar a TV: a violação de domicílio (art. 150) é meio do furto e [[fica absorvida]]; responde só pelo furto.", "lei": {"chave": "CP:150", "rotulo": "CP, art. 150, caput (violação de domicílio)", "texto": "Entrar ou permanecer, clandestina ou astuciosamente, ou contra a vontade expressa ou tácita de quem de direito, em casa alheia ou em suas dependências:\nPena - detenção, de um a três meses, ou multa."}}, {"t": "**Especialidade** — motorista distraído mata um pedestre: incide o homicídio culposo do CTB (art. 302), lei especial, e [[não o art. 121, § 3º, do CP]]; um crime só.", "lei": {"chave": "L9503:302", "rotulo": "CTB, art. 302, caput (homicídio culposo no trânsito)", "texto": "Praticar homicídio culposo na direção de veículo automotor:\nPenas - detenção, de dois a quatro anos, e suspensão ou proibição de se obter a permissão ou a habilitação para dirigir veículo automotor."}}, {"t": "**Falso absorvido** — o golpista falsifica um recibo só para enganar uma vítima e o falso se esgota ali: responde [[só pelo estelionato]] (art. 171; Súmula 17/STJ).", "lei": {"chave": "CP:171", "rotulo": "CP, art. 171, caput (estelionato)", "texto": "Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio fraudulento:\nPena – reclusão, de 1 (um) a 5 (cinco) anos, e multa."}}]}, {"p": "Quais são os sistemas de aplicação da pena?", "r": "**Cúmulo material** (soma), **exasperação** (pena de um crime aumentada de uma fração) e **absorção** (só a mais grave). O CP adota [[cúmulo e exasperação]]; absorção e cúmulo jurídico não são regra.", "exemplos": [{"t": "**Cúmulo material** — dois furtos simples em dias e lojas diferentes, pena mínima de 1 ano cada: 1 + 1 = [[2 anos]] (art. 69).", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}, {"t": "**Exasperação** — num só gesto, o ladrão leva as duas mochilas que dois estudantes deixaram no banco da praça: dois furtos, uma conduta → 1 ano + 1/6 = [[1 ano e 2 meses]] (art. 70).", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}, {"t": "**Absorção** — se fosse adotada, quem furta (1 ano) e rouba (6 anos) cumpriria só os 6 anos do roubo, o mais grave; o CP [[não a adota]] como regra.", "lei": {"chave": "CP:157", "rotulo": "CP, art. 157, caput (roubo)", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:\nPena – reclusão, de 6 (seis) a 10 (dez) anos, e multa."}}]}, {"p": "Como começar a resolver uma questão?", "r": "Conte as [[CONDUTAS]] (uma ou mais) e depois veja o **vínculo** entre os crimes: desígnio único, **desígnios autônomos** ou continuação. Daí sai a espécie: art. 69, 70 ou 71."}]}, {"titulo": "CONCURSO MATERIAL (ART. 69)", "cor": "b", "resumo": [{"t": "Mais de uma ação ou omissão + dois ou mais crimes", "ex": "Furta um celular na segunda e ameaça o vizinho na sexta: duas condutas, dois crimes."}, {"t": "Homogêneo (crimes iguais) ou heterogêneo (crimes diferentes)", "ex": "Dois furtos (homogêneo) ou um furto e uma lesão (heterogêneo): nos dois casos, soma."}, {"t": "Regra: cúmulo material — as penas se SOMAM", "ex": "Dois furtos simples, mínima de 1 ano cada: 1 + 1 = 2 anos."}, {"t": "Reclusão e detenção: executa-se primeiro a reclusão", "ex": "Furto (reclusão, 1 ano) + ameaça (detenção, 1 mês): cumpre primeiro o ano do furto."}], "lei": [{"chave": "CP:69", "rotulo": "CP, art. 69, caput", "texto": "Quando o agente, mediante mais de uma ação ou omissão, pratica dois ou mais crimes, idênticos ou não, aplicam-se cumulativamente as penas privativas de liberdade em que haja incorrido. No caso de aplicação cumulativa de penas de reclusão e de detenção, executa-se primeiro aquela."}, {"chave": "CP:69", "rotulo": "CP, art. 69, § 1º", "texto": "§ 1º - Na hipótese deste artigo, quando ao agente tiver sido aplicada pena privativa de liberdade, não suspensa, por um dos crimes, para os demais será incabível a substituição de que trata o art. 44 deste Código."}, {"chave": "CP:69", "rotulo": "CP, art. 69, § 2º", "texto": "§ 2º - Quando forem aplicadas penas restritivas de direitos, o condenado cumprirá simultaneamente as que forem compatíveis entre si e sucessivamente as demais."}], "exemplo": "Na segunda-feira, João furta um celular numa loja; na sexta, em outro bairro, agride o vizinho por causa de barulho. São duas condutas e dois crimes diferentes (furto + lesão corporal): concurso material heterogêneo. As penas se somam, e a de reclusão (furto) é cumprida antes da de detenção (lesão).", "pegadinha": "Concurso material não exige crimes iguais: 'idênticos ou não' está na própria lei.", "aprofundar": {"doutrina": ["**Concurso material** (ou real) exige dois requisitos: pluralidade de condutas (mais de uma ação ou omissão) e pluralidade de crimes. É homogêneo quando os crimes são idênticos (dois furtos) e heterogêneo quando diferentes (furto e lesão). É a regra residual: se não houver unidade de conduta (art. 70) nem os requisitos da continuação (art. 71), as penas se somam.", "Aplicação: o juiz dosa CADA pena pelo critério trifásico (art. 68) e só depois as soma. Havendo reclusão e detenção, executa-se primeiro a reclusão (art. 69, caput, parte final; e, em geral, a mais grave primeiro, art. 76). Se os crimes foram julgados em processos diferentes, a soma se faz na execução (LEP, art. 111), para fixar o regime.", "§ 1º: se por um dos crimes foi aplicada pena privativa de liberdade não suspensa (sem sursis), os demais não admitem substituição por restritiva de direitos (art. 44) — seria incoerente o condenado estar preso por um e 'prestando serviços' pelo outro. § 2º: se todas as penas forem restritivas de direitos, cumprem-se simultaneamente as compatíveis (prestação pecuniária e serviços à comunidade) e sucessivamente as incompatíveis (duas limitações de fim de semana, por exemplo).", "A pena total não tem teto na sentença, mas o CUMPRIMENTO se limita a **40 anos** (art. 75, redação da Lei 13.964/2019). Também a prescrição corre para cada crime isolado (art. 119) — ver passo 8."], "juris": [], "exemplos": ["Agente furta (1 a 6 anos, reclusão, na redação da Lei 15.397/2026) e, dias depois, comete ameaça (1 a 6 meses, detenção); penas fixadas em 1 ano e 1 mês → total de 1 ano e 1 mês; cumpre primeiro a reclusão.", "Condenado a 2 anos em regime aberto por furto (pena não suspensa nem substituída) e a 6 meses por outro crime → o § 1º veda a substituição do art. 44 para o segundo.", "Duas penas de prestação de serviços à comunidade, uma em hospital e outra em escola, em horários que colidem → cumprem-se sucessivamente (§ 2º)."], "prova": "Palavras que decidem: 'mais de uma ação ou omissão' + 'idênticos ou não' + 'cumulativamente'. Cuidado com a ordem: executa-se primeiro a RECLUSÃO."}, "perguntas": [{"p": "O que é o concurso material?", "r": "É a prática de dois ou mais crimes mediante [[mais de uma ação ou omissão]]. Exige **pluralidade de condutas** e **pluralidade de crimes**.", "exemplos": [{"t": "**Duas condutas, dois crimes** — João furta um celular na segunda e, na sexta, ameaça o vizinho de morte por causa do barulho: furto (1 ano) + ameaça (1 mês) = [[1 ano e 1 mês]]; cumpre primeiro a reclusão.", "lei": {"chave": "CP:147", "rotulo": "CP, art. 147, caput (ameaça)", "texto": "Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de causar-lhe mal injusto e grave:\nPena - detenção, de um a seis meses, ou multa."}}]}, {"p": "O que diz o art. 69?", "r": "Várias condutas e vários crimes, iguais ou não: as penas [[se somam]]. Havendo **reclusão** e **detenção**, cumpre-se primeiro a reclusão.", "lei": {"chave": "CP:69", "rotulo": "CP, art. 69, caput", "texto": "Quando o agente, mediante mais de uma ação ou omissão, pratica dois ou mais crimes, idênticos ou não, aplicam-se cumulativamente as penas privativas de liberdade em que haja incorrido. No caso de aplicação cumulativa de penas de reclusão e de detenção, executa-se primeiro aquela."}}, {"p": "Os crimes precisam ser iguais?", "r": "Não. É **homogêneo** quando os crimes são idênticos (dois furtos) e **heterogêneo** quando diferentes (furto e lesão). A própria lei diz [[idênticos ou não]].", "exemplos": [{"t": "**Homogêneo** — o agente furta uma loja do centro em março e outra, sem ligação, em agosto: dois furtos simples, mínima de 1 ano cada → [[2 anos]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}, {"t": "**Heterogêneo** — o agente furta (1 ano, reclusão) e, semanas depois, agride um desafeto numa festa (lesão leve, 3 meses, detenção) → [[1 ano e 3 meses]], cumprindo-se antes a reclusão.", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, caput (lesão corporal)", "texto": "Ofender a integridade corporal ou a saúde de outrem:\nPena - detenção, de três meses a um ano."}}]}, {"p": "O que dizem os §§ 1º e 2º?", "r": "Se por um crime houve pena de prisão **não suspensa**, os demais [[não admitem substituição]] do art. 44. Se todas forem **restritivas de direitos**, cumprem-se juntas as compatíveis e uma depois da outra as demais.", "lei": {"chave": "CP:69", "rotulo": "CP, art. 69, §§ 1º e 2º", "texto": "§ 1º - Na hipótese deste artigo, quando ao agente tiver sido aplicada pena privativa de liberdade, não suspensa, por um dos crimes, para os demais será incabível a substituição de que trata o art. 44 deste Código. (Redação dada pela Lei nº 7.209, de 11.7.1984)\n§ 2º - Quando forem aplicadas penas restritivas de direitos, o condenado cumprirá simultaneamente as que forem compatíveis entre si e sucessivamente as demais."}, "exemplos": [{"t": "**§ 1º** — condenado a 6 anos por roubo, sem sursis, e a 1 mês por ameaça: a pena da ameaça [[não pode ser trocada]] por restritiva de direitos (art. 44).", "lei": {"chave": "CP:157", "rotulo": "CP, art. 157, caput (roubo)", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:\nPena – reclusão, de 6 (seis) a 10 (dez) anos, e multa."}}, {"t": "**§ 2º** — duas penas de prestação de serviços em horários que colidem: cumprem-se [[uma depois da outra]]; prestação pecuniária e serviços, compatíveis, cumprem-se juntas.", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}, {"p": "Como o juiz faz a conta?", "r": "Dosa **cada pena** pelo critério trifásico (art. 68) e [[só depois soma]]. Se os crimes foram julgados em processos diferentes, a soma se faz na **execução** (LEP, art. 111).", "exemplos": [{"t": "**Dosimetria separada** — estelionato dosado em 1 ano e 6 meses e furto em 1 ano e 2 meses, cada um pelo art. 68 → só depois se somam: [[2 anos e 8 meses]].", "lei": {"chave": "CP:171", "rotulo": "CP, art. 171, caput (estelionato)", "texto": "Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio fraudulento:\nPena – reclusão, de 1 (um) a 5 (cinco) anos, e multa."}}]}, {"p": "A soma tem limite?", "r": "Na sentença, não. O limite é de **cumprimento**: [[40 anos]] (art. 75). E a prescrição corre para **cada crime** isoladamente (art. 119).", "exemplos": [{"t": "**Limite de cumprimento** — quatro homicídios em ocasiões distintas, 15 anos cada: a sentença fixa [[60 anos]], mas o cumprimento para em 40 (art. 75).", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio simples)", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos."}}]}]}, {"titulo": "CONCURSO FORMAL PRÓPRIO (ART. 70)", "cor": "b", "resumo": [{"t": "UMA só ação ou omissão + dois ou mais crimes", "ex": "Um só atropelamento por imprudência mata dois pedestres: uma conduta, dois homicídios culposos."}, {"t": "Sem desígnios autônomos: em regra, culposo ou dolo + culpa", "ex": "O pedreiro joga um tijolo sem olhar e fere dois transeuntes: não quis nenhum dos resultados."}, {"t": "Exasperação: pena mais grave (ou uma, se iguais) + 1/6 a 1/2", "ex": "Dois homicídios culposos de trânsito (2 anos): 2 anos + 1/6 = 2 anos e 4 meses."}, {"t": "Fração conforme o número de crimes: 2 = 1/6 … 6 ou mais = 1/2", "ex": "Roubo de três passageiros com uma só ameaça: 6 anos + 1/5 = 7 anos, 2 meses e 12 dias."}], "lei": [{"chave": "CP:70", "rotulo": "CP, art. 70, caput, 1ª parte", "texto": "Quando o agente, mediante uma só ação ou omissão, pratica dois ou mais crimes, idênticos ou não, aplica-se-lhe a mais grave das penas cabíveis ou, se iguais, somente uma delas, mas aumentada, em qualquer caso, de um sexto até metade."}], "exemplo": "Distraído com o celular, um motorista avança o sinal e atropela duas pessoas na faixa, que morrem. Foi UMA conduta (a direção imprudente) e dois homicídios culposos de trânsito: concurso formal próprio. O juiz aplica a pena de um dos homicídios aumentada de 1/6 (dois crimes).", "pegadinha": "Unidade de AÇÃO não é unidade de ATO: uma ação pode ter vários atos (vários socos numa mesma briga).", "aprofundar": {"doutrina": ["Concurso formal (ou ideal) é a prática de dois ou mais crimes com uma só conduta. É homogêneo (crimes idênticos: duas mortes culposas) ou heterogêneo (crimes diferentes: morte de um e lesão de outro). O que importa é a unidade de CONDUTA, não de ato: a conduta pode fracionar-se em vários atos e continuar sendo uma só ação em sentido jurídico.", "É PRÓPRIO (perfeito) quando não há **desígnios autônomos**: o agente não quis, de forma independente, cada resultado. Ocorre tipicamente em crimes culposos, ou num crime doloso somado a outro culposo (atira para matar A e, por imprudência, fere B). Aplica-se o sistema da **exasperação**: a **pena mais grave**, ou uma só se iguais, aumentada de 1/6 até a metade.", "Critério da fração. O CP não diz como escolher entre 1/6 e 1/2. A jurisprudência consolidada do STJ usa o NÚMERO DE CRIMES: 2 crimes = 1/6; 3 = 1/5; 4 = 1/4; 5 = 1/3; 6 ou mais = 1/2. É a mesma lógica da Súmula 659/STJ (**crime continuado**), mas com teto de metade.", "Natureza jurídica: o concurso formal é favor legal ao réu, porque a unidade de conduta revela menor reprovabilidade do que a prática de várias condutas. Por isso existe o limite do parágrafo único (o concurso formal não pode resultar em pena maior que a soma — passo 5)."], "juris": [{"sumula": "SUM-STJ-659", "tribunal": "STJ", "rotulo": "Súmula 659/STJ (crime continuado; a lógica do número de crimes é usada também no concurso formal)", "texto": "A fração de aumento em razão da prática de crime continuado deve ser fixada de acordo com o número de delitos cometidos, aplicando-se 1/6 pela prática de duas infrações, 1/5 para três, 1/4 para quatro, 1/3 para cinco, 1/2 para seis e 2/3 para sete ou mais infrações."}], "exemplos": ["Um tiro culposo (arma limpa sem verificar) fere três pessoas → três lesões culposas em concurso formal próprio; pena de uma aumentada de 1/5.", "Assaltante, com uma só grave ameaça, rende num ônibus quatro passageiros e leva os bens de cada um → para a jurisprudência do STJ, quatro roubos (patrimônios distintos) em concurso formal; aumento de 1/4.", "Motorista embriagado causa um acidente com uma morte e duas lesões → concurso formal próprio heterogêneo; aplica-se a pena do homicídio culposo, a mais grave, aumentada de 1/5 (três crimes)."], "prova": "Palavras que decidem: 'uma só ação ou omissão' e 'de um sexto até metade'. Atenção: no art. 71 o teto é DOIS TERÇOS; no art. 70 é METADE."}, "perguntas": [{"p": "O que é o concurso formal?", "r": "É a prática de dois ou mais crimes com [[uma só ação ou omissão]]. Pode ser **homogêneo** (duas mortes culposas) ou **heterogêneo** (uma morte e uma lesão).", "exemplos": [{"t": "**Homogêneo** — distraído com o celular, o motorista atropela e mata dois pedestres: dois homicídios culposos de trânsito, uma conduta → 2 anos + 1/6 = [[2 anos e 4 meses]].", "lei": {"chave": "L9503:302", "rotulo": "CTB, art. 302, caput (homicídio culposo no trânsito)", "texto": "Praticar homicídio culposo na direção de veículo automotor:\nPenas - detenção, de dois a quatro anos, e suspensão ou proibição de se obter a permissão ou a habilitação para dirigir veículo automotor."}}, {"t": "**Heterogêneo** — no mesmo atropelamento, um pedestre morre e outro só se fere: aplica-se a pena do mais grave (art. 302, 2 anos) + 1/6 = [[2 anos e 4 meses]].", "lei": {"chave": "L9503:303", "rotulo": "CTB, art. 303, caput (lesão culposa no trânsito)", "texto": "Praticar lesão corporal culposa na direção de veículo automotor:\nPenas - detenção, de seis meses a dois anos e suspensão ou proibição de se obter a permissão ou a habilitação para dirigir veículo automotor."}}]}, {"p": "O que diz o art. 70, 1ª parte?", "r": "Uma conduta e vários crimes: aplica-se a **pena mais grave** (ou uma só, se iguais) [[aumentada de 1/6 até a metade]]. É o sistema da **exasperação**.", "lei": {"chave": "CP:70", "rotulo": "CP, art. 70, caput, 1ª parte", "texto": "Quando o agente, mediante uma só ação ou omissão, pratica dois ou mais crimes, idênticos ou não, aplica-se-lhe a mais grave das penas cabíveis ou, se iguais, somente uma delas, mas aumentada, em qualquer caso, de um sexto até metade."}}, {"p": "Quando ele é próprio?", "r": "Quando [[não há desígnios autônomos]]: o agente não quis cada resultado de forma independente. Ocorre em crimes **culposos** ou em **dolo + culpa** (atira em A e, por descuido, fere B).", "exemplos": [{"t": "**Culpa + culpa** — o pedreiro, sem olhar, joga um tijolo da obra e fere dois transeuntes: duas lesões culposas → 2 meses + 1/6 = [[2 meses e 10 dias]].", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, § 6º (lesão corporal culposa)", "texto": "Se a lesão é culposa: (Vide Lei nº 4.611, de 1965)\nPena - detenção, de dois meses a um ano."}}, {"t": "**Dolo + culpa** — atira para matar A (homicídio, 6 anos) e, por descuido, fere B (lesão culposa, 2 meses): sem desígnios autônomos, é formal próprio; exasperação = 7 anos, mas [[vale a soma, 6 anos e 2 meses]] (passo 5).", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio simples)", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos."}}]}, {"p": "Uma ação é o mesmo que um ato?", "r": "Não. A **ação** em sentido jurídico pode se fracionar em **vários atos** e continuar sendo uma conduta só, como vários socos numa mesma briga. O que conta é a [[unidade de conduta]].", "exemplos": [{"t": "**Vários atos, uma ação** — numa só briga, o agente dá cinco socos no mesmo desafeto: [[uma lesão corporal]] (art. 129), não cinco crimes em concurso.", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, caput (lesão corporal)", "texto": "Ofender a integridade corporal ou a saúde de outrem:\nPena - detenção, de três meses a um ano."}}]}, {"p": "Como escolher a fração entre 1/6 e 1/2?", "r": "Pelo [[número de crimes]]: 2 = 1/6; 3 = 1/5; 4 = 1/4; 5 = 1/3; 6 ou mais = 1/2. É a lógica da **Súmula 659/STJ**, mas com teto de **metade**, e não de dois terços.", "exemplos": [{"t": "**3 crimes = 1/5** — com uma só grave ameaça, o assaltante rende três passageiros do ônibus e leva o celular de cada um: 6 anos + 1/5 = [[7 anos, 2 meses e 12 dias]].", "lei": {"chave": "CP:157", "rotulo": "CP, art. 157, caput (roubo)", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:\nPena – reclusão, de 6 (seis) a 10 (dez) anos, e multa."}}, {"t": "**6 ou mais = 1/2** — a mesma cena com seis passageiros: 6 anos + 1/2 = [[9 anos]], o teto do art. 70.", "lei": {"chave": "CP:157", "rotulo": "CP, art. 157, caput (roubo)", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:\nPena – reclusão, de 6 (seis) a 10 (dez) anos, e multa."}}]}, {"p": "Por que a lei pune menos aqui?", "r": "Porque a unidade de conduta revela **menor reprovabilidade**: é um [[favor legal]] ao réu. Por isso o resultado nunca pode ficar acima da soma (**concurso material benéfico**, passo 5)."}]}, {"titulo": "CONCURSO FORMAL IMPRÓPRIO (DESÍGNIOS AUTÔNOMOS)", "cor": "r", "resumo": [{"t": "Uma só conduta DOLOSA, mas cada resultado querido de forma autônoma", "ex": "A bomba no carro do patrão, sabendo que o motorista também morrerá, mata os dois."}, {"t": "Consequência: as penas se SOMAM, como no concurso material", "ex": "Dois homicídios dolosos de 6 anos numa só explosão: 6 + 6 = 12 anos."}, {"t": "Desígnio autônomo cabe com dolo direto e, para o STJ, com dolo eventual", "ex": "Acelerar contra a torcida rival aceitando matar quem estiver na frente: dolo eventual, penas somadas."}, {"t": "Continua sendo concurso FORMAL (uma conduta); só a pena é somada", "ex": "A explosão é uma conduta só (formal), mas a pena é a do art. 69: soma."}], "lei": [{"chave": "CP:70", "rotulo": "CP, art. 70, caput, 2ª parte", "texto": "As penas aplicam-se, entretanto, cumulativamente, se a ação ou omissão é dolosa e os crimes concorrentes resultam de desígnios autônomos, consoante o disposto no artigo anterior."}], "exemplo": "Para matar o patrão, o funcionário põe uma bomba no carro dele, sabendo que o motorista também estará lá dentro e morrerá. Uma só explosão, mas ele quis (ou aceitou) as duas mortes: concurso formal impróprio. As penas dos dois homicídios dolosos se somam.", "pegadinha": "Impróprio exige conduta DOLOSA: crime culposo nunca tem desígnios autônomos.", "aprofundar": {"doutrina": ["O concurso formal é IMPRÓPRIO (imperfeito) quando a conduta única é dolosa e os crimes resultam de **desígnios autônomos** — o agente, com uma só ação, persegue ou aceita cada resultado de forma independente. A lei, aqui, retira o favor da **exasperação**: as penas se aplicam cumulativamente, 'consoante o disposto no artigo anterior' (art. 69). A classificação continua sendo concurso formal; muda só o sistema de pena.", "Desígnio autônomo é a pluralidade de vontades dirigidas a resultados distintos. O exemplo da bomba é o clássico do **dolo direto** de segundo grau (dolo de consequências necessárias): a morte do motorista é efeito colateral certo do meio escolhido. Há também quem, com um só tiro de fuzil, quer matar duas pessoas alinhadas.", "**Dolo eventual**. Parte da doutrina sustenta que 'desígnio' exige vontade dirigida, portanto **dolo direto**. Prevalece na jurisprudência do STJ que os **desígnios autônomos** abrangem também o dolo eventual: basta que o agente tenha assumido o risco de cada resultado de modo independente. Ponto CONTROVERTIDO na doutrina; em prova objetiva, siga a posição dos tribunais superiores.", "Latrocínio com várias vítimas: tema também controvertido. Para a jurisprudência do STJ, uma só subtração com duas ou mais mortes gera vários latrocínios em **concurso formal impróprio**; há decisões e doutrina que veem crime único, com a pluralidade de mortes valorada na pena-base. Sinalize a controvérsia e verifique a posição atual antes da prova."], "juris": [], "exemplos": ["Agente envenena a garrafa de água de uma reunião para matar o sócio, sabendo que os outros dois presentes também beberão → três homicídios dolosos, concurso formal impróprio, penas somadas.", "Agente atira para matar A e, por descuido, atinge B, que sofre lesão → dolo + culpa, sem desígnios autônomos → concurso formal PRÓPRIO (exasperação).", "Motorista que dispara de propósito contra a multidão de torcedores rivais, aceitando matar quem estiver no caminho → para o STJ, dolo eventual compatível com desígnios autônomos; penas somadas."], "prova": "Palavras que decidem: 'ação ou omissão DOLOSA' e 'desígnios autônomos' → 'cumulativamente'. Se o enunciado diz 'culposo', é concurso formal próprio."}, "perguntas": [{"p": "O que é o concurso formal impróprio?", "r": "É a conduta única **dolosa** em que cada resultado nasce de [[desígnios autônomos]]: o agente, com uma ação só, quer ou aceita cada crime de forma independente.", "exemplos": [{"t": "**Desígnios autônomos** — para matar o patrão, o funcionário põe uma bomba no carro sabendo que o motorista também morrerá: dois homicídios, mínima de 6 anos cada → [[6 + 6 = 12 anos]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio simples)", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos."}}]}, {"p": "O que diz o art. 70, 2ª parte?", "r": "Se a conduta é dolosa e os crimes vêm de desígnios autônomos, as penas [[se somam]], como no art. 69. A lei retira o favor da **exasperação**.", "lei": {"chave": "CP:70", "rotulo": "CP, art. 70, caput, 2ª parte", "texto": "As penas aplicam-se, entretanto, cumulativamente, se a ação ou omissão é dolosa e os crimes concorrentes resultam de desígnios autônomos, consoante o disposto no artigo anterior."}}, {"p": "Continua sendo concurso formal?", "r": "Sim. Há [[uma só conduta]], então a classificação é de **concurso formal**; o que muda é só o sistema de pena, que passa a ser o **cúmulo material**."}, {"p": "Cabe concurso formal impróprio com crime culposo?", "r": "Não. O impróprio exige [[conduta DOLOSA]]; crime **culposo** nunca tem desígnios autônomos. Atirar em A e ferir B por descuido é **concurso formal próprio**.", "exemplos": [{"t": "**Culposo** — motorista que fura o sinal e mata dois pedestres não quis nenhuma morte: [[formal próprio]], 2 anos + 1/6 = 2 anos e 4 meses, nunca a soma.", "lei": {"chave": "L9503:302", "rotulo": "CTB, art. 302, caput (homicídio culposo no trânsito)", "texto": "Praticar homicídio culposo na direção de veículo automotor:\nPenas - detenção, de dois a quatro anos, e suspensão ou proibição de se obter a permissão ou a habilitação para dirigir veículo automotor."}}, {"t": "**Doloso com desígnios** — o atirador dispara uma rajada para matar os dois rivais que conversam lado a lado: quis as duas mortes → [[12 anos, penas somadas]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio simples)", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos."}}]}, {"p": "E com dolo eventual?", "r": "Parte da doutrina exige **dolo direto**. Prevalece no STJ que os desígnios autônomos abrangem também o [[dolo eventual]]: basta assumir o risco de cada resultado. Em prova objetiva, siga os tribunais.", "exemplos": [{"t": "**Dolo eventual** — o motorista acelera de propósito contra a torcida rival, aceitando matar quem estiver na frente, e mata três: para o STJ, desígnios autônomos → 6 × 3 = [[18 anos]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio simples)", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos."}}]}, {"p": "Qual o exemplo clássico?", "r": "A bomba no carro para matar o patrão, sabendo que o motorista também morrerá: **dolo direto de segundo grau** quanto ao motorista. Uma explosão, dois homicídios dolosos, [[penas somadas]].", "exemplos": [{"t": "**Bomba no carro** — se fosse formal próprio, seriam 6 anos + 1/6 = 7 anos; como há desígnios autônomos, [[6 + 6 = 12 anos]]: a lei retira o favor da exasperação.", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio simples)", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos."}}]}]}, {"titulo": "CONCURSO MATERIAL BENÉFICO", "cor": "r", "resumo": [{"t": "A exasperação não pode dar pena MAIOR que a soma", "ex": "Homicídio (6 anos) + lesão culposa (2 meses): exasperação de 7 anos supera a soma de 6 anos e 2 meses."}, {"t": "Se 'mais grave + aumento' superar a soma, aplica-se a soma", "ex": "No mesmo caso, o juiz aplica 6 anos e 2 meses, e não 7 anos."}, {"t": "Garante que o favor legal não vire prejuízo ao réu", "ex": "Quem pratica uma só conduta nunca recebe pena maior que quem praticou duas."}, {"t": "Vale também para o crime continuado (art. 71, p.ú.)", "ex": "Dois roubos continuados de 6 anos: o triplo (18) cede à soma (12 anos)."}], "lei": [{"chave": "CP:70", "rotulo": "CP, art. 70, parágrafo único", "texto": "Parágrafo único - Não poderá a pena exceder a que seria cabível pela regra do art. 69 deste Código."}], "exemplo": "Um homem atira para matar o desafeto e, sem querer, o projétil fere de raspão um ciclista. Homicídio doloso (pena de 6 anos) + lesão culposa (2 meses): pela exasperação seriam 6 anos + 1/6 = 7 anos; pela soma, 6 anos e 2 meses. Como a soma é menor, aplica-se a soma.", "pegadinha": "O parágrafo único favorece o réu: não é regra que permite somar 'para punir mais'.", "aprofundar": {"doutrina": ["O **concurso material benéfico** (ou favorável) é a válvula do parágrafo único do art. 70: a **exasperação** existe para beneficiar o réu, e não pode acabar punindo mais do que puniria a simples soma do art. 69. O juiz faz as duas contas — exasperação e cúmulo — e aplica a menor.", "O problema aparece quando os crimes têm penas muito diferentes: um grave (homicídio doloso) e um leve (lesão culposa). O aumento mínimo de 1/6 sobre a pena alta passa a ser maior que a pena inteira do crime leve. Nesse caso, somar é melhor para o réu.", "O art. 71, parágrafo único (**crime continuado específico**), manda observar 'as regras do parágrafo único do art. 70': por isso a doutrina estende o **concurso material benéfico** também ao crime continuado. Na prática, a comparação é sempre entre a pena exasperada e a **soma das penas** efetivamente dosadas."], "juris": [], "exemplos": ["Homicídio doloso (6 anos) + lesão culposa (2 meses) com um só disparo → exasperação: 7 anos; soma: 6 anos e 2 meses → aplica-se a soma (art. 70, p.ú.).", "Dois homicídios culposos de trânsito com penas de 2 anos cada → exasperação: 2 anos e 4 meses; soma: 4 anos → aplica-se a exasperação (é menor)."], "prova": "A banca descreve o caso e pede a pena final. Faça as duas contas. Palavra que decide: 'não poderá a pena exceder'."}, "perguntas": [{"p": "O que é o concurso material benéfico?", "r": "É a regra que impede a **exasperação** de dar pena [[maior que a soma]]. Se a pena aumentada superar o cúmulo, aplica-se o **cúmulo material**.", "exemplos": [{"t": "**Soma menor** — com um só disparo, o agente mata o desafeto (6 anos) e fere de raspão um ciclista (lesão culposa, 2 meses): exasperação = 7 anos; soma = [[6 anos e 2 meses, que prevalece]].", "lei": {"chave": "CP:129", "rotulo": "CP, art. 129, § 6º (lesão corporal culposa)", "texto": "Se a lesão é culposa: (Vide Lei nº 4.611, de 1965)\nPena - detenção, de dois meses a um ano."}}]}, {"p": "O que diz o art. 70, parágrafo único?", "r": "A pena do concurso formal [[não pode passar]] da que resultaria da soma do art. 69. O juiz faz as **duas contas** e aplica a menor.", "lei": {"chave": "CP:70", "rotulo": "CP, art. 70, parágrafo único", "texto": "Parágrafo único - Não poderá a pena exceder a que seria cabível pela regra do art. 69 deste Código."}}, {"p": "Quando o problema aparece?", "r": "Quando as penas são **muito diferentes**: um crime grave e um leve. O aumento mínimo de 1/6 sobre a pena alta fica [[maior que a pena inteira]] do crime leve, e somar passa a ser melhor para o réu.", "exemplos": [{"t": "**Penas distantes** — homicídio doloso (6 anos) + lesão culposa (2 meses): o 1/6 sobre 6 anos dá 1 ano, mais que a lesão inteira → [[aplica-se a soma]].", "lei": {"chave": "CP:121", "rotulo": "CP, art. 121, caput (homicídio simples)", "texto": "Matar alguem:\nPena - reclusão, de seis a vinte anos."}}, {"t": "**Penas próximas** — num só gesto, leva as mochilas de dois estudantes (dois furtos, 1 ano cada): exasperação = 1 ano e 2 meses; soma = 2 anos → [[aplica-se a exasperação]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}, {"p": "Como fica a conta no exemplo do disparo?", "r": "Homicídio doloso (6 anos) + lesão culposa (2 meses): **exasperação** = 7 anos; **soma** = 6 anos e 2 meses. Aplica-se [[a soma]], porque é menor."}, {"p": "Vale também para o crime continuado?", "r": "Sim. O art. 71, parágrafo único, manda observar as regras do parágrafo único do art. 70; a doutrina estende a regra ao **crime continuado**. O favor legal [[nunca vira prejuízo]] ao réu.", "exemplos": [{"t": "**Continuado específico** — dois roubos contra vítimas diferentes, 6 anos cada: o juiz quer triplicar (18 anos), mas a soma é 12 → a pena [[não passa de 12 anos]].", "lei": {"chave": "CP:157", "rotulo": "CP, art. 157, caput (roubo)", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:\nPena – reclusão, de 6 (seis) a 10 (dez) anos, e multa."}}]}]}, {"titulo": "CRIME CONTINUADO COMUM (ART. 71)", "cor": "b", "resumo": [{"t": "Várias condutas + crimes da MESMA ESPÉCIE + mesmas condições", "ex": "Cinco bicicletas furtadas, uma por dia, no mesmo bicicletário: furtos continuados."}, {"t": "Condições: tempo, lugar, maneira de execução e semelhantes", "ex": "Mesma cidade, intervalo de poucos dias e o mesmo modo de agir ligam os furtos."}, {"t": "STJ e STF: teoria objetivo-subjetiva — exige unidade de desígnios", "ex": "O golpista que aplica o mesmo golpe do boleto falso em três clientes, num plano só, continua o crime."}, {"t": "Pena de um crime + 1/6 a 2/3, conforme o número (Súmula 659/STJ)", "ex": "Dez furtos continuados: 1 ano + 2/3 = 1 ano e 8 meses."}, {"t": "Habitualidade criminosa NÃO é continuidade", "ex": "O ladrão profissional com quatro furtos sem plano comum soma: 4 anos."}], "lei": [{"chave": "CP:71", "rotulo": "CP, art. 71, caput", "texto": "Quando o agente, mediante mais de uma ação ou omissão, pratica dois ou mais crimes da mesma espécie e, pelas condições de tempo, lugar, maneira de execução e outras semelhantes, devem os subseqüentes ser havidos como continuação do primeiro, aplica-se-lhe a pena de um só dos crimes, se idênticas, ou a mais grave, se diversas, aumentada, em qualquer caso, de um sexto a dois terços."}], "exemplo": "Uma caixa de supermercado, durante dez dias seguidos, tira R$ 50 do caixa no fim do expediente, sempre do mesmo jeito. São dez furtos, mas, pelas mesmas condições de tempo, lugar e modo, os seguintes são a continuação do primeiro: crime continuado. Pena de um furto aumentada de 2/3 (sete ou mais).", "pegadinha": "Ficção jurídica: são vários crimes tratados como um só PARA A PENA; prescrição e outros efeitos seguem cada crime.", "aprofundar": {"doutrina": ["Natureza: o Brasil adota a teoria da FICÇÃO JURÍDICA (Carrara): há vários crimes, mas a lei os trata como um só para fins de pena. As teorias da unidade real (um só crime de fato) e mista (um terceiro crime) não prevalecem. O instituto nasceu para evitar penas desproporcionais a quem pratica pequenos delitos em série.", "Requisitos objetivos: (1) pluralidade de condutas; (2) crimes da **MESMA ESPÉCIE**; (3) homogeneidade de tempo, lugar, modo de execução e outras condições semelhantes. 'Mesma espécie': para a jurisprudência majoritária do STJ, crimes previstos no mesmo tipo penal (por isso roubo e extorsão, ou roubo e latrocínio, não se continuam); parte da doutrina aceita crimes que protegem o mesmo bem jurídico (furto e apropriação indébita). Ponto CONTROVERTIDO. Tempo: a jurisprudência usa como parâmetro um intervalo de até cerca de 30 dias entre os crimes; lugar: mesma cidade ou cidades vizinhas.", "Requisito subjetivo. A Exposição de Motivos da reforma de 1984 sinaliza a **teoria objetiva pura** (bastam os requisitos objetivos). Mas STJ e STF adotam a **teoria OBJETIVO-SUBJETIVA** (mista): além dos requisitos objetivos, exige-se **unidade de desígnios** — os crimes devem estar ligados por um plano comum, um aproveitando a oportunidade do anterior. Por isso a reiteração criminosa ou habitualidade (o 'profissional do crime') não gera continuidade: é **concurso material**.", "Pena: a de um só crime, se idênticas, ou a mais grave, se diversas, aumentada de 1/6 a 2/3. O critério da fração é o NÚMERO DE INFRAÇÕES (Súmula 659/STJ): 2 = 1/6; 3 = 1/5; 4 = 1/4; 5 = 1/3; 6 = 1/2; 7 ou mais = 2/3. Se houver concurso formal e continuidade nos mesmos fatos, a jurisprudência aplica só o aumento da continuidade, para evitar bis in idem."], "juris": [{"sumula": "SUM-STJ-659", "tribunal": "STJ", "rotulo": "Súmula 659/STJ", "texto": "A fração de aumento em razão da prática de crime continuado deve ser fixada de acordo com o número de delitos cometidos, aplicando-se 1/6 pela prática de duas infrações, 1/5 para três, 1/4 para quatro, 1/3 para cinco, 1/2 para seis e 2/3 para sete ou mais infrações."}, {"sumula": "SUM-STF-711", "tribunal": "STF", "rotulo": "Súmula 711/STF", "texto": "A lei penal mais grave aplica-se ao crime continuado ou ao crime permanente, se a sua vigência é anterior à cessação da continuidade ou da permanência."}], "exemplos": ["Funcionário que, por três meses, desvia mercadorias do estoque toda semana, sempre pelo mesmo método → furtos continuados (mais de sete) → pena de um aumentada de 2/3.", "Agente que vive de assaltos, em bairros e cidades diferentes, sem plano comum → habitualidade criminosa: concurso material, sem continuidade (teoria objetivo-subjetiva).", "Agente rouba um pedestre e, dias depois, pratica extorsão contra outro → crimes de espécies diferentes para o STJ → concurso material."], "prova": "Palavras que decidem: 'mesma espécie', 'condições de tempo, lugar, maneira de execução' e 'continuação do primeiro'. Teto de DOIS TERÇOS. Se o enunciado fala em 'habitualidade' ou 'reiteração', a resposta é concurso material."}, "perguntas": [{"p": "O que é o crime continuado?", "r": "São **vários crimes da mesma espécie**, praticados em condições semelhantes, que a lei trata [[como um só para a pena]]. O Brasil adota a teoria da **ficção jurídica**.", "exemplos": [{"t": "**Série de furtos** — em cinco dias seguidos, o agente furta uma bicicleta por dia no mesmo bicicletário, do mesmo jeito: cinco furtos → 1 ano + 1/3 = [[1 ano e 4 meses]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}, {"p": "O que diz o art. 71, caput?", "r": "Várias condutas, crimes da mesma espécie e mesmas condições de **tempo, lugar e modo**: aplica-se a pena de um só crime (ou a mais grave) [[aumentada de 1/6 a 2/3]].", "lei": {"chave": "CP:71", "rotulo": "CP, art. 71, caput", "texto": "Quando o agente, mediante mais de uma ação ou omissão, pratica dois ou mais crimes da mesma espécie e, pelas condições de tempo, lugar, maneira de execução e outras semelhantes, devem os subseqüentes ser havidos como continuação do primeiro, aplica-se-lhe a pena de um só dos crimes, se idênticas, ou a mais grave, se diversas, aumentada, em qualquer caso, de um sexto a dois terços."}}, {"p": "O que é crime da mesma espécie?", "r": "Para a maioria do STJ, crimes previstos [[no mesmo tipo penal]]; por isso **roubo e extorsão** não se continuam. Parte da doutrina aceita crimes que protegem o mesmo **bem jurídico**. Ponto controvertido.", "exemplos": [{"t": "**Mesmo tipo** — três furtos seguidos no mesmo bairro e pelo mesmo modo: todos do art. 155 → [[continuidade]], 1 ano + 1/5 = 1 ano, 2 meses e 12 dias.", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}, {"t": "**Tipos diferentes** — rouba um pedestre e, dias depois, extorque outro: para o STJ não são da mesma espécie → [[concurso material]], 6 + 4 = 10 anos.", "lei": {"chave": "CP:158", "rotulo": "CP, art. 158, caput (extorsão)", "texto": "Constranger alguém, mediante violência ou grave ameaça, e com o intuito de obter para si ou para outrem indevida vantagem econômica, a fazer, tolerar que se faça ou deixar de fazer alguma coisa:\nPena - reclusão, de quatro a dez anos, e multa."}}]}, {"p": "Basta preencher os requisitos objetivos?", "r": "A Exposição de Motivos sinaliza a **teoria objetiva pura**, mas STJ e STF adotam a **teoria objetivo-subjetiva**: exige-se também [[unidade de desígnios]], um plano comum ligando os crimes.", "exemplos": [{"t": "**Com unidade de desígnios** — o golpista aplica, numa semana, o mesmo golpe do boleto falso em três clientes, num plano só: estelionatos continuados → 1 ano + 1/5 = [[1 ano, 2 meses e 12 dias]].", "lei": {"chave": "CP:171", "rotulo": "CP, art. 171, caput (estelionato)", "texto": "Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio fraudulento:\nPena – reclusão, de 1 (um) a 5 (cinco) anos, e multa."}}, {"t": "**Sem unidade de desígnios** — o ladrão que vive de furtos, sem plano comum, em cidades distantes: quatro furtos → [[4 anos, somados]] (art. 69).", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}, {"p": "Como se escolhe a fração?", "r": "Pelo número de infrações (**Súmula 659/STJ**): 2 = 1/6; 3 = 1/5; 4 = 1/4; 5 = 1/3; 6 = 1/2; [[7 ou mais = 2/3]].", "exemplos": [{"t": "**2 infrações = 1/6** — dois furtos continuados: 1 ano + 1/6 = [[1 ano e 2 meses]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}, {"t": "**7 ou mais = 2/3** — dez furtos continuados: 1 ano + 2/3 = [[1 ano e 8 meses]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}, {"p": "O criminoso habitual tem continuidade?", "r": "Não. **Habitualidade** ou **reiteração criminosa** não é continuação, porque falta a unidade de desígnios. O 'profissional do crime' responde em [[concurso material]].", "exemplos": [{"t": "**Habitualidade** — o 'profissional' com quatro furtos sem plano comum responde pela soma: [[4 anos]], e não 1 ano + 1/4 = 1 ano e 3 meses da continuidade.", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto": "Subtrair, para si ou para outrem, coisa alheia móvel:\nPena – reclusão, de 1 (um) a 6 (seis) anos, e multa."}}]}]}, {"titulo": "CRIME CONTINUADO ESPECÍFICO (ART. 71, P.Ú.)", "cor": "r", "resumo": [{"t": "Crimes DOLOSOS + vítimas DIFERENTES + violência ou grave ameaça à pessoa", "ex": "Três roubos à mão armada contra pessoas diferentes no mesmo ponto de ônibus."}, {"t": "Aumento ATÉ O TRIPLO, guiado pelas circunstâncias judiciais", "ex": "Roubo de 6 anos pode chegar a 18, conforme culpabilidade, antecedentes e motivos."}, {"t": "Limites: concurso material benéfico (70, p.ú.) e 40 anos (75)", "ex": "Dois homicídios de 6 anos: o triplo (18) fica limitado à soma (12 anos)."}, {"t": "Superou a antiga Súmula 605/STF (que vedava continuidade nos crimes contra a vida)", "ex": "Três homicídios por vingança, em dias seguidos e pelo mesmo modo, admitem continuidade."}], "lei": [{"chave": "CP:71", "rotulo": "CP, art. 71, parágrafo único", "texto": "Parágrafo único - Nos crimes dolosos, contra vítimas diferentes, cometidos com violência ou grave ameaça à pessoa, poderá o juiz, considerando a culpabilidade, os antecedentes, a conduta social e a personalidade do agente, bem como os motivos e as circunstâncias, aumentar a pena de um só dos crimes, se idênticas, ou a mais grave, se diversas, até o triplo, observadas as regras do parágrafo único do art. 70 e do art. 75 deste Código."}], "exemplo": "Em uma semana, um assaltante armado rouba, sempre no mesmo ponto de ônibus e pelo mesmo modo, três pessoas diferentes. Os crimes são dolosos, contra vítimas distintas e com grave ameaça: crime continuado específico. O juiz pode aumentar a pena de um roubo até o triplo.", "pegadinha": "Os três requisitos são cumulativos: faltando vítimas diferentes ou violência à pessoa, volta-se ao caput (até 2/3).", "aprofundar": {"doutrina": ["O parágrafo único criou o **crime continuado ESPECÍFICO** (qualificado), para crimes graves contra a pessoa. Requisitos, além dos do caput: crimes dolosos; **vítimas diferentes**; **violência ou grave ameaça** à PESSOA (violência contra coisa não basta). Antes da reforma de 1984, a Súmula 605/STF vedava a continuidade nos crimes contra a vida; a nova redação a superou expressamente.", "Pena: o juiz pode aumentar a de um só crime (ou a mais grave) **ATÉ O TRIPLO**, considerando a culpabilidade, os antecedentes, a conduta social, a personalidade, os motivos e as circunstâncias — isto é, elementos do art. 59. O mínimo, segundo a doutrina, continua sendo 1/6 (o do caput). A jurisprudência do STJ considera o número de crimes somado a essas circunstâncias para fixar a fração.", "Limites expressos: (a) o parágrafo único do art. 70 — a pena não pode exceder a soma (**concurso material benéfico**); (b) o art. 75 — o cumprimento não passa de **40 anos**. O triplo, portanto, é teto que se ajusta à soma real das penas.", "Crimes sexuais e de homicídio podem ser objeto da continuidade específica quando presentes os requisitos, inclusive a **unidade de desígnios** exigida pela jurisprudência (passo 6). Sem ela, é **concurso material**."], "juris": [], "exemplos": ["Agente mata, por vingança, três integrantes de uma família, em dias seguidos, pelo mesmo modo → homicídios dolosos contra vítimas diferentes com violência → continuidade específica, aumento até o triplo, sem ultrapassar a soma.", "Agente furta, em três noites seguidas, três carros de vizinhos diferentes → não há violência ou grave ameaça à pessoa → continuidade COMUM (caput), aumento de 1/5.", "Agente rouba duas vezes a MESMA vítima → falta 'vítimas diferentes' → continuidade comum."], "prova": "Palavras que decidem: 'dolosos', 'vítimas diferentes', 'violência ou grave ameaça à pessoa', 'até o triplo'. A banca costuma dizer que a Súmula 605/STF ainda vale: está superada."}, "perguntas": [{"p": "O que é o crime continuado específico?", "r": "É a continuidade em crimes graves contra a pessoa, com pena [[até o triplo]]. Também chamado de **continuado qualificado**.", "exemplos": [{"t": "**Três roubos** — em uma semana, o assaltante armado rouba três pessoas no mesmo ponto de ônibus: pena de um roubo (6 anos) [[até o triplo, 18 anos]], que aqui coincide com a soma.", "lei": {"chave": "CP:157", "rotulo": "CP, art. 157, caput (roubo)", "texto": "Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência:\nPena – reclusão, de 6 (seis) a 10 (dez) anos, e multa."}}]}, {"p": "O que diz o art. 71, parágrafo único?", "r": "Crimes **dolosos**, contra **vítimas diferentes**, com **violência ou grave ameaça à pessoa**: o juiz pode aumentar a pena de um crime [[até o triplo]], conforme as circunstâncias, respeitados o art. 70, p.ú., e o art. 75.", "lei": {"chave": "CP:71", "rotulo": "CP, art. 71, parágrafo único", "texto": "Parágrafo único - Nos crimes dolosos, contra vítimas diferentes, cometidos com violência ou grave ameaça à pessoa, poderá o juiz, considerando a culpabilidade, os antecedentes, a conduta social e a personalidade do agente, bem como os motivos e as circunstâncias, aumentar a pena de um só dos crimes, se idênticas, ou a mais grave, se diversas, até o triplo, observadas as regras do parágrafo único do art. 70 e do art. 75 deste Código."}}, {"p": "Os requisitos são alternativos?", "r": "Não, são [[cumulativos]]. Faltando **vítimas diferentes** (duas vezes a mesma vítima) ou **violência à pessoa** (furto de carros), volta-se ao caput: até 2/3.", "exemplos": [{"t": "**Sem violência à pessoa** — três carros de vizinhos furtados em três tardes seguidas: continuidade COMUM → 1 ano + 1/5 = [[1 ano, 2 meses e 12 dias]].", "lei": {"chave": "CP:155", "rotulo": "CP, art. 155, caput (furto)", "texto"
